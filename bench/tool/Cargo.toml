[package]
name = "swell-bench-exec"
description = "Runs one engine process for the benchmark harness of bench/ and prints its wall time and peak resident set."
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]
resolver = "3"

[dependencies]
nix = { version = "0.30", default-features = false, features = ["resource", "signal"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
