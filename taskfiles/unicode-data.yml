version: '3'

tasks:
  unicode-data-check:
    desc: Check every file of the vendored Unicode data against its SOURCE line and the required paths.
    silent: true
    vars:
      UNICODE_DATA_DIR: '{{.UNICODE_DATA_DIR | default "data/unicode/17.0.0"}}'
      UNICODE_DATA_REQUIRED: >-
        {{.UNICODE_DATA_REQUIRED | default "ucd/UnicodeData.txt ucd/SpecialCasing.txt ucd/CaseFolding.txt
        ucd/CompositionExclusions.txt ucd/DerivedNormalizationProps.txt ucd/PropertyAliases.txt
        ucd/PropertyValueAliases.txt ucd/Scripts.txt ucd/ScriptExtensions.txt ucd/PropList.txt
        ucd/DerivedCoreProperties.txt ucd/extracted/DerivedGeneralCategory.txt
        ucd/extracted/DerivedBinaryProperties.txt ucd/emoji/emoji-data.txt
        emoji/emoji-sequences.txt emoji/emoji-zwj-sequences.txt LICENSE"}}
    env:
      UNICODE_DATA_DIR: '{{.UNICODE_DATA_DIR}}'
      UNICODE_DATA_REQUIRED: '{{.UNICODE_DATA_REQUIRED}}'
    cmds:
      - |
        if [ -d "$UNICODE_DATA_DIR" ]; then
          (cd "$UNICODE_DATA_DIR" && find . -type f ! -path ./SOURCE -exec sha256sum {} +)
        fi | LC_ALL=C sort -k 2 | awk '
          BEGIN {
            dir = ENVIRON["UNICODE_DATA_DIR"]
            source = dir "/SOURCE"
            bad = 0
          }
          {
            hash = $1
            path = substr($0, length($1) + 2)
            sub(/^[ *]?\.\//, "", path)
            actual[path] = hash
            nf++
            files[nf] = path
          }
          END {
            ln = 0
            while ((getline line < source) > 0) {
              ln++
              n = split(line, f, " ")
              if (n != 3 || length(f[1]) != 64 || f[1] ~ /[^0-9a-f]/) {
                print "SOURCE:" ln ": not <sha256> <path> <address>"
                bad = 1
                continue
              }
              if (!(f[2] in count)) {
                ns++
                listed[ns] = f[2]
              }
              count[f[2]]++
              expected[f[2]] = f[1]
            }
            for (i = 1; i <= nf; i++) {
              p = files[i]
              if (!(p in count)) {
                print p ": no SOURCE line"
                bad = 1
              } else if (count[p] > 1) {
                print p ": " count[p] " SOURCE lines"
                bad = 1
              } else if (actual[p] != expected[p]) {
                print p ": sha256 " actual[p] ", SOURCE gives " expected[p]
                bad = 1
              }
            }
            for (i = 1; i <= ns; i++) {
              if (!(listed[i] in actual)) {
                print listed[i] ": in SOURCE, missing"
                bad = 1
              }
            }
            nr = split(ENVIRON["UNICODE_DATA_REQUIRED"], req, " ")
            for (i = 1; i <= nr; i++) {
              if (!(req[i] in actual)) {
                print req[i] ": required, missing"
                bad = 1
              }
            }
            if (bad) {
              exit 1
            }
            print dir ": " nf " file(s), each with the SHA-256 its SOURCE line gives; " nr " required path(s) present"
          }
        '
