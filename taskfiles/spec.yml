version: '3'

vars:
  SPEC_REFUSALS_MAX: '{{.SPEC_REFUSALS_MAX | default 32}}'
  SPEC_OUT: '{{.SPEC_OUT | default ".out"}}'
  SPEC_SYNTHESIZE_LOG: '{{.SPEC_SYNTHESIZE_LOG | default (printf "%s/synthesize.log" .SPEC_OUT)}}'
  SPEC_CONFORM_LOG: '{{.SPEC_CONFORM_LOG | default (printf "%s/conform.log" .SPEC_OUT)}}'

tasks:
  validate:
    desc: Validate the host interface specification under spec/; a warning fails it.
    silent: true
    cmds:
      - mkdir -p '{{.SPEC_OUT}}'
      - ess --strict-requires specify validate --path spec > '{{.SPEC_OUT}}/validate.log' 2>&1 || { cat '{{.SPEC_OUT}}/validate.log'; exit 1; }
      - if grep '^warning' '{{.SPEC_OUT}}/validate.log'; then exit 1; fi
      - tail -n 1 '{{.SPEC_OUT}}/validate.log'

  suite:
    desc: Synthesize the conformance suite with the authored scenarios; more refusals than SPEC_REFUSALS_MAX fail it.
    silent: true
    cmds:
      - mkdir -p '{{.SPEC_OUT}}'
      - ess verify conform synthesize --path spec --scenarios spec --out '{{.SPEC_OUT}}/suite.json' > '{{.SPEC_OUT}}/synthesize.log' 2>&1 || { cat '{{.SPEC_OUT}}/synthesize.log'; exit 1; }
      - tail -n 1 '{{.SPEC_OUT}}/synthesize.log'
      - task: suite-ceiling
        vars:
          SPEC_SYNTHESIZE_LOG: '{{.SPEC_OUT}}/synthesize.log'

  suite-ceiling:
    desc: Fail when a synthesize log has more refused lines than SPEC_REFUSALS_MAX, naming both numbers.
    silent: true
    cmds:
      - |
        r=$(grep -c '^refused:' '{{.SPEC_SYNTHESIZE_LOG}}' || true)
        if [ "$r" -gt {{.SPEC_REFUSALS_MAX}} ]; then
          echo "suite: $r refusal(s) above the ceiling SPEC_REFUSALS_MAX={{.SPEC_REFUSALS_MAX}}"
          exit 1
        fi

  conform:
    desc: Run the suite against the interpreter built into ess; every scenario must pass.
    silent: true
    deps: [suite]
    cmds:
      - ess verify conform run --path spec --suite '{{.SPEC_OUT}}/suite.json' --target interpreted --report-format 2 --report-out '{{.SPEC_OUT}}/report.json' > '{{.SPEC_OUT}}/conform.log' 2>&1 || { grep -E '^  (failed|error) ' '{{.SPEC_OUT}}/conform.log' || true; tail -n 1 '{{.SPEC_OUT}}/conform.log'; exit 1; }
      - task: conform-summary
        vars:
          SPEC_CONFORM_LOG: '{{.SPEC_OUT}}/conform.log'

  conform-summary:
    desc: Print the last line of a conformance run log; fail unless all of its n > 0 scenarios passed, none failed, errored or was unsupported.
    silent: true
    cmds:
      - |
        last=$(tail -n 1 '{{.SPEC_CONFORM_LOG}}')
        echo "$last"
        if ! printf '%s\n' "$last" | awk '/^ *[0-9]+ scenarios: [0-9]+ passed, 0 failed, 0 error, 0 unsupported$/ && $1 == $3 && $1 > 0 { ok = 1 } END { exit !ok }'; then
          grep -E '^  (failed|error) ' '{{.SPEC_CONFORM_LOG}}' || true
          echo "conform: the last line of {{.SPEC_CONFORM_LOG}} is not <n> scenarios: <n> passed, 0 failed, 0 error, 0 unsupported"
          exit 1
        fi
