version: '3'

set: [pipefail]

vars:
  RUNNER_FORM: CI=true GITHUB_ACTIONS=true CARGO_TERM_COLOR=always CARGO_INCREMENTAL=0
  CPU_BOUNDS_BY_CORES: "16:245"
  RELEASE_TARGETS: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc

tasks:
  forge-check:
    desc: Fail when the gate's compiler or check-runner's variables differ from what the forge's runner has, or when the release workflow and its documents disagree; runs toolchain-check, runner-env-check and release-targets-check.
    summary: |
      The local gate equals the forge (the organization's rule of that name; story
      local-gate-equals-forge). Runs toolchain-check, then runner-env-check, then
      release-targets-check (story releases-ship-static-binaries); each prints its line, and
      the first that fails stops it. Reads no build output and builds nothing.
    silent: true
    cmds:
      - task: toolchain-check
      - task: runner-env-check
      - task: release-targets-check

  release-targets-check:
    desc: Fail when the release workflow does not build the release's seven targets, a musl and a Windows binary with the C runtime linked in and checked so, or when docs/releasing.md or website/docs/embedding.md names or counts other archives than it builds.
    summary: |
      Fail when the release workflow does not build the release's targets with the C runtime
      linked in where it must be and checked so, or when the documents name or count other
      archives than it builds (story releases-ship-static-binaries). Reads, under GATE_ROOT
      (default .), .github/workflows/release-build.yml, docs/releasing.md and
      website/docs/embedding.md as text, in one awk program; it executes nothing of them and
      writes no file.

      The workflow is read as written in this repository, two blanks per level; comment lines,
      also those of a run block, count as nothing. The targets are the "- target:" lines of
      the build matrix, each with the "archive:" line of its entry. It fails, one line each,
      when:
        - the matrix has no target, or differs from RELEASE_TARGETS of taskfiles/forge.yml
          (the seven targets of a release): "...: the build matrix lacks <target>" or "...:
          builds <target>, which is not a target of a release";
        - a target <arch>-unknown-linux-gnu has no <arch>-unknown-linux-musl beside it:
          "release-targets-check: <file>: builds <gnu> and not <musl>; a static musl binary
          goes beside each glibc one";
        - the Build step, the one step of the build job whose run has "cargo build", does not
          have this shape: a branch of 'case "$TARGET" in ... esac' whose line is
          'flags="$flags ... -C target-feature=+crt-static ..."' (the blank after -C
          optional), then 'export RUSTFLAGS="$flags"' after that esac, then the cargo build
          line, and no 'flags=' that starts anew after that esac. The patterns of the branches
          that add +crt-static are matched, as shell patterns, against each target of the
          matrix: a -linux-musl or -windows-msvc target that meets none, or another target
          that meets one, fails, and so does +crt-static on a line outside such a branch.
          Other lines of the step (an echo, rustc -vV, an expression in the cargo call) are
          not read;
        - no step checks the linking: for each -linux-musl target a step whose env TARGET is
          the matrix target, whose if: holds for the target, which has no continue-on-error
          but false (nor its job), and whose run has a branch of 'case "$TARGET" in' with a
          pattern that matches the target and that runs "readelf -d", looks for "(NEEDED)"
          and runs "docker run"; for each -windows-msvc target the same with "dumpbin",
          "VCRUNTIME" and "api-ms-win-crt". An if: is read when it is
          endsWith(matrix.target, '<suffix>') joined by ||, and fails otherwise;
        - one of the two documents names no archive swell-<placeholder>-<target>.<archive>
          for a target of the matrix: "release-targets-check: <doc>: names no archive
          swell-<version>-<target>.<archive>, which <file> builds";
        - one of the two documents names a file swell-<placeholder or x.y.z>-<name>.<ext>, any
          extension, that the matrix does not build: "release-targets-check: <doc>:<line>:
          names the archive swell-<version>-<name>.<ext>, which <file> does not build";
        - docs/releasing.md lacks one of the six sentences that count this release, or one
          counts another number. They are fixed phrases, each on one line, and no other
          sentence is read (one about earlier releases, or "two targets" for the musl pair,
          is not a count of this release): "from it for <n> targets", "Its assets are the <n>
          archives", "Download the <n> archives", "`ls` counts <n> archives" with n the
          number of targets of the matrix, and "with the <n> files as assets", "its assets are
          <n>:" with n that number and one (SHA256SUMS); n in words up to twenty or in digits.
          The lines: "release-targets-check: <doc>: lacks the sentence "<phrase>"" and
          "release-targets-check: <doc>:<line>: says "<phrase>"; <file> builds <n> archives,
          so it is <word>".
      It prints "release-targets-check: <n> target(s) in <file>, the release's targets; musl
      and Windows built with +crt-static and their linking checked; <doc> and <doc> name each
      archive and no other, and <doc> counts <n> archives and <n+1> assets".
    vars:
      GATE_ROOT: '{{.GATE_ROOT | default "."}}'
    env:
      GATE_ROOT: '{{.GATE_ROOT}}'
      RELEASE_TARGETS: '{{.RELEASE_TARGETS}}'
    silent: true
    cmds:
      - |
        if [ "$GATE_ROOT" = . ]; then prefix=; else prefix=$GATE_ROOT/; fi
        wf=${prefix}.github/workflows/release-build.yml
        rel=${prefix}docs/releasing.md
        emb=${prefix}website/docs/embedding.md
        for file in "$wf" "$rel" "$emb"; do
          [ -f "$file" ] || { echo "release-targets-check: $file is missing"; exit 1; }
        done
        awk -v wf="$wf" -v rel="$rel" -v emb="$emb" -v want="$RELEASE_TARGETS" '
          function trim(s) { sub(/^[ \t]+/, "", s); sub(/[ \t]+$/, "", s); return s }
          function unquote(s) {
            s = trim(s)
            sub(/[ \t]+#.*$/, "", s)
            if (s ~ /^".*"$/ || s ~ /^\047.*\047$/) s = substr(s, 2, length(s) - 2)
            return s
          }
          function depth(s) { match(s, /^ */); return RLENGTH }
          function glob(p, s,    re, i, c) {
            p = unquote(p)
            re = ""
            for (i = 1; i <= length(p); i++) {
              c = substr(p, i, 1)
              if (c == "*") re = re ".*"
              else if (c == "?") re = re "."
              else if (c ~ /[A-Za-z0-9_-]/) re = re c
              else re = re "[" c "]"
            }
            return s ~ ("^" re "$")
          }
          function globany(pats, s,    ps, np, q) {
            np = split(pats, ps, /[ \t]*[|][ \t]*/)
            for (q = 1; q <= np; q++) if (glob(ps[q], s)) return 1
            return 0
          }
          # runsfor(step, target): 1 when the step runs for the target, 0 when not, -1 when
          # its if: is not of the form the check reads.
          function runsfor(s, t,    cond, parts, k, i, part, suffix, any) {
            if (!(s in sif)) return 1
            cond = sif[s]
            sub(/^\$[{][{][ \t]*/, "", cond)
            sub(/[ \t]*[}][}]$/, "", cond)
            k = split(cond, parts, /[|][|]/)
            any = 0
            for (i = 1; i <= k; i++) {
              part = trim(parts[i])
              if (part !~ /^endsWith\(matrix\.target,[ \t]*\047[^\047]*\047\)$/) return -1
              suffix = part
              sub(/^endsWith\(matrix\.target,[ \t]*\047/, "", suffix)
              sub(/\047\)$/, "", suffix)
              if (suffix != "" && length(t) >= length(suffix) && substr(t, length(t) - length(suffix) + 1) == suffix) any = 1
            }
            return any
          }
          function word(k) { return k in words ? words[k] : k }
          function fail(msg) { print "release-targets-check: " msg; bad++ }
          BEGIN {
            split("one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty", w, " ")
            for (i = 1; i <= 20; i++) { words[i] = w[i]; value[w[i]] = i }
            # The sentences of docs/releasing.md that count this release: the text before the
            # number, the text after it, and how many more than the targets it counts.
            na = split("from it for |Its assets are the |Download the |`ls` counts |with the |its assets are ", apre, "|")
            split(" targets| archives| archives| archives| files as assets|:", apost, "|")
            split("0 0 0 0 1 1", aextra, " ")
            pat_case = "^[^ ()]+([ \t]*[|][ \t]*[^ ()]+)*[)]"
            pat_crt = "-C[ \t]*target-feature=([^ \"]*,)?[+]crt-static"
          }
          FILENAME == wf {
            raw = $0
            if (inrun) {
              if (raw ~ /^[ \t]*$/ || depth(raw) >= 10) {
                nrun[step]++
                runline[step, nrun[step]] = substr(raw, 11)
                next
              }
              inrun = 0
            }
            if (raw ~ /^[ \t]*#/ || raw ~ /^[ \t]*$/) next
            d = depth(raw)
            text = trim(raw)
            sub(/[ \t]+#.*$/, "", text)
            if (text ~ /^- target:/) {
              t = text
              sub(/^- target:/, "", t)
              t = unquote(t)
              if (!(t in built)) { order[++n] = t; built[t] = "" }
              next
            }
            if (text ~ /^archive:/ && t != "") {
              a = text
              sub(/^archive:/, "", a)
              built[t] = unquote(a)
              next
            }
            if (d == 0) { injobs = (text == "jobs:"); next }
            if (!injobs) next
            if (d == 2) { job = text; sub(/:.*$/, "", job); next }
            if (d == 4 && text ~ /^continue-on-error:/) { v = text; sub(/^continue-on-error:/, "", v); jobcoe[job] = unquote(v); next }
            if (d == 6 && text ~ /^- /) { step++; stepjob[step] = job; text = trim(substr(text, 3)); d = 8; inenv = 0 }
            if (!step) next
            if (d == 8) {
              inenv = (text == "env:")
              if (text ~ /^name:/) { v = text; sub(/^name:/, "", v); sname[step] = unquote(v) }
              if (text ~ /^if:/) { v = text; sub(/^if:/, "", v); sif[step] = trim(v) }
              if (text ~ /^continue-on-error:/) { v = text; sub(/^continue-on-error:/, "", v); scoe[step] = unquote(v) }
              if (text ~ /^run:[ \t]*[|>][-+]?$/) inrun = 1
              else if (text ~ /^run:/) { v = text; sub(/^run:/, "", v); nrun[step] = 1; runline[step, 1] = unquote(v) }
              next
            }
            if (d == 10 && inenv && text ~ /^TARGET:/) { v = text; sub(/^TARGET:/, "", v); senv[step] = trim(v) }
            next
          }
          {
            line = $0
            while (match(line, /swell-(<[^<>]+>|[0-9]+\.[0-9]+\.[0-9]+)-[A-Za-z0-9_]+(-[A-Za-z0-9_]+)+\.[A-Za-z0-9]+(\.[A-Za-z0-9]+)*/)) {
              name = substr(line, RSTART, RLENGTH)
              line = substr(line, RSTART + RLENGTH)
              sub(/^swell-(<[^<>]+>|[0-9]+\.[0-9]+\.[0-9]+)-/, "", name)
              dot = index(name, ".")
              target = substr(name, 1, dot - 1)
              ext = substr(name, dot + 1)
              named[FILENAME, target "." ext] = 1
              if (!(target in built) || built[target] != ext)
                fail(FILENAME ":" FNR ": names the archive swell-<version>-" target "." ext ", which " wf " does not build")
            }
            if (FILENAME != rel) next
            for (k = 1; k <= na; k++) {
              if (!match($0, apre[k] "([a-z]+|[0-9]+)" apost[k])) continue
              phrase = substr($0, RSTART, RLENGTH)
              count = substr(phrase, length(apre[k]) + 1)
              count = substr(count, 1, length(count) - length(apost[k]))
              seen[k]++
              if (count ~ /^[0-9]+$/) c = count + 0
              else if (count in value) c = value[count]
              else c = -1
              if (c != n + aextra[k]) fail(rel ":" FNR ": says \"" phrase "\"; " wf " builds " n " archives, so it is " word(n + aextra[k]))
            }
          }
          END {
            if (n == 0) { fail(wf ": no target in the build matrix"); exit 1 }
            k = split(want, wants, /[ \t]+/)
            for (i = 1; i <= k; i++) {
              if (wants[i] == "") continue
              wanted[wants[i]] = 1
              if (!(wants[i] in built)) fail(wf ": the build matrix lacks " wants[i] "; a release has the targets of RELEASE_TARGETS (taskfiles/forge.yml)")
            }
            for (i = 1; i <= n; i++) {
              t = order[i]
              if (!(t in wanted)) fail(wf ": builds " t ", which is not a target of a release (RELEASE_TARGETS, taskfiles/forge.yml)")
              if (t ~ /-unknown-linux-gnu$/) {
                musl = t
                sub(/-gnu$/, "-musl", musl)
                if (!(musl in built)) fail(wf ": builds " t " and not " musl "; a static musl binary goes beside each glibc one")
              }
            }
            # The run of each step without its comment lines.
            builds = 0
            for (s = 1; s <= step; s++) {
              body = ""
              for (j = 1; j <= nrun[s]; j++) if (trim(runline[s, j]) !~ /^#/) body = body runline[s, j] "\n"
              runtext[s] = body
              if (body ~ /cargo[ \t]+build/) { builds++; buildstep = s }
            }
            # The Build step, read as text: the branches of case "$TARGET" that add +crt-static.
            if (builds != 1) fail(wf ": " builds " step(s) of the build job run cargo build; the check reads one")
            else {
              s = buildstep
              cd = 0; td = 0; br = 0; crtn = 0; casecrt = 0; crtesac = 0; exportat = 0; cargoat = 0; resetat = 0
              for (j = 1; j <= nrun[s]; j++) {
                l = trim(runline[s, j])
                if (l == "" || l ~ /^#/) continue
                if (l ~ /^case[ \t].*[ \t]in$/) { cd++; if (cd == 1 && l ~ /^case[ \t]+"?\$[{]?TARGET[}]?"?[ \t]+in$/) td = 1; continue }
                if (l == "esac") { if (cd == 1 && td) { if (casecrt) crtesac = j; td = 0; br = 0; casecrt = 0 }; cd--; continue }
                if (td && cd == 1 && l ~ pat_case) {
                  br++
                  pats = l
                  sub(/\).*$/, "", pats)
                  l = trim(substr(l, length(pats) + 2))
                }
                if (l ~ pat_crt) {
                  if (td && cd == 1 && br && l ~ /^flags="\$flags[ \t][^"]*"[ \t]*(;;)?$/) { crtpats[++crtn] = pats; casecrt = 1 }
                  else fail(wf ": the Build step sets -C target-feature=+crt-static outside a branch of case \"$TARGET\" that adds it to flags (" l ")")
                }
                if (l ~ /^export[ \t]+RUSTFLAGS="\$flags"$/) exportat = j
                if (l ~ /^flags=/ && l !~ /^flags="\$flags/) resetat = j
                if (l ~ /cargo[ \t]+build/) cargoat = j
              }
              for (i = 1; i <= n; i++) {
                t = order[i]
                m = 0
                for (c = 1; c <= crtn; c++) if (globany(crtpats[c], t)) m = 1
                if ((t ~ /-linux-musl$/ || t ~ /-windows-msvc$/) && !m)
                  fail(wf ": no branch of case \"$TARGET\" in the Build step adds -C target-feature=+crt-static for " t)
                if (t !~ /-linux-musl$/ && t !~ /-windows-msvc$/ && m)
                  fail(wf ": the Build step adds -C target-feature=+crt-static for " t ", which links the C library of its system dynamically")
              }
              if (crtn) {
                if (exportat <= crtesac) fail(wf ": the Build step has no export RUSTFLAGS=\"$flags\" after the case that adds +crt-static")
                else if (cargoat <= exportat) fail(wf ": the Build step runs cargo build before it exports RUSTFLAGS")
                if (resetat > crtesac) fail(wf ": the Build step sets flags anew after the case that adds +crt-static")
              }
            }
            # The steps that check the linking, and which branch of their case on TARGET does what.
            checks = 0
            for (s = 1; s <= step; s++) {
              if (runtext[s] !~ /\(NEEDED\)/ && runtext[s] !~ /dumpbin/) continue
              checks++
              cd = 0; td = 0; br = 0
              for (j = 1; j <= nrun[s]; j++) {
                l = trim(runline[s, j])
                if (l == "" || l ~ /^#/) continue
                if (l ~ /^case[ \t].*[ \t]in$/) { cd++; if (l ~ /^case[ \t]+"?\$[{]?TARGET[}]?"?[ \t]+in$/ && !td) td = cd; continue }
                if (l == "esac") { if (cd == td) { td = 0; br = 0 }; cd--; continue }
                if (td && cd == td && l ~ pat_case) {
                  br++
                  pats = l
                  sub(/\).*$/, "", pats)
                  bpats[s, br] = pats
                  nbr[s] = br
                  l = substr(l, length(pats) + 2)
                }
                if (td && cd >= td && br) {
                  low = tolower(l)
                  if (l ~ /readelf[ \t]+-d/) has[s, br, "readelf"] = 1
                  if (l ~ /\(NEEDED\)/) has[s, br, "needed"] = 1
                  if (l ~ /docker[ \t]+run/) has[s, br, "docker"] = 1
                  if (l ~ /dumpbin/) has[s, br, "dumpbin"] = 1
                  if (low ~ /vcruntime/) has[s, br, "vcruntime"] = 1
                  if (low ~ /api-ms-win-crt/) has[s, br, "apicrt"] = 1
                }
              }
            }
            if (checks == 0) fail(wf ": no step checks the linking of the binary (readelf -d and (NEEDED), or dumpbin)")
            for (i = 1; checks && i <= n; i++) {
              t = order[i]
              if (t ~ /-linux-musl$/) { need1 = "readelf"; need2 = "needed"; need3 = "docker"; what = "readelf -d, (NEEDED) and docker run in a branch of case \"$TARGET\" that matches it" }
              else if (t ~ /-windows-msvc$/) { need1 = "dumpbin"; need2 = "vcruntime"; need3 = "apicrt"; what = "dumpbin, VCRUNTIME and api-ms-win-crt in a branch of case \"$TARGET\" that matches it" }
              else continue
              found = 0
              for (s = 1; s <= step; s++) {
                if (runtext[s] !~ /\(NEEDED\)/ && runtext[s] !~ /dumpbin/) continue
                r = runsfor(s, t)
                if (r < 0) { fail(wf ": the step \"" sname[s] "\" has an if: the check does not read (" sif[s] "); it reads endsWith(matrix.target, \047<suffix>\047) joined by ||"); continue }
                if (r == 0) { fail(wf ": the step \"" sname[s] "\" does not run for " t ": its if: is " sif[s]); continue }
                if (senv[s] !~ /^\$[{][{][ \t]*matrix\.target[ \t]*[}][}]$/) { fail(wf ": the step \"" sname[s] "\" does not set TARGET to the matrix target"); continue }
                if ((s in scoe) && scoe[s] != "false") { fail(wf ": the step \"" sname[s] "\" has continue-on-error: " scoe[s] "; a failed check would not fail the job"); continue }
                if ((stepjob[s] in jobcoe) && jobcoe[stepjob[s]] != "false") { fail(wf ": the job " stepjob[s] " has continue-on-error: " jobcoe[stepjob[s]] "; a failed check would not fail the run"); continue }
                for (b = 1; b <= nbr[s]; b++)
                  if (globany(bpats[s, b], t) && has[s, b, need1] && has[s, b, need2] && has[s, b, need3]) found = 1
              }
              if (!found) fail(wf ": no step checks " t " (" what ")")
            }
            for (i = 1; i <= n; i++) {
              t = order[i]
              split(rel "|" emb, docs, "|")
              for (dd = 1; dd <= 2; dd++)
                if (!((docs[dd], t "." built[t]) in named))
                  fail(docs[dd] ": names no archive swell-<version>-" t "." built[t] ", which " wf " builds")
            }
            for (k = 1; k <= na; k++)
              if (!seen[k]) fail(rel ": lacks the sentence \"" apre[k] word(n + aextra[k]) apost[k] "\"")
            if (bad) exit 1
            print "release-targets-check: " n " target(s) in " wf ", the release\047s targets; musl and Windows built with +crt-static and their linking checked; " rel " and " emb " name each archive and no other, and " rel " counts " n " archives and " n + 1 " assets"
          }
        ' "$wf" "$rel" "$emb"

  toolchain-check:
    desc: Fail when a workflow names a compiler version, or when rustc in the gate is not the channel rust-toolchain.toml pins.
    summary: |
      Fail when a workflow names a compiler version, or when rustc in the gate is not the
      channel rust-toolchain.toml pins (story local-gate-equals-forge, point 1). The compiler
      is pinned in one place, GATE_ROOT/rust-toolchain.toml (GATE_ROOT default .); rustup
      reads it in the root and in every directory under it, conformance/ess included, and a
      workflow reads the channel from it in a step of its own.

      Its channel must be a version, <major>.<minor>.<patch>. Every
      GATE_ROOT/.github/workflows/*.yml and *.yaml is read outside its comment lines: a
      toolchain input whose value is not an expression of the workflow (a dollar sign and two
      braces, as steps.toolchain.outputs.channel is written there), dtolnay/rust-toolchain
      taken by anything but a commit hash of 40 hex digits, a RUSTUP_TOOLCHAIN variable, a
      "rustup toolchain install", "rustup install", "rustup default" or "rustup override set",
      and "cargo +<toolchain>" are each named as "toolchain-check: <file>:<line>: names a
      compiler (<line>)". Then the components and targets the file names (components = [...],
      targets = [...]; story core-builds-without-std: llvm-tools for nostd-symbols,
      x86_64-unknown-none for nostd-build) must each be an input of the one dtolnay/rust-toolchain
      step of GATE_ROOT/.github/workflows/check.yml, the workflow that runs task check
      (components: and targets:, comma-separated): one it lacks is named as "toolchain-check:
      <workflow>:<line>: the toolchain step lacks the component|target <name>, which
      rust-toolchain.toml names", and a check.yml with no such step or two fails too. rustup
      would install them from the file when cargo first runs, as it did here; the inputs make
      the forge's install the same, in its toolchain step, whatever its rustup does. slow.yml
      (components: clippy, task slow, which builds nothing for the bare target) and
      release-build.yml (targets: the release target of its matrix, no task) are not compared:
      neither runs a step that needs llvm-tools or x86_64-unknown-none, and rustup installs both
      from the file there when cargo first runs. Then "${RUSTC:-rustc} --version" runs in the
      repository root, as cargo runs it in the gate; another version than the channel fails
      with "toolchain-check: rustc in the gate is <version>, <file> pins <channel>". A missing
      file fails too. It prints "toolchain-check: rustc <version>, the channel <file> pins; <n>
      workflow file(s), none names a compiler; <check.yml> installs the <c> component(s) and
      <t> target(s) <file> names".
    vars:
      GATE_ROOT: '{{.GATE_ROOT | default "."}}'
    env:
      GATE_ROOT: '{{.GATE_ROOT}}'
    silent: true
    cmds:
      - |
        if [ "$GATE_ROOT" = . ]; then prefix=; else prefix=$GATE_ROOT/; fi
        file=${prefix}rust-toolchain.toml
        [ -f "$file" ] || { echo "toolchain-check: $file is missing; it pins the compiler"; exit 1; }
        channel=$(awk -F '"' '/^[ \t]*channel[ \t]*=/ { print $2; exit }' "$file")
        printf '%s\n' "$channel" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' ||
          { echo "toolchain-check: $file pins the channel \"$channel\", not a version <major>.<minor>.<patch>"; exit 1; }
        workflows=0
        named=0
        for wf in "${prefix}.github/workflows"/*.yml "${prefix}.github/workflows"/*.yaml; do
          [ -f "$wf" ] || continue
          workflows=$((workflows + 1))
          lines=$(awk -v file="$wf" '
            /^[ \t]*#/ { next }
            {
              text = $0
              sub(/^[ \t]+/, "", text)
              sub(/[ \t]+#.*$/, "", text)
              bad = 0
              if (text ~ /^(- )?toolchain:/) {
                value = text
                sub(/^(- )?toolchain:[ \t]*/, "", value)
                if (value !~ /^\$[{][{]/) bad = 1
              }
              if (text ~ /dtolnay\/rust-toolchain@/) {
                ref = text
                sub(/^.*dtolnay\/rust-toolchain@/, "", ref)
                sub(/[ \t].*$/, "", ref)
                if (length(ref) != 40 || ref !~ /^[0-9a-f]+$/) bad = 1
              }
              if (text ~ /RUSTUP_TOOLCHAIN/) bad = 1
              if (text ~ /rustup[ \t]+(toolchain[ \t]+install|install|default|override[ \t]+set)([ \t]|$)/) bad = 1
              if (text ~ /cargo[ \t]+\+/) bad = 1
              if (bad) print "toolchain-check: " file ":" NR ": names a compiler (" text ")"
            }
          ' "$wf")
          if [ -n "$lines" ]; then
            printf '%s\n' "$lines"
            named=$((named + 1))
          fi
        done
        [ "$workflows" -gt 0 ] || { echo "toolchain-check: no workflow under ${prefix}.github/workflows"; exit 1; }
        if [ "$named" -gt 0 ]; then
          echo "toolchain-check: $named of $workflows workflow file(s) name a compiler; a workflow reads the channel from $file"
          exit 1
        fi
        list() {
          awk -v key="$1" '
            $0 ~ "^[ \t]*" key "[ \t]*=" {
              line = $0
              sub(/^[^=]*=/, "", line)
              while (match(line, /"[^"]*"/)) { print substr(line, RSTART + 1, RLENGTH - 2); line = substr(line, RSTART + RLENGTH) }
            }
          ' "$file"
        }
        components=$(list components | tr "\n" " ")
        targets=$(list targets | tr "\n" " ")
        gate=${prefix}.github/workflows/check.yml
        [ -f "$gate" ] || { echo "toolchain-check: $gate is missing"; exit 1; }
        lacking=$(awk -v file="$gate" -v components="$components" -v targets="$targets" '
          function depth(s) { match(s, /^ */); return RLENGTH }
          /^[ \t]*#/ || /^[ \t]*$/ { next }
          {
            text = $0
            sub(/[ \t]+#.*$/, "", text)
            if (text ~ /dtolnay\/rust-toolchain@/) {
              steps++
              instep = 1
              stepdepth = depth(text)
              if (text ~ /^ *- /) stepdepth += 2
              at = NR
              next
            }
            if (instep && (depth(text) < stepdepth || (depth(text) == stepdepth - 2 && text ~ /^ *- /))) instep = 0
            if (instep && text ~ /^ *(components|targets):/) {
              key = text
              sub(/^ */, "", key)
              sub(/:.*$/, "", key)
              value = text
              sub(/^[^:]*:[ \t]*/, "", value)
              gsub(/["\047]/, "", value)
              n = split(value, words, /[ \t]*,[ \t]*/)
              for (i = 1; i <= n; i++) if (words[i] != "") has[key, words[i]] = 1
            }
          }
          END {
            if (steps != 1) { print "toolchain-check: " file " installs the toolchain in " steps+0 " step(s) through dtolnay/rust-toolchain, not one"; exit }
            n = split(components, want, " ")
            for (i = 1; i <= n; i++) if (want[i] != "" && !(("components", want[i]) in has)) print "toolchain-check: " file ":" at ": the toolchain step lacks the component " want[i] ", which rust-toolchain.toml names (components:)"
            n = split(targets, want, " ")
            for (i = 1; i <= n; i++) if (want[i] != "" && !(("targets", want[i]) in has)) print "toolchain-check: " file ":" at ": the toolchain step lacks the target " want[i] ", which rust-toolchain.toml names (targets:)"
          }
        ' "$gate")
        if [ -n "$lacking" ]; then
          printf '%s\n' "$lacking"
          echo "toolchain-check: $gate does not install what $file names; the step that runs task check needs every component and target of it"
          exit 1
        fi
        ncomp=$(printf '%s\n' "$components" | awk '{ n += NF } END { print n + 0 }')
        ntarg=$(printf '%s\n' "$targets" | awk '{ n += NF } END { print n + 0 }')
        version=$(${RUSTC:-rustc} --version 2>&1) || { echo "toolchain-check: ${RUSTC:-rustc} --version failed: $version"; exit 1; }
        version=$(printf '%s\n' "$version" | awk 'NR == 1 { print $2 }')
        if [ "$version" != "$channel" ]; then
          echo "toolchain-check: rustc in the gate is $version, $file pins $channel"
          exit 1
        fi
        echo "toolchain-check: rustc $version, the channel $file pins; $workflows workflow file(s), none names a compiler; $gate installs the $ncomp component(s) and $ntarg target(s) $file names"

  runner-env-check:
    desc: Fail when check-runner does not set every variable the forge's runner has for task check, or sets one it does not have.
    summary: |
      Fail when check-runner does not set every variable the forge's runner has for task
      check, or sets one it does not have (story local-gate-equals-forge, point 2).

      check-runner sets GATE_RUNNER_ENV (default the RUNNER_FORM of taskfiles/forge.yml:
      CI=true GITHUB_ACTIONS=true CARGO_TERM_COLOR=always CARGO_INCREMENTAL=0), NAME=value
      words separated by blanks. The runner sets CI=true and GITHUB_ACTIONS=true for every
      step; the workflow GATE_ROOT/.github/workflows/check.yml (GATE_ROOT default .) sets the
      rest for the step that runs task check: its env at the top, the env of the job of that
      step, and the step's own env, a later one winning as on the forge. The workflow is read
      as written in this repository, two blanks per level; a step runs task check when its
      run line is exactly "task check". Each variable the workflow sets that check-runner
      does not is named as "runner-env-check: <file>:<line>: the workflow sets NAME=value for
      task check, check-runner does not (GATE_RUNNER_ENV)", one with another value as
      "...: the workflow sets NAME=value, check-runner sets NAME=other", and one that
      check-runner sets and neither the workflow nor the runner does as "runner-env-check:
      check-runner sets NAME=value, which neither <file> nor the runner sets for task check"
      (an empty RUSTC_WRAPPER among them: the forge has no wrapper, and the local gate keeps
      the host's compile cache, the organization's rule "One compile cache"). A workflow
      without a step that runs task check fails too. It prints "runner-env-check:
      check-runner sets <GATE_RUNNER_ENV>: CI and GITHUB_ACTIONS as the runner sets them, and
      the <n> variable(s) <file> sets for task check".
    vars:
      GATE_ROOT: '{{.GATE_ROOT | default "."}}'
      GATE_RUNNER_ENV: '{{.GATE_RUNNER_ENV | default .RUNNER_FORM}}'
    env:
      GATE_ROOT: '{{.GATE_ROOT}}'
      GATE_RUNNER_ENV: '{{.GATE_RUNNER_ENV}}'
    silent: true
    cmds:
      - |
        if [ "$GATE_ROOT" = . ]; then wf=.github/workflows/check.yml; else wf=$GATE_ROOT/.github/workflows/check.yml; fi
        [ -f "$wf" ] || { echo "runner-env-check: $wf is missing"; exit 1; }
        awk -v file="$wf" -v task_env="$GATE_RUNNER_ENV" '
          function trim(s) { sub(/^[ \t]+/, "", s); sub(/[ \t]+$/, "", s); return s }
          function unquote(s) {
            s = trim(s)
            if (s ~ /^".*"$/ || s ~ /^\047.*\047$/) s = substr(s, 2, length(s) - 2)
            return s
          }
          function depth(s) { match(s, /^ */); return RLENGTH }
          # set(scope, name, value, line)
          function set(scope, name, value, line) {
            if (!((scope, name) in val)) { names[scope] = names[scope] " " name }
            val[scope, name] = value
            at[scope, name] = line
          }
          /^[ \t]*#/ || /^[ \t]*$/ { next }
          {
            d = depth($0)
            text = trim($0)
            if (envdepth >= 0 && d <= envdepth) envdepth = -1
            if (envdepth >= 0) {
              if (text ~ /^[A-Za-z_][A-Za-z0-9_]*:/) {
                name = text
                sub(/:.*$/, "", name)
                value = text
                sub(/^[A-Za-z_][A-Za-z0-9_]*:[ \t]*/, "", value)
                set(scope, name, unquote(value), NR)
              }
              next
            }
            if (d == 0) { injobs = (text == "jobs:"); if (text == "env:") { scope = "top"; envdepth = 0 }; next }
            if (!injobs) next
            if (d == 2) { job = text; sub(/:.*$/, "", job); next }
            if (d == 4 && text == "env:") { scope = "job " job; envdepth = 4; next }
            if (d == 6 && text ~ /^- /) { step++; stepjob[step] = job; text = trim(substr(text, 3)); d = 8 }
            if (d == 8 && text == "env:") { scope = "step " step; envdepth = 8; next }
            if (d == 8 && text ~ /^run:/) {
              run = text
              sub(/^run:[ \t]*/, "", run)
              if (unquote(run) == "task check") gate[step] = 1
            }
          }
          BEGIN { envdepth = -1 }
          END {
            for (s in gate) gates++
            if (!gates) { print "runner-env-check: " file ": no step runs task check"; exit 1 }
            # What the runner has for each step that runs task check: top, job, step, later wins.
            for (s in gate) {
              split("top|job " stepjob[s] "|step " s, scopes, "|")
              for (k = 1; k <= 3; k++) {
                n = split(names[scopes[k]], list, " ")
                for (i = 1; i <= n; i++) {
                  wv[list[i]] = val[scopes[k], list[i]]
                  wl[list[i]] = at[scopes[k], list[i]]
                }
              }
            }
            own["CI"] = "true"
            own["GITHUB_ACTIONS"] = "true"
            n = split(task_env, words, /[ \t]+/)
            for (i = 1; i <= n; i++) {
              if (words[i] == "") continue
              if (words[i] !~ /^[A-Za-z_][A-Za-z0-9_]*=/) {
                print "runner-env-check: GATE_RUNNER_ENV holds \"" words[i] "\", not NAME=value"
                bad++
                continue
              }
              name = words[i]
              sub(/=.*$/, "", name)
              value = substr(words[i], length(name) + 2)
              tv[name] = value
              shown = shown (shown == "" ? "" : " ") words[i]
            }
            for (name in own) {
              if (!(name in tv)) { print "runner-env-check: the runner sets " name "=" own[name] " for every step, check-runner does not (GATE_RUNNER_ENV)"; bad++ }
              else if (tv[name] != own[name] && !(name in wv)) { print "runner-env-check: the runner sets " name "=" own[name] ", check-runner sets " name "=" tv[name]; bad++ }
            }
            for (name in wv) {
              count++
              if (!(name in tv)) { print "runner-env-check: " file ":" wl[name] ": the workflow sets " name "=" wv[name] " for task check, check-runner does not (GATE_RUNNER_ENV)"; bad++ }
              else if (tv[name] != wv[name]) { print "runner-env-check: " file ":" wl[name] ": the workflow sets " name "=" wv[name] ", check-runner sets " name "=" tv[name]; bad++ }
            }
            for (name in tv) {
              if (!(name in wv) && !(name in own)) { print "runner-env-check: check-runner sets " name "=" tv[name] ", which neither " file " nor the runner sets for task check"; bad++ }
            }
            if (bad) exit 1
            print "runner-env-check: check-runner sets " shown ": CI and GITHUB_ACTIONS as the runner sets them, and the " count+0 " variable(s) " file " sets for task check"
          }
        ' "$wf"

  check-runner:
    desc: Run task check as the forge's runner runs it, with the variables its workflow sets (GATE_RUNNER_ENV); "task check-runner -- --dry" prints the steps instead.
    summary: |
      Run task check as the forge's runner runs it (the organization's rule "The local gate
      equals the forge"; story local-gate-equals-forge, point 2). The one command before main
      moves: slot task check-runner.

      First runner-env-check, which compares GATE_RUNNER_ENV with what the runner has for the
      step that runs task check in .github/workflows/check.yml; then "env <GATE_RUNNER_ENV>
      task check" in a task process of its own, since a variable of a task's env does not
      reach the tasks it calls; go-task prints that command line before it runs it. "task
      check-runner -- --dry" runs runner-env-check and then the same with --dry --verbose:
      go-task prints each step of check in order ("task: "<step>" started") with its
      commands, in that environment, and runs none of them. Any other word after -- fails.

      Every difference between the forge's runner and a developer's shell that the repository
      knows, and where it is written:
        - the compiler: rust-toolchain.toml, for the root and conformance/ess alike
          (toolchain-check fails on another rustc, and on a workflow that names a version);
        - the debug information of the dev profile: .cargo/config.toml sets debug = false and
          strip = "debuginfo", for the forge and here alike; a cargo config file wins over the
          manifest, and the repository's wins over a developer's own in the cargo home, so the
          setting stays in the repository's config file (the stack tests' frames depend on it,
          AGENTS.md "Commands and the gate"; test-binaries-check shows it on every test
          executable); the stack tests' run with full debug information, cargo's default for a
          dev build, is the profile stack-debug (taskfiles/stack-profiles.yml);
        - the environment: CI, GITHUB_ACTIONS, CARGO_TERM_COLOR, CARGO_INCREMENTAL, here
          (GATE_RUNNER_ENV; runner-env-check holds it equal to the workflow). Variables a
          developer's shell has beyond them (a GATE_ variable, NO_COLOR) are not cleared; the
          gate's first line, gate-vars, names the gate variables in effect;
        - the compile wrapper: the runner has none; check-runner keeps the host's compile
          cache (the organization's rule "One compile cache"), so this one is not reproduced;
        - the thread stack of the stack tests: crates/swell/tests/support/host.rs runs a stack
          test on seven eighths of Limits::min_stack_bytes() (stack_with_room), so that a frame
          that grows fails here first;
        - the files that exist only in a local tree: .cache/ (test262 and the ECMA-262 draft,
          fetched by the gate on the forge), .out/ and target/, all ignored by git. A test
          that lists a directory reads every file in it, tracked or not:
          crates/compiler/tests/compile.rs (tests/sources), crates/syntax/tests/sources.rs,
          crates/swell/tests/language.rs (tests/language), crates/swell/tests/source_scan.rs
          (the src/ of every crate) and crates/test262/tests/expected.rs (its fixtures); an
          untracked file there is read here and absent on the forge. Run the gate in a clean
          checkout to rule it out;
        - the tools: go-task, cargo-nextest and ess at the versions .github/workflows/check.yml
          installs; a developer's shell has its own;
        - the number of cores: the runner has 4, the local machine more, and it is shared, so
          the wall time there says nothing about the runner's. check-runner gives check the
          table GATE_CPU_BOUNDS (default CPU_BOUNDS_BY_CORES of taskfiles/forge.yml), CPU seconds
          per kind of machine keyed by its core count, "<cores>:<CPU seconds>" pairs:
          gate-time-sum (taskfiles/gate-time.yml) fails when the CPU seconds of the test steps
          are over the entry for the core count it runs on, and prints them without a bound
          where there is none. An entry is added or changed only together with a pair of runs,
          the code before the change over it and the change under it, measured on that kind of
          machine and recorded in the same commit (story gate-test-steps-fit-four-cores). The
          entry 16:245 is provisional: it was derived from runs of earlier forms of this tree,
          and its pair under this tree is recorded by the first two check-runner jobs on a
          16-core machine. The forge's 4 cores have no entry: check alone, as the forge runs
          it, has no table, and there the wall time is the measure;
        - the operating system image of the runner, which no task reproduces.
    vars:
      GATE_RUNNER_ENV: '{{.GATE_RUNNER_ENV | default .RUNNER_FORM}}'
      GATE_CPU_BOUNDS: '{{.GATE_CPU_BOUNDS | default .CPU_BOUNDS_BY_CORES}}'
      DRY: '{{if eq .CLI_ARGS "--dry"}}--dry --verbose {{end}}'
    cmds:
      - cmd: |
          case {{shellQuote .CLI_ARGS}} in
            '' | --dry) ;;
            *) echo "check-runner: the one word after -- is --dry, not {{shellQuote .CLI_ARGS}}"; exit 1 ;;
          esac
        silent: true
      - task: runner-env-check
        vars: {GATE_RUNNER_ENV: '{{.GATE_RUNNER_ENV}}'}
      - env {{range splitList " " .GATE_RUNNER_ENV}}{{if .}}{{shellQuote .}} {{end}}{{end}}{{shellQuote .TASK_EXE}} {{.DRY}}check GATE_CPU_BOUNDS={{shellQuote .GATE_CPU_BOUNDS}}
