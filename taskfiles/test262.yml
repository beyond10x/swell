version: '3'

set: [pipefail]

tasks:
  test262:
    desc: Count every test262 case of the pinned checkout per directory, slice and ECMA-262 section with swell-test262, and check the lines against the design and the expected file.
    summary: |
      Count every test262 case of the pinned checkout per directory, slice and ECMA-262 section
      with swell-test262, and check the lines against the design and the expected file.

      Runs "swell-test262 count" (release build) on TEST262_CACHE/TEST262_COMMIT (default
      .cache/test262/<commit of conformance/test262/PIN>, checked by test262-fetch first), the
      swell-slices block of TEST262_DESIGN (default docs/design/engine.md), TEST262_FEATURES
      (default conformance/test262/features.txt), the sections of TEST262_SECTIONS (default
      conformance/test262/sections.txt) and TEST262_EXPECTED (default
      conformance/test262/expected.txt). Its standard output goes to TEST262_OUT/lines.txt
      (default .out/test262), its standard error to TEST262_OUT/count.log.
      It fails, printing both, when the runner exits non-zero: a feature features.txt does not
      list, features.txt not listing exactly the features test262 declares, an excluded feature
      listed as run, a line of the block or of the sections file it cannot read, a section path
      that matches no case, and any printed line that differs from the expected file (printed as
      -<expected line> and +<printed line>, then "test262: <n> line(s) differ from <file>").
      It fails when the directory lines do not sum to the total line, or there is none, and when
      fields 2 to 4 of the slice lines differ from the block after "Its output on this document:"
      in the design, or that block is empty. It prints the total line, the two checks, the
      test262-errors line and "test262: <n> lines equal <expected file>", and names each case
      whose front matter cannot be read (counted run and failed).
    deps: [test262-fetch]
    silent: true
    vars:
      PIN_COMMIT:
        sh: awk '$1 == "commit" {print $2}' conformance/test262/PIN
      TEST262_COMMIT: '{{.TEST262_COMMIT | default .PIN_COMMIT}}'
      TEST262_CACHE: '{{.TEST262_CACHE | default ".cache/test262"}}'
      TEST262_DESIGN: '{{.TEST262_DESIGN | default "docs/design/engine.md"}}'
      TEST262_FEATURES: '{{.TEST262_FEATURES | default "conformance/test262/features.txt"}}'
      TEST262_SECTIONS: '{{.TEST262_SECTIONS | default "conformance/test262/sections.txt"}}'
      TEST262_EXPECTED: '{{.TEST262_EXPECTED | default "conformance/test262/expected.txt"}}'
      TEST262_OUT: '{{.TEST262_OUT | default ".out/test262"}}'
    env:
      TEST262_COMMIT: '{{.TEST262_COMMIT}}'
      TEST262_CACHE: '{{.TEST262_CACHE}}'
      TEST262_DESIGN: '{{.TEST262_DESIGN}}'
      TEST262_FEATURES: '{{.TEST262_FEATURES}}'
      TEST262_SECTIONS: '{{.TEST262_SECTIONS}}'
      TEST262_EXPECTED: '{{.TEST262_EXPECTED}}'
      TEST262_OUT: '{{.TEST262_OUT}}'
    cmds:
      - mkdir -p "$TEST262_OUT"
      - |
        lines="$TEST262_OUT/lines.txt"
        log="$TEST262_OUT/count.log"
        status=0
        cargo run --locked --release -q -p swell-test262 -- count \
          --test262 "$TEST262_CACHE/$TEST262_COMMIT" \
          --design "$TEST262_DESIGN" \
          --features "$TEST262_FEATURES" \
          --sections "$TEST262_SECTIONS" \
          --expected "$TEST262_EXPECTED" > "$lines" 2> "$log" || status=$?
        if [ "$status" -ne 0 ]; then
          cat "$lines" "$log"
          echo "test262: swell-test262 count exited $status"
          exit 1
        fi
        grep '^test262-error ' "$log" || true
        awk -v file="$lines" '
          $1 == "test262" && $2 == "total" { totals++; total = $0; for (i = 3; i <= 9; i++) t[i] = $i; next }
          $1 == "test262" {
            dirs++
            if (NF != 9) { print "test262: not nine fields: " $0; bad = 1 }
            for (i = 3; i <= 9; i++) s[i] += $i
          }
          END {
            if (totals != 1) { print "test262: " totals+0 " total line(s) in " file; exit 1 }
            if (dirs == 0) { print "test262: no directory line in " file; exit 1 }
            for (i = 3; i <= 9; i++) if (s[i] != t[i]) {
              print "test262: field " i " of the directory lines sums to " s[i] ", the total line has " t[i]
              bad = 1
            }
            if (bad) exit 1
            print total
            print "test262: " dirs " directory lines sum to the total"
          }
        ' "$lines"
        awk '$0 == "Its output on this document:" { f = 1; next } f && $0 == "```" { if (body) exit; body = 1; next } body' "$TEST262_DESIGN" | LC_ALL=C sort > "$TEST262_OUT/design-slices.txt"
        awk '$1 == "test262-slice" { print $2, $3, $4 }' "$lines" | LC_ALL=C sort > "$TEST262_OUT/runner-slices.txt"
        n=$(awk 'END { print NR }' "$TEST262_OUT/design-slices.txt")
        if [ "$n" -eq 0 ]; then
          echo "test262: no slice line after \"Its output on this document:\" in $TEST262_DESIGN"
          exit 1
        fi
        if ! diff "$TEST262_OUT/design-slices.txt" "$TEST262_OUT/runner-slices.txt" > "$TEST262_OUT/slices.diff"; then
          echo "test262: the slice lines differ from $TEST262_DESIGN (< design, > runner):"
          cat "$TEST262_OUT/slices.diff"
          exit 1
        fi
        echo "test262: $n slice lines equal the design"
        errors=$(grep '^test262-errors ' "$lines") || { echo "test262: no test262-errors line in $lines"; exit 1; }
        echo "$errors"
        equal=$(grep '^test262: [0-9]* lines equal ' "$log") || { echo "test262: no \"lines equal\" line in $log"; exit 1; }
        echo "$equal"
