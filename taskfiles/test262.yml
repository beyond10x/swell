version: '3'

set: [pipefail]

tasks:
  test262:
    desc: Run every test262 case of the pinned checkout that is run on the engine with swell-test262, count every case per directory, slice and ECMA-262 section, and check the lines against the design and the expected file.
    summary: |
      Run every test262 case of the pinned checkout that is run on the engine with swell-test262,
      count every case per directory, slice and ECMA-262 section, and check the lines against the
      design and the expected file.

      The full run is the lane slow (task slow, through slow-test262); the gate runs the fast
      check test262-check in its place, which reads the committed files and the digest of their
      sources, and test262-expected is the one run that writes both.

      Runs "swell-test262 count" (release build) with TEST262_WORKERS worker threads (default 4)
      and TEST262_RUN (default all; none counts every run case failed without running it, for
      the planted scripts of tests/gate/ that check the counting alone) on
      TEST262_CACHE/TEST262_COMMIT (default .cache/test262/<commit of conformance/test262/PIN>,
      checked by test262-fetch first), the
      swell-slices block of TEST262_DESIGN (default docs/design/engine.md), TEST262_FEATURES
      (default conformance/test262/features.txt), the sections of TEST262_SECTIONS (default
      conformance/test262/sections.txt) and TEST262_EXPECTED (default
      conformance/test262/expected.txt). Its standard output goes to TEST262_OUT/lines.txt
      (default .out/test262), its standard error to TEST262_OUT/count.log, and its run lines
      (--runs) to TEST262_OUT/runs.tsv: one line per run, "test262-run", the slice, the path,
      the mode, the outcome (Passed, Failed or Budget) and what ended the run, separated by
      tabs; with TEST262_RUN=none the file holds no line. Each run of the task writes the file
      of its own TEST262_OUT.
      Each TEST262_ variable is read as a template value, as test262-moves-check reads its own:
      a value given on the command line wins over the same variable exported in the
      environment, and an exported value is used when the command line gives none (a task's
      env: would keep the exported value instead, go-task 3.54.0).
      It fails, printing both, when the runner exits non-zero: a feature features.txt does not
      list, features.txt not listing exactly the features test262 declares, an excluded feature
      listed as run, a line of the block or of the sections file it cannot read, a section path
      that matches no case, and any printed line that differs from the expected file (printed as
      -<expected line> and +<printed line>, then "test262: <n> line(s) differ from <file>").
      It fails when the directory lines do not sum to the total line, or there is none, and when
      fields 2 to 4 of the slice lines differ from the block after "Its output on this document:"
      in the design, or that block is empty. It prints the total line, the two checks with the
      slice lines before the second, the test262-errors line and "test262: <n> lines equal
      <expected file>", and names each case whose front matter cannot be read (counted run and
      failed). To standard error it prints
      the runner's test262-budget line of each run a budget ended, its test262-panic line of
      each run that panicked, its test262-refused line (the runs a refusal of the parser ended,
      each failed whatever the case's negative says), its twenty test262-steps lines (the runs
      with the most steps) and its test262-time line per slice (runs and milliseconds).
    deps: [test262-fetch]
    silent: true
    vars:
      PIN_COMMIT:
        sh: awk '$1 == "commit" {print $2}' conformance/test262/PIN
      TEST262_COMMIT: '{{.TEST262_COMMIT | default .PIN_COMMIT}}'
      TEST262_CACHE: '{{.TEST262_CACHE | default ".cache/test262"}}'
      TEST262_DESIGN: '{{.TEST262_DESIGN | default "docs/design/engine.md"}}'
      TEST262_FEATURES: '{{.TEST262_FEATURES | default "conformance/test262/features.txt"}}'
      TEST262_SECTIONS: '{{.TEST262_SECTIONS | default "conformance/test262/sections.txt"}}'
      TEST262_EXPECTED: '{{.TEST262_EXPECTED | default "conformance/test262/expected.txt"}}'
      TEST262_OUT: '{{.TEST262_OUT | default ".out/test262"}}'
      TEST262_WORKERS: '{{.TEST262_WORKERS | default "4"}}'
      TEST262_RUN: '{{.TEST262_RUN | default "all"}}'
    cmds:
      - |
        root={{shellQuote .TEST262_CACHE}}/{{shellQuote .TEST262_COMMIT}}
        design={{shellQuote .TEST262_DESIGN}}
        features={{shellQuote .TEST262_FEATURES}}
        sections={{shellQuote .TEST262_SECTIONS}}
        expected={{shellQuote .TEST262_EXPECTED}}
        out={{shellQuote .TEST262_OUT}}
        workers={{shellQuote .TEST262_WORKERS}}
        run={{shellQuote .TEST262_RUN}}
        mkdir -p "$out"
        lines="$out/lines.txt"
        log="$out/count.log"
        status=0
        cargo run --locked --release -q -p swell-test262 -- count \
          --test262 "$root" \
          --design "$design" \
          --features "$features" \
          --sections "$sections" \
          --expected "$expected" \
          --workers "$workers" --run "$run" \
          --runs "$out/runs.tsv" > "$lines" 2> "$log" || status=$?
        if [ "$status" -ne 0 ]; then
          cat "$lines" "$log"
          echo "test262: swell-test262 count exited $status"
          exit 1
        fi
        grep '^test262-error ' "$log" || true
        grep -E '^test262-(budget|panic|refused|steps|time) ' "$log" >&2 || true
        awk -v file="$lines" '
          $1 == "test262" && $2 == "total" { totals++; total = $0; for (i = 3; i <= 9; i++) t[i] = $i; next }
          $1 == "test262" {
            dirs++
            if (NF != 9) { print "test262: not nine fields: " $0; bad = 1 }
            for (i = 3; i <= 9; i++) s[i] += $i
          }
          END {
            if (totals != 1) { print "test262: " totals+0 " total line(s) in " file; exit 1 }
            if (dirs == 0) { print "test262: no directory line in " file; exit 1 }
            for (i = 3; i <= 9; i++) if (s[i] != t[i]) {
              print "test262: field " i " of the directory lines sums to " s[i] ", the total line has " t[i]
              bad = 1
            }
            if (bad) exit 1
            print total
            print "test262: " dirs " directory lines sum to the total"
          }
        ' "$lines"
        awk '$0 == "Its output on this document:" { f = 1; next } f && $0 == "```" { if (body) exit; body = 1; next } body' "$design" | LC_ALL=C sort > "$out/design-slices.txt"
        awk '$1 == "test262-slice" { print $2, $3, $4 }' "$lines" | LC_ALL=C sort > "$out/runner-slices.txt"
        n=$(awk 'END { print NR }' "$out/design-slices.txt")
        if [ "$n" -eq 0 ]; then
          echo "test262: no slice line after \"Its output on this document:\" in $design"
          exit 1
        fi
        if ! diff "$out/design-slices.txt" "$out/runner-slices.txt" > "$out/slices.diff"; then
          echo "test262: the slice lines differ from $design (< design, > runner):"
          cat "$out/slices.diff"
          exit 1
        fi
        awk '$1 == "test262-slice"' "$lines"
        echo "test262: $n slice lines equal the design"
        errors=$(grep '^test262-errors ' "$lines") || { echo "test262: no test262-errors line in $lines"; exit 1; }
        echo "$errors"
        equal=$(grep '^test262: [0-9]* lines equal ' "$log") || { echo "test262: no \"lines equal\" line in $log"; exit 1; }
        echo "$equal"

  test262-moves-check:
    desc: Check every line of the list of moved cases against the swell-slices block of the design, the tokens of later parts and the case sources of the pinned checkout.
    summary: |
      Check every line of the list of moved cases against the swell-slices block of the design,
      the tokens of later parts and the case sources of the pinned checkout (AGENTS.md, "A case
      that cannot pass in its slice"; the design, section 12).

      Reads only committed files and the pinned checkout: TEST262_MOVES (default
      conformance/test262/moves.tsv: one line per moved case, "<path> <from> <to> <kind>
      <evidence>" separated by tabs, sorted by path), TEST262_LATER_PARTS (default
      conformance/test262/later-parts.tsv: one line per token, "<token> <slice> <item>"
      separated by tabs), the swell-slices block and the count lines after "Its output on this
      document:" of TEST262_DESIGN (default docs/design/engine.md), and the case sources and
      harness files of TEST262_CACHE/TEST262_COMMIT (default .cache/test262/<commit of
      conformance/test262/PIN>). It never reads .cache/inventory/, a runs.tsv or another commit.
      It fails, naming the file, the line and the path or token, when: a line of the list is not
      five fields, names a path twice or out of byte order, or a case the checkout does not hold;
      <to> is 2 or not a slice from 1 to 19 (no move into an excluded slice), or <from> is not a
      slice from 1 to 19; <to> is not greater than <from> (no line moves a case into a
      delivered slice from a later one, nor keeps it in its slice); the slice the block gives the case (its longest "dir"
      prefix raised by the block's "feature" and "flag" lines, with the features and flags of
      the case's front matter in the checkout; an "exclude" feature excludes it) is not <to>; a
      "part" evidence is not a token of the later parts with slice <to>, or is found neither in
      the case nor in a harness file its front matter includes; a "feature" evidence is not
      among the case's features or the block has no line "feature <evidence> <to>"; <kind> is
      neither; a line of the later parts is not three fields, names a token twice, has a token
      with a tab, a leading or trailing space or two spaces in a row, or names slice 1, 2 or one
      outside 3 to 19; the block, the count lines, the list or the later parts are empty. A
      token of the later parts need not be the evidence of any line: the file is the record of
      the scan that classified the cases, and a token no line names stays in it.
      A token is found by a fixed-string search, as grep -F finds it, in the text of the file
      with its comments removed (// to the end of the line and /* */, outside string and
      template literals; string contents stay, since eval, Function and $262.evalScript read
      strings) and every run of white space (space, tab, line end, form feed, vertical tab)
      read as one space, so a token is written with single spaces and may span a line end. A
      token that starts with a letter, a digit, "_" or "$" is not found after one of these, and
      one that ends with one is not found before one of these: "let" is not found in "delete" or
      "letter", nor in a comment. The files are read as bytes (LC_ALL=C) with CR LF, CR and LF as
      line ends. It prints "test262-moves: <n> case(s) moved, <to>:<count> per target slice;
      slices 1 to 19: <cases> <runs>", the last two summed from the count lines of the design.
    silent: true
    vars:
      PIN_COMMIT:
        sh: awk '$1 == "commit" {print $2}' conformance/test262/PIN
      TEST262_COMMIT: '{{.TEST262_COMMIT | default .PIN_COMMIT}}'
      TEST262_CACHE: '{{.TEST262_CACHE | default ".cache/test262"}}'
      TEST262_DESIGN: '{{.TEST262_DESIGN | default "docs/design/engine.md"}}'
      TEST262_MOVES: '{{.TEST262_MOVES | default "conformance/test262/moves.tsv"}}'
      TEST262_LATER_PARTS: '{{.TEST262_LATER_PARTS | default "conformance/test262/later-parts.tsv"}}'
    cmds:
      - |
        root={{shellQuote .TEST262_CACHE}}/{{shellQuote .TEST262_COMMIT}}
        design={{shellQuote .TEST262_DESIGN}}
        parts={{shellQuote .TEST262_LATER_PARTS}}
        moves={{shellQuote .TEST262_MOVES}}
        [ -d "$root/test" ] || { echo "test262-moves: no pinned checkout at $root"; exit 1; }
        for f in "$design" "$parts" "$moves"; do
          [ -f "$f" ] || { echo "test262-moves: no file $f"; exit 1; }
        done
        LC_ALL=C awk -F'\t' -v root="$root" -v design="$design" -v parts="$parts" -v moves="$moves" '
          function idch(c) { return c ~ /^[A-Za-z0-9_$]$/ }
          function strip(file,    out, line, st, i, n, c, d, q, r, cont) {
            out = ""; st = 0; cont = 0
            while ((r = (getline line < file)) > 0) {
              n = length(line); i = 1
              if ((st == 2 || st == 3) && !cont) st = 0
              cont = 0
              while (i <= n) {
                c = substr(line, i, 1); d = substr(line, i, 2)
                if (st == 1) {
                  if (d == "*/") { st = 0; out = out " "; i += 2; continue }
                  i++; continue
                }
                if (st >= 2) {
                  q = (st == 2) ? "\047" : (st == 3) ? "\"" : "`"
                  if (c == "\\") { if (i == n) cont = 1; out = out d; i += 2; continue }
                  if (c == q) st = 0
                  out = out c; i++; continue
                }
                if (d == "//") break
                if (d == "/*") { st = 1; i += 2; continue }
                if (c == "\\") { out = out d; i += 2; continue }
                if (c == "\047") st = 2
                else if (c == "\"") st = 3
                else if (c == "`") st = 4
                out = out c; i++
              }
              out = out "\n"
            }
            close(file)
            if (r < 0) return "\001"
            gsub(/[ \t\n\r\f\v]+/, " ", out)
            return out
          }
          function has(text, tok,    p, s, a, b, first, last) {
            first = idch(substr(tok, 1, 1)); last = idch(substr(tok, length(tok), 1)); s = text
            while ((p = index(s, tok)) > 0) {
              a = (p > 1) ? substr(s, p - 1, 1) : ""; b = substr(s, p + length(tok), 1)
              if (!(first && idch(a)) && !(last && idch(b))) return 1
              s = substr(s, p + 1)
            }
            return 0
          }
          function trim(s) { gsub(/^[ \t]+|[ \t]+$/, "", s); return s }
          function inl(s) { sub(/^[^\[]*\[/, "", s); sub(/\].*$/, "", s); gsub(/[ \t]/, "", s); return s }
          function meta(file,    line, inm, lkey, key, rest, item, r) {
            M["flags"] = M["features"] = M["includes"] = ""; inm = 0; lkey = ""
            while ((r = (getline line < file)) > 0) {
              if (!inm) { if (line ~ /\/\*---/) inm = 1; continue }
              if (line ~ /---\*\//) break
              if (match(line, /^[a-zA-Z_]+:/)) {
                key = substr(line, 1, RLENGTH - 1); rest = trim(substr(line, RLENGTH + 1)); lkey = ""
                if (key == "flags" || key == "features" || key == "includes") {
                  if (rest ~ /\[/) M[key] = inl(rest)
                  else if (rest != "" && rest !~ /^[|>]/) M[key] = rest
                  else lkey = key
                }
                continue
              }
              if (lkey != "" && match(line, /^[ \t]*-[ \t]*/)) {
                item = trim(substr(line, RLENGTH + 1))
                M[lkey] = (M[lkey] == "") ? item : M[lkey] "," item
              }
            }
            close(file)
            return r >= 0 || inm
          }
          function err(file, n, what, msg) {
            printf "test262-moves: %s:%d: %s: %s\n", file, n, what, msg; bad = 1; lbad = 1
          }
          function slice(path,    p, best, s, n, i, fs, gs, ex) {
            best = -1; s = 0; ex = ""
            for (p in dir) if (index(path, p) == 1 && length(p) > best) { best = length(p); s = dir[p] }
            n = split(M["features"], fs, ",")
            for (i = 1; i <= n; i++) {
              if (fs[i] in excl) ex = "x-" excl[fs[i]]
              else if ((fs[i] in feat) && feat[fs[i]] > s) s = feat[fs[i]]
            }
            n = split(M["flags"], gs, ",")
            for (i = 1; i <= n; i++) if ((gs[i] in flag) && flag[gs[i]] > s) s = flag[gs[i]]
            return (ex != "") ? ex : s
          }
          BEGIN { RS = "\r\n|\r|\n" }
          FILENAME == design {
            if ($0 == "```swell-slices") { inb = 1; next }
            if (inb && $0 == "```") { inb = 0; next }
            if (inb) {
              split($0, w, " "); rules++
              if (w[1] == "dir") dir[w[2]] = w[3] + 0
              else if (w[1] == "feature") { feat[w[2]] = w[3] + 0; fline[w[2], w[3] + 0] = 1 }
              else if (w[1] == "flag") flag[w[2]] = w[3] + 0
              else if (w[1] == "exclude") excl[w[2]] = w[3]
              next
            }
            if ($0 == "Its output on this document:") { out = 1; next }
            if (out == 1 && $0 == "```") { if (body) out = 2; else body = 1; next }
            if (out == 1 && body) {
              split($0, w, " "); counts++
              if (w[1] ~ /^[0-9]+$/ && w[1] + 0 >= 1 && w[1] + 0 <= 19) { cases += w[2]; runs += w[3] }
            }
            next
          }
          FILENAME == parts {
            pn++; lbad = 0
            if (NF != 3 || $1 == "" || $3 == "") { err(parts, FNR, $1, "not three fields: token, slice, item"); next }
            if ($1 ~ /^ | $|  /) err(parts, FNR, $1, "a token with a leading or trailing space or two spaces in a row")
            if ($2 !~ /^[0-9]+$/ || $2 + 0 < 3 || $2 + 0 > 19) err(parts, FNR, $1, "slice " $2 " is not a later slice from 3 to 19")
            if ($1 in ps) err(parts, FNR, $1, "the token is listed twice")
            if (!lbad) ps[$1] = $2 + 0
            next
          }
          FILENAME == moves { mn++; ml[mn] = $0; next }
          END {
            if (rules == 0) { print "test262-moves: no swell-slices block in " design; exit 1 }
            if (counts == 0) { print "test262-moves: no count line after \"Its output on this document:\" in " design; exit 1 }
            if (pn == 0) { print "test262-moves: no line in " parts; exit 1 }
            if (mn == 0) { print "test262-moves: no line in " moves; exit 1 }
            for (i = 1; i <= mn; i++) {
              lbad = 0; n = split(ml[i], f, "\t"); path = f[1]
              if (n != 5) { err(moves, i, path, "not five fields: path, from, to, kind, evidence"); continue }
              if (path in seen) err(moves, i, path, "the path is listed twice")
              else if (i > 1 && path < prev) err(moves, i, path, "not sorted by path (byte order)")
              seen[path] = 1; prev = path
              to = f[3] + 0; from = f[2] + 0; kind = f[4]; ev = f[5]
              if (f[3] !~ /^[0-9]+$/ || to < 1 || to > 19) { err(moves, i, path, "to " f[3] " is not a slice from 1 to 19"); continue }
              if (to == 2) { err(moves, i, path, "the line moves the case into slice 2"); continue }
              if (f[2] !~ /^[0-9]+$/ || from < 1 || from > 19) err(moves, i, path, "from " f[2] " is not a slice from 1 to 19")
              else if (to <= from) err(moves, i, path, "to " f[3] " is not greater than from " f[2])
              file = root "/" path
              if (!meta(file)) { err(moves, i, path, "no such case in " root); continue }
              s = slice(path)
              if (s "" != to "") err(moves, i, path, "the block gives the case slice " s ", not " to)
              if (kind == "part") {
                if (!(ev in ps)) err(moves, i, path, "evidence \"" ev "\" is not a token of " parts)
                else if (ps[ev] != to) err(moves, i, path, "evidence \"" ev "\" is a token of slice " ps[ev] ", not " to)
                else {
                  text = strip(file); found = has(text, ev)
                  k = split(M["includes"], inc, ",")
                  for (j = 1; j <= k && !found; j++) if (inc[j] != "") {
                    t = strip(root "/harness/" inc[j])
                    if (t == "\001") err(moves, i, path, "the included " inc[j] " is not in " root "/harness")
                    else found = has(t, ev)
                  }
                  if (!found) err(moves, i, path, "evidence \"" ev "\" is found neither in the case nor in a harness file it includes")
                }
              } else if (kind == "feature") {
                if (index("," M["features"] ",", "," ev ",") == 0) err(moves, i, path, "evidence \"" ev "\" is not among the features of the case")
                if (!((ev, to) in fline)) err(moves, i, path, "the block has no line \"feature " ev " " to "\"")
              } else err(moves, i, path, "kind \"" kind "\" is neither part nor feature")
              if (!lbad) { moved++; per[to]++ }
            }
            if (bad) exit 1
            line = ""
            for (t = 1; t <= 19; t++) if (t in per) line = line (line == "" ? "" : " ") t ":" per[t]
            printf "test262-moves: %d case(s) moved, %s; slices 1 to 19: %d %d\n", moved, line, cases, runs
          }
        ' "$design" "$parts" "$moves"

  test262-sources:
    desc: Internal. Write the digest of the sources of the expected file to TEST262_OUT/sources.digest and the list it is made of beside it.
    summary: |
      Internal, called by test262-digest, test262-check, test262-expected and slow-test262.

      The sources of the expected file are every file that can change a line the runner prints,
      and no other: the files git lists (tracked, or untracked and not ignored) of GATE_ROOT
      (default .) under crates/*/src/ and as crates/*/Cargo.toml, then Cargo.toml, Cargo.lock,
      .cargo/config.toml, rust-toolchain, rust-toolchain.toml, taskfiles/test262.yml (this file,
      the runner's task file), conformance/test262/PIN, conformance/test262/moves.tsv and
      conformance/test262/later-parts.tsv. Not covered: the tests of the crates
      (crates/*/tests/), the gate's own tests (tests/gate/) and the documents beyond the block
      below, none of which a run line depends on, so a change to a test leaves the committed
      files current. Then TEST262_FEATURES and TEST262_SECTIONS under the names
      conformance/test262/features.txt and conformance/test262/sections.txt, and the
      swell-slices block of TEST262_DESIGN under the name "docs/design/engine.md swell-slices".
      A file git lists that is deleted from the working tree is listed as "deleted <path>".
      Each is one line "<sha256>  <name>" of TEST262_OUT/sources.txt, in byte order; the
      digest is the SHA-256 of that file, written as "test262-sources <sha256>" to
      TEST262_OUT/sources.digest. It fails when git cannot list the files, when there is none,
      when a file named by a variable is missing, and when the design has no swell-slices block.
    silent: true
    vars:
      GATE_ROOT: '{{.GATE_ROOT | default "."}}'
      TEST262_DESIGN: '{{.TEST262_DESIGN | default "docs/design/engine.md"}}'
      TEST262_FEATURES: '{{.TEST262_FEATURES | default "conformance/test262/features.txt"}}'
      TEST262_SECTIONS: '{{.TEST262_SECTIONS | default "conformance/test262/sections.txt"}}'
      TEST262_OUT: '{{.TEST262_OUT | default ".out/test262"}}'
    env:
      GATE_ROOT: '{{.GATE_ROOT}}'
      TEST262_DESIGN: '{{.TEST262_DESIGN}}'
      TEST262_FEATURES: '{{.TEST262_FEATURES}}'
      TEST262_SECTIONS: '{{.TEST262_SECTIONS}}'
      TEST262_OUT: '{{.TEST262_OUT}}'
    cmds:
      - mkdir -p "$TEST262_OUT"
      - |
        out="$TEST262_OUT/sources.txt"
        paths=":(glob)crates/*/src/** :(glob)crates/*/Cargo.toml Cargo.toml Cargo.lock .cargo/config.toml rust-toolchain rust-toolchain.toml taskfiles/test262.yml conformance/test262/PIN conformance/test262/moves.tsv conformance/test262/later-parts.tsv"
        # shellcheck disable=SC2086
        files=$(git -C "$GATE_ROOT" ls-files --cached --others --exclude-standard -- $paths) ||
          { echo "test262-sources: git cannot list the files of $GATE_ROOT"; exit 1; }
        [ -n "$files" ] || { echo "test262-sources: git lists no source of the expected file under $GATE_ROOT"; exit 1; }
        for f in "$TEST262_FEATURES" "$TEST262_SECTIONS" "$TEST262_DESIGN"; do
          [ -f "$f" ] || { echo "test262-sources: no file $f"; exit 1; }
        done
        block=$(awk '$0 == "```swell-slices" { f = 1; next } f && $0 == "```" { exit } f' "$TEST262_DESIGN")
        [ -n "$block" ] || { echo "test262-sources: no swell-slices block in $TEST262_DESIGN"; exit 1; }
        sum() { sha256sum | awk '{ print $1 }'; }
        printf '%s\n' "$files" | LC_ALL=C sort -u > "$TEST262_OUT/sources.listed"
        : > "$TEST262_OUT/sources.present"
        : > "$TEST262_OUT/sources.deleted"
        while IFS= read -r f; do
          if [ -f "$GATE_ROOT/$f" ]; then
            printf '%s\n' "$f" >> "$TEST262_OUT/sources.present"
          else
            printf '%s\n' "$f" >> "$TEST262_OUT/sources.deleted"
          fi
        done < "$TEST262_OUT/sources.listed"
        {
          (cd "$GATE_ROOT" && xargs -r -d '\n' sha256sum --) < "$TEST262_OUT/sources.present" ||
            { echo "test262-sources: sha256sum failed on the files of $GATE_ROOT" >&2; exit 1; }
          sed 's/^/deleted /' "$TEST262_OUT/sources.deleted"
          printf '%s  %s\n' "$(sum < "$TEST262_FEATURES")" conformance/test262/features.txt
          printf '%s  %s\n' "$(sum < "$TEST262_SECTIONS")" conformance/test262/sections.txt
          printf '%s\n' "$block" | { printf '%s  %s\n' "$(sum)" "docs/design/engine.md swell-slices"; }
        } > "$out.unsorted" || exit 1
        LC_ALL=C sort "$out.unsorted" > "$out"
        printf 'test262-sources %s\n' "$(sum < "$out")" > "$TEST262_OUT/sources.digest"

  test262-digest:
    desc: Print the digest of the sources of the expected file, as test262-check computes it, and the number of files it is made of.
    summary: |
      Print the digest of the sources of the expected file (the task test262-sources says which
      files they are), as "test262-sources <sha256>", then "test262-digest: <n> source file(s),
      listed in TEST262_OUT/sources.txt". It reads no checkout and runs nothing.
    silent: true
    vars:
      TEST262_OUT: '{{.TEST262_OUT | default ".out/test262"}}'
    cmds:
      - task: test262-sources
      - |
        cat '{{.TEST262_OUT}}/sources.digest'
        echo "test262-digest: $(awk 'END { print NR }' '{{.TEST262_OUT}}/sources.txt') source file(s), listed in {{.TEST262_OUT}}/sources.txt"

  test262-check:
    desc: The gate's fast check of test262; compare the digest of the sources of the expected file with the committed one, and print the gate's test262 lines from the committed files.
    summary: |
      The gate's check of test262 in the place of the full run, which is the lane slow (task
      slow-test262). It runs no case and reads no checkout.

      Computes the digest of the sources of TEST262_EXPECTED (default
      conformance/test262/expected.txt) as the task test262-sources does, and compares it with
      the test262-sources line of TEST262_DIGEST (default conformance/test262/expected.digest).
      When they differ it fails with "test262-check: the sources digest <computed> differs
      from <committed> in <digest file>; ...": a source changed, and the run that writes both
      files again is task test262-expected. When they are equal it prints, from the committed
      files, the test262-refused line of the digest file, the total line of the expected file,
      "test262: <n> directory lines sum to the total", the test262-slice lines, "test262: <n>
      slice lines equal the design", the test262-errors line, and last "test262: <n> lines of
      <expected file>; sources digest <sha256> equals <digest file>". It fails, as the task
      test262 does, when the directory lines do not sum to the total line or there is none,
      when fields 2 to 4 of the slice lines differ from the block after "Its output on this
      document:" of TEST262_DESIGN or that block is empty, and when a file is missing or has no
      test262-refused, test262-sources or test262-errors line.
    silent: true
    vars:
      TEST262_DESIGN: '{{.TEST262_DESIGN | default "docs/design/engine.md"}}'
      TEST262_EXPECTED: '{{.TEST262_EXPECTED | default "conformance/test262/expected.txt"}}'
      TEST262_DIGEST: '{{.TEST262_DIGEST | default "conformance/test262/expected.digest"}}'
      TEST262_OUT: '{{.TEST262_OUT | default ".out/test262"}}'
    env:
      TEST262_DESIGN: '{{.TEST262_DESIGN}}'
      TEST262_EXPECTED: '{{.TEST262_EXPECTED}}'
      TEST262_DIGEST: '{{.TEST262_DIGEST}}'
      TEST262_OUT: '{{.TEST262_OUT}}'
    cmds:
      - task: test262-sources
      - |
        lines="$TEST262_EXPECTED"
        for f in "$lines" "$TEST262_DIGEST"; do
          [ -f "$f" ] || { echo "test262-check: no file $f"; exit 1; }
        done
        now=$(awk '$1 == "test262-sources" { print $2 }' "$TEST262_OUT/sources.digest")
        was=$(awk '$1 == "test262-sources" { print $2 }' "$TEST262_DIGEST")
        [ -n "$was" ] || { echo "test262-check: no test262-sources line in $TEST262_DIGEST"; exit 1; }
        if [ "$now" != "$was" ]; then
          echo "test262-check: the sources digest $now differs from $was in $TEST262_DIGEST; a source of $lines changed (listed in $TEST262_OUT/sources.txt): task test262-expected runs test262 and writes both files"
          exit 1
        fi
        refused=$(grep '^test262-refused ' "$TEST262_DIGEST") || { echo "test262-check: no test262-refused line in $TEST262_DIGEST"; exit 1; }
        echo "$refused"
        awk -v file="$lines" '
          $1 == "test262" && $2 == "total" { totals++; total = $0; for (i = 3; i <= 9; i++) t[i] = $i; next }
          $1 == "test262" {
            dirs++
            if (NF != 9) { print "test262: not nine fields: " $0; bad = 1 }
            for (i = 3; i <= 9; i++) s[i] += $i
          }
          END {
            if (totals != 1) { print "test262: " totals+0 " total line(s) in " file; exit 1 }
            if (dirs == 0) { print "test262: no directory line in " file; exit 1 }
            for (i = 3; i <= 9; i++) if (s[i] != t[i]) {
              print "test262: field " i " of the directory lines sums to " s[i] ", the total line has " t[i]
              bad = 1
            }
            if (bad) exit 1
            print total
            print "test262: " dirs " directory lines sum to the total"
          }
        ' "$lines"
        awk '$0 == "Its output on this document:" { f = 1; next } f && $0 == "```" { if (body) exit; body = 1; next } body' "$TEST262_DESIGN" | LC_ALL=C sort > "$TEST262_OUT/design-slices.txt"
        awk '$1 == "test262-slice" { print $2, $3, $4 }' "$lines" | LC_ALL=C sort > "$TEST262_OUT/committed-slices.txt"
        n=$(awk 'END { print NR }' "$TEST262_OUT/design-slices.txt")
        if [ "$n" -eq 0 ]; then
          echo "test262: no slice line after \"Its output on this document:\" in $TEST262_DESIGN"
          exit 1
        fi
        if ! diff "$TEST262_OUT/design-slices.txt" "$TEST262_OUT/committed-slices.txt" > "$TEST262_OUT/slices.diff"; then
          echo "test262: the slice lines differ from $TEST262_DESIGN (< design, > $lines):"
          cat "$TEST262_OUT/slices.diff"
          exit 1
        fi
        awk '$1 == "test262-slice"' "$lines"
        echo "test262: $n slice lines equal the design"
        errors=$(grep '^test262-errors ' "$lines") || { echo "test262: no test262-errors line in $lines"; exit 1; }
        echo "$errors"
        echo "test262: $(awk 'END { print NR }' "$lines") lines of $lines; sources digest $now equals $TEST262_DIGEST"

  test262-expected:
    desc: Run test262 as the task test262 does and write the expected file and its digest; the one run that writes them.
    summary: |
      Run test262 as the task test262 does, with the same variables, but compare with nothing:
      write the runner's lines to TEST262_EXPECTED (default conformance/test262/expected.txt)
      and to TEST262_DIGEST (default conformance/test262/expected.digest) the test262-sources
      line of the task test262-sources and the runner's test262-refused line (with
      TEST262_RUN=none, which runs no case, "test262-refused 0"). Nothing else writes either
      file. A unit of a wave of several units points both variables at files of its own under
      .out/, so that the committed ones are left to the coordinator. It fails, printing the
      runner's output, when the runner exits non-zero, and when its lines have no total line or
      the run printed no test262-refused line. It prints "test262-expected: <n> lines written to
      <expected file>, the digest <sha256> to <digest file>".
    deps: [test262-fetch]
    silent: true
    vars:
      PIN_COMMIT:
        sh: awk '$1 == "commit" {print $2}' conformance/test262/PIN
      TEST262_COMMIT: '{{.TEST262_COMMIT | default .PIN_COMMIT}}'
      TEST262_CACHE: '{{.TEST262_CACHE | default ".cache/test262"}}'
      TEST262_DESIGN: '{{.TEST262_DESIGN | default "docs/design/engine.md"}}'
      TEST262_FEATURES: '{{.TEST262_FEATURES | default "conformance/test262/features.txt"}}'
      TEST262_SECTIONS: '{{.TEST262_SECTIONS | default "conformance/test262/sections.txt"}}'
      TEST262_EXPECTED: '{{.TEST262_EXPECTED | default "conformance/test262/expected.txt"}}'
      TEST262_DIGEST: '{{.TEST262_DIGEST | default "conformance/test262/expected.digest"}}'
      TEST262_OUT: '{{.TEST262_OUT | default ".out/test262"}}'
      TEST262_WORKERS: '{{.TEST262_WORKERS | default "4"}}'
      TEST262_RUN: '{{.TEST262_RUN | default "all"}}'
    env:
      TEST262_COMMIT: '{{.TEST262_COMMIT}}'
      TEST262_CACHE: '{{.TEST262_CACHE}}'
      TEST262_DESIGN: '{{.TEST262_DESIGN}}'
      TEST262_FEATURES: '{{.TEST262_FEATURES}}'
      TEST262_SECTIONS: '{{.TEST262_SECTIONS}}'
      TEST262_EXPECTED: '{{.TEST262_EXPECTED}}'
      TEST262_DIGEST: '{{.TEST262_DIGEST}}'
      TEST262_OUT: '{{.TEST262_OUT}}'
      TEST262_WORKERS: '{{.TEST262_WORKERS}}'
      TEST262_RUN: '{{.TEST262_RUN}}'
    cmds:
      - mkdir -p "$TEST262_OUT"
      - |
        lines="$TEST262_OUT/lines.txt"
        log="$TEST262_OUT/count.log"
        status=0
        cargo run --locked --release -q -p swell-test262 -- count \
          --test262 "$TEST262_CACHE/$TEST262_COMMIT" \
          --design "$TEST262_DESIGN" \
          --features "$TEST262_FEATURES" \
          --sections "$TEST262_SECTIONS" \
          --workers "$TEST262_WORKERS" --run "$TEST262_RUN" \
          --runs "$TEST262_OUT/runs.tsv" > "$lines" 2> "$log" || status=$?
        if [ "$status" -ne 0 ]; then
          cat "$lines" "$log"
          echo "test262-expected: swell-test262 count exited $status"
          exit 1
        fi
        grep -q '^test262 total ' "$lines" || { echo "test262-expected: no total line in $lines"; exit 1; }
        if ! grep '^test262-refused ' "$log" > "$TEST262_OUT/refused.txt"; then
          if [ "$TEST262_RUN" = none ]; then echo "test262-refused 0" > "$TEST262_OUT/refused.txt"; else echo "test262-expected: no test262-refused line in $log"; exit 1; fi
        fi
      - task: test262-sources
      - |
        cp "$TEST262_OUT/lines.txt" "$TEST262_EXPECTED"
        cat "$TEST262_OUT/sources.digest" "$TEST262_OUT/refused.txt" > "$TEST262_DIGEST"
        echo "test262-expected: $(awk 'END { print NR }' "$TEST262_EXPECTED") lines written to $TEST262_EXPECTED, the digest $(awk '{ print $2; exit }' "$TEST262_DIGEST") to $TEST262_DIGEST"

  slow-test262:
    desc: The test262 part of the lane slow; the full run of the task test262, compared byte for byte with the expected file, and the digest checked.
    summary: |
      The test262 part of the lane slow (task slow). Runs the task test262 with the same
      variables (the full run of every case, compared line by line with TEST262_EXPECTED; it
      fails as that task does), then compares TEST262_OUT/lines.txt with TEST262_EXPECTED byte
      for byte, the runner's test262-refused line (with TEST262_RUN=none "test262-refused 0")
      with that of TEST262_DIGEST, and the digest of the sources (task test262-sources) with
      the test262-sources line of TEST262_DIGEST; each that differs fails it, naming both. It
      prints "slow-test262: <n> lines equal <expected file> byte for byte; <refused line> and
      the sources digest <sha256> equal <digest file>".
    silent: true
    vars:
      TEST262_EXPECTED: '{{.TEST262_EXPECTED | default "conformance/test262/expected.txt"}}'
      TEST262_DIGEST: '{{.TEST262_DIGEST | default "conformance/test262/expected.digest"}}'
      TEST262_OUT: '{{.TEST262_OUT | default ".out/test262"}}'
      TEST262_RUN: '{{.TEST262_RUN | default "all"}}'
    env:
      TEST262_EXPECTED: '{{.TEST262_EXPECTED}}'
      TEST262_DIGEST: '{{.TEST262_DIGEST}}'
      TEST262_OUT: '{{.TEST262_OUT}}'
      TEST262_RUN: '{{.TEST262_RUN}}'
    cmds:
      - task: test262
      - task: test262-sources
      - |
        [ -f "$TEST262_DIGEST" ] || { echo "slow-test262: no file $TEST262_DIGEST"; exit 1; }
        if ! cmp "$TEST262_OUT/lines.txt" "$TEST262_EXPECTED"; then
          echo "slow-test262: $TEST262_OUT/lines.txt differs from $TEST262_EXPECTED in its bytes"
          exit 1
        fi
        ran=$(grep '^test262-refused ' "$TEST262_OUT/count.log") || {
          if [ "$TEST262_RUN" = none ]; then ran="test262-refused 0"; else echo "slow-test262: no test262-refused line in $TEST262_OUT/count.log"; exit 1; fi
        }
        was=$(grep '^test262-refused ' "$TEST262_DIGEST") || { echo "slow-test262: no test262-refused line in $TEST262_DIGEST"; exit 1; }
        if [ "$ran" != "$was" ]; then
          echo "slow-test262: the run printed \"$ran\", $TEST262_DIGEST has \"$was\""
          exit 1
        fi
        now=$(awk '$1 == "test262-sources" { print $2 }' "$TEST262_OUT/sources.digest")
        digest=$(awk '$1 == "test262-sources" { print $2 }' "$TEST262_DIGEST")
        if [ "$now" != "$digest" ]; then
          echo "slow-test262: the sources digest $now differs from ${digest:-none} in $TEST262_DIGEST; task test262-expected writes both files"
          exit 1
        fi
        echo "slow-test262: $(awk 'END { print NR }' "$TEST262_EXPECTED") lines equal $TEST262_EXPECTED byte for byte; $ran and the sources digest $now equal $TEST262_DIGEST"
