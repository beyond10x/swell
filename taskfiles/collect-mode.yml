version: '3'

tasks:
  test-collect:
    desc: Run every test of swell with the collector run at every safe point and warnings denied, and print the summed counts.
    summary: |
      Run every test of swell with the collector run at every safe point and warnings denied,
      and print the summed counts (engine design, decisions 4 and 13: the mode that finds a
      missing root).

      Runs "cargo test --locked -p swell --features collect-every-safe-point" over all targets
      of the package (the library, every integration test, the doc tests) with
      RUSTFLAGS="-D warnings", as the task test does. The log is .out/test-collect.log; it is
      printed when cargo fails. The line printed sums its "test result:" lines as
      "test-collect: <n> test suites: <p> passed, <f> failed, <i> ignored". It fails when cargo
      fails (a failing test, a build error, or a crates/swell without the feature
      collect-every-safe-point), when a test fails, and when there is no "test result:" line.
    env:
      RUSTFLAGS: -D warnings
    silent: true
    cmds:
      - mkdir -p .out
      - |
        status=0
        cargo test --locked -p swell --features collect-every-safe-point > .out/test-collect.log 2>&1 || status=$?
        if [ "$status" -ne 0 ]; then cat .out/test-collect.log; fi
        awk -v status="$status" '
          /^test result: / {
            suites++
            for (i = 1; i < NF; i++) {
              count = $i
              gsub(/[^0-9]/, "", count)
              if ($(i + 1) ~ /^passed/) passed += count
              if ($(i + 1) ~ /^failed/) failed += count
              if ($(i + 1) ~ /^ignored/) ignored += count
            }
          }
          END {
            print "test-collect: " suites+0 " test suites: " passed+0 " passed, " failed+0 " failed, " ignored+0 " ignored"
            if (status != 0 || failed > 0 || suites == 0) exit 1
          }
        ' .out/test-collect.log
