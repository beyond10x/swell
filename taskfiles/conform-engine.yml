version: '3'

vars:
  ESS_SUITE: '{{.ESS_SUITE | default ".out/suite.json"}}'
  ESS_UNSUPPORTED_MAX: '{{.ESS_UNSUPPORTED_MAX | default 42}}'

tasks:
  conform-engine:
    desc: Run the ESS scenarios against the host interface of swell (conformance/ess); a failure, an error, fewer than 18 passed or more than ESS_UNSUPPORTED_MAX unsupported fail it.
    summary: |
      Run the scenarios of the ESS model under spec/ against the hand-written host interface of
      crates/swell, through the conformance target in the workspace of its own, conformance/ess
      (engine design, decision 10).

      Reads ESS_SUITE (default .out/suite.json), which the task suite of taskfiles/spec.yml
      writes; it has no deps entry, so that the file runs alone, and a missing suite fails with
      "conform-engine: <file> missing; run task suite first". First it runs the tests of the
      crate through cargo-nextest with RUSTFLAGS="-D warnings" (cargo nextest run --locked
      --manifest-path conformance/ess/Cargo.toml --profile default --config-file
      .config/nextest.toml: a test is terminated at 60 s; ESS_SUITE passed on to them as an
      absolute path) into .out/conform-engine-test.log, prints their summed counts and slowest
      tests as the task test does ("conform-engine: <b> test binaries: ..." and "gate-slowest
      conform-engine ..."; the log is printed when nextest fails), and checks that the
      planted-defect tests a_target_whose_interrupt_does_nothing_fails_a_scenario and
      a_target_whose_checkpoint_runs_no_job_fails_a_scenario ran and passed. Then it runs
      the suite with the binary swell-conformance, writing the ess-conformance-report/2 to
      .out/conform-engine.json and its output to .out/conform-engine.log, and prints the runner
      summary line "<n> scenarios: <p> passed, <f> failed, <e> error, <u> unsupported". It
      fails, naming both numbers, when a scenario failed or errored, when fewer than 18 passed,
      or when more than ESS_UNSUPPORTED_MAX (default 42) were unsupported; then the lines of
      the log for the scenarios that did not pass are printed too. Both commands find their
      binaries built before the clock by build-conform-engine: the nextest log and the log of
      cargo run (written without --quiet, so that cargo's Compiling lines show) each fail the
      step when they hold a Compiling line, naming build-conform-engine (task compile-check).
    env:
      RUSTFLAGS: -D warnings
    silent: true
    cmds:
      - mkdir -p .out
      - |
        suite='{{.ESS_SUITE}}'
        if [ ! -f "$suite" ]; then
          echo "conform-engine: $suite missing; run task suite first"
          exit 1
        fi
        case "$suite" in
          /*) ;;
          *) suite="$PWD/$suite" ;;
        esac
        status=0
        ESS_SUITE="$suite" cargo nextest run --locked --manifest-path conformance/ess/Cargo.toml --profile default \
          --config-file .config/nextest.toml > .out/conform-engine-test.log 2>&1 || status=$?
        echo "$status" > .out/conform-engine-test.status
      - task: nextest-report
        vars: {STEP: conform-engine, PREFIX: 'conform-engine: ', LOG: .out/conform-engine-test.log, STATUS: .out/conform-engine-test.status, JUNIT: conformance/ess/target/nextest/default/junit.xml, MIN_PASSED: '1', BUILT_BY: build-conform-engine}
      - |
        suite='{{.ESS_SUITE}}'
        case "$suite" in
          /*) ;;
          *) suite="$PWD/$suite" ;;
        esac
        if ! grep -qE '^ *PASS \[ *[0-9.]+s\] .*swell-conformance::planted_defect a_target_whose_interrupt_does_nothing_fails_a_scenario$' .out/conform-engine-test.log.plain; then
          echo "conform-engine: the planted-defect test a_target_whose_interrupt_does_nothing_fails_a_scenario did not run and pass; see .out/conform-engine-test.log"
          exit 1
        fi
        echo "conform-engine: planted defect refused: test a_target_whose_interrupt_does_nothing_fails_a_scenario ... ok"
        if ! grep -qE '^ *PASS \[ *[0-9.]+s\] .*swell-conformance::planted_defect a_target_whose_checkpoint_runs_no_job_fails_a_scenario$' .out/conform-engine-test.log.plain; then
          echo "conform-engine: the planted-defect test a_target_whose_checkpoint_runs_no_job_fails_a_scenario did not run and pass; see .out/conform-engine-test.log"
          exit 1
        fi
        echo "conform-engine: planted defect refused: test a_target_whose_checkpoint_runs_no_job_fails_a_scenario ... ok"
        status=0
        cargo run --locked --manifest-path conformance/ess/Cargo.toml -- "$suite" .out/conform-engine.json > .out/conform-engine.log 2>&1 || status=$?
        if [ "$status" -ge 2 ]; then
          cat .out/conform-engine.log
          echo "conform-engine: swell-conformance could not run the suite, exit $status"
          exit 1
        fi
        last=$(tail -n 1 .out/conform-engine.log)
        echo "$last"
        if ! printf '%s\n' "$last" | awk -v max='{{.ESS_UNSUPPORTED_MAX}}' '
          /^ *[0-9]+ scenarios: [0-9]+ passed, [0-9]+ failed, [0-9]+ error, [0-9]+ unsupported$/ {
            seen = 1
            total = $1; passed = $3; failed = $5; errors = $7; unsupported = $9
            if (failed > 0 || errors > 0) { print "conform-engine: " failed " failed and " errors " error; none may"; bad = 1 }
            if (passed < 18) { print "conform-engine: " passed " passed, fewer than 18"; bad = 1 }
            if (unsupported > max) { print "conform-engine: " unsupported " unsupported, more than ESS_UNSUPPORTED_MAX=" max; bad = 1 }
          }
          END {
            if (!seen) print "conform-engine: the last line of .out/conform-engine.log is not the runner summary line"
            exit (!seen || bad)
          }
        '; then
          grep -E '^  (failed|error|unsupported) ' .out/conform-engine.log || true
          exit 1
        fi
      - task: compile-check
        vars: {STEP: conform-engine, LOG: .out/conform-engine.log, BUILT_BY: build-conform-engine}

  build-conform-engine:
    desc: Build, without running them, the test binaries and the binary swell-conformance that the step conform-engine runs, with its flags and manifest; part of the gate's build phase.
    summary: |
      Build, without running them, what the step conform-engine runs, in the workspace of its
      own conformance/ess (its target directory conformance/ess/target), with the step's
      RUSTFLAGS="-D warnings": first "cargo nextest run --no-run --locked --manifest-path
      conformance/ess/Cargo.toml --profile default --config-file .config/nextest.toml" (the
      step's test run) into .out/build-conform-engine-test.log, then "cargo build --locked
      --manifest-path conformance/ess/Cargo.toml --bin swell-conformance" (what the step's
      cargo run builds) into .out/build-conform-engine.log. A step of build-tests, before
      gate-time-start, so that conform-engine compiles nothing inside its timed step: its
      nextest log and the log of its cargo run each fail it when they hold a Compiling line
      (task compile-check). It prints "build-conform-engine: <cargo's Finished line>" for each
      of the two; when cargo fails it prints that log and fails. The first build fetches the ess
      crates of conformance/ess/Cargo.lock by their pinned tag.
    env:
      RUSTFLAGS: -D warnings
    silent: true
    cmds:
      - mkdir -p .out
      - |
        esc=$(printf '\033')
        for part in test bin; do
          status=0
          if [ "$part" = test ]; then
            log=.out/build-conform-engine-test.log
            cargo nextest run --no-run --locked --manifest-path conformance/ess/Cargo.toml --profile default \
              --config-file .config/nextest.toml > "$log" 2>&1 || status=$?
          else
            log=.out/build-conform-engine.log
            cargo build --locked --manifest-path conformance/ess/Cargo.toml --bin swell-conformance > "$log" 2>&1 || status=$?
          fi
          if [ "$status" -ne 0 ]; then cat "$log"; echo "build-conform-engine: cargo failed, exit $status (log $log)"; exit 1; fi
          LC_ALL=C sed "s/$esc\[[0-9;]*[A-Za-z]//g" "$log" | awk '/^ *Finished / { sub(/^ */, ""); line = $0 } END { print "build-conform-engine: " line }'
        done
