# A source that is not a Script answers ParseFailed (`Parsed::Errors`, decision 5; HOST-36, whose
# source this is), creates no script and leaves the agent Alive: the next source parses. `var 1;`
# is a syntax error of the ES5 grammar, not a construct the parser refuses for a later slice. The
# answer is forced (`external:`) on ESS's interpreter; an engine under test reaches it by parsing
# the source. Synthesis writes no scenario for it (it arranges no realm whose agent is the one
# called, ESS-SYNTH-003). Every call is made on the agent that owns the realm.
type: ess-scenario/6
domain: swell.host
scenario: parse-error-leaves-the-agent-parsing
summary: A source that is not a Script answers ParseFailed, and the agent parses the next source.

arrange:
  - instance: agent
    entity: swell.host.Agent
  - instance: realm
    entity: swell.host.Realm
  - instance: script
    entity: swell.host.Script

timeline:
  - at: 2026-01-06T09:00:00Z
    command: swell.host.CreateAgent
    actor: swell.host.Host
    input:
      limits:
        steps_per_entry: 1000000
        memory_bytes: 67108864
        frame_depth: 10000
        reentry_depth: 256
        parser_nesting: 1000
        string_length: 1073741824
        bigint_bits: 1048576
      hash_key: AAECAwQFBgcICQoLDA0ODw==
      random_seed: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    outcome: created
    capture: {instance: agent, event: swell.host.AgentCreated, field: agent_id}

  - at: 2026-01-06T09:00:01Z
    command: swell.host.CreateRealm
    actor: swell.host.Host
    input:
      agent_id: {$instance: agent}
    outcome: created
    capture: {instance: realm, event: swell.host.RealmCreated, field: realm_id}

  - at: 2026-01-06T09:00:02Z
    command: swell.host.ParseScript
    actor: swell.host.Host
    input:
      agent_id: {$instance: agent}
      realm_id: {$instance: realm}
      source_text: "var 1;"
    outcome: parse-failed
    error:
      name: swell.host.ParseFailed

  - at: 2026-01-06T09:00:03Z
    command: swell.host.ParseScript
    actor: swell.host.Host
    input:
      agent_id: {$instance: agent}
      realm_id: {$instance: realm}
      source_text: "1 + 1;"
    outcome: parsed
    capture: {instance: script, event: swell.host.ScriptParsed, field: script_id}
