name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: swell / task check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = pull_request ]; then base=$PR_BASE; else base=$PUSH_BEFORE; fi
          sh taskfiles/classify-changes.sh "$base" HEAD

      - name: Read the pinned compiler
        id: toolchain
        if: steps.changes.outputs.kind != 'planning-only' && steps.changes.outputs.kind != 'site-only'
        run: |
          set -eu
          channel=$(awk -F '"' '/^[ \t]*channel[ \t]*=/ { print $2; exit }' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: steps.changes.outputs.kind != 'planning-only' && steps.changes.outputs.kind != 'site-only'
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - name: Install go-task
        env:
          TASK_VERSION: "3.54.0"
          TASK_SHA256: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        if: steps.changes.outputs.kind != 'planning-only' && steps.changes.outputs.kind != 'site-only'
        env:
          NEXTEST_VERSION: "0.9.143"
          NEXTEST_SHA256: "66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e"
        run: |
          set -euo pipefail
          nextest="cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$nextest" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/$nextest"
          echo "$NEXTEST_SHA256  $nextest" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          tar -xzf "$nextest" -C "$RUNNER_TEMP/nextest-bin" cargo-nextest
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      - name: Install ess
        if: steps.changes.outputs.kind != 'planning-only' && steps.changes.outputs.kind != 'site-only'
        env:
          ESS_VERSION: "0.96.0"
          ESS_SHA256: 8eaf33989c9306bd923d19a96be82723addf7ad532b534fb8b0e423733f81825
        run: |
          set -euo pipefail
          asset="ess-$ESS_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/ess/releases/download/$ESS_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$ESS_SHA256  $asset" SHA256SUMS
          grep -F "  $asset" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/ess-$ESS_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Checks of planning and prose files
        if: steps.changes.outputs.kind == 'planning-only' || steps.changes.outputs.kind == 'site-only'
        run: task python-check

      - name: Check of the site's numbers
        if: steps.changes.outputs.kind == 'site-only'
        run: task site-data-check

      - name: task check
        if: steps.changes.outputs.kind != 'planning-only' && steps.changes.outputs.kind != 'site-only'
        run: task check
