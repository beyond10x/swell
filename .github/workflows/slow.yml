name: Slow lane

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".cargo/collect-profile.toml"
      - ".config/nextest.toml"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "Taskfile.yml"
      - "taskfiles/test262.yml"
      - "taskfiles/gate-time.yml"
      - "taskfiles/realm-room-tests.awk"
      - "taskfiles/test262-fetch.yml"
      - "taskfiles/nextest.yml"
      - "taskfiles/stack-profiles.yml"
      - "taskfiles/no-debug-sections.sh"
      - "taskfiles/test-binaries.yml"
      - "taskfiles/test-main.sh"
      - "conformance/test262/**"
      - "docs/design/engine.md"
      - ".github/workflows/slow.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".cargo/collect-profile.toml"
      - ".config/nextest.toml"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "Taskfile.yml"
      - "taskfiles/test262.yml"
      - "taskfiles/gate-time.yml"
      - "taskfiles/realm-room-tests.awk"
      - "taskfiles/test262-fetch.yml"
      - "taskfiles/nextest.yml"
      - "taskfiles/stack-profiles.yml"
      - "taskfiles/no-debug-sections.sh"
      - "taskfiles/test-binaries.yml"
      - "taskfiles/test-main.sh"
      - "conformance/test262/**"
      - "docs/design/engine.md"
      - ".github/workflows/slow.yml"
  workflow_dispatch:

concurrency:
  group: slow-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  slow:
    name: swell / task slow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read the pinned compiler
        id: toolchain
        run: |
          set -eu
          channel=$(awk -F '"' '/^[ \t]*channel[ \t]*=/ { print $2; exit }' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - name: Install go-task
        env:
          TASK_VERSION: "3.54.0"
          TASK_SHA256: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: "0.9.143"
          NEXTEST_SHA256: "66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e"
        run: |
          set -euo pipefail
          nextest="cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$nextest" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/$nextest"
          echo "$NEXTEST_SHA256  $nextest" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          tar -xzf "$nextest" -C "$RUNNER_TEMP/nextest-bin" cargo-nextest
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      - name: task slow
        run: task slow
