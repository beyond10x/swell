name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the Docusaurus site
        run: npm --prefix website ci && npm --prefix website run build
      - name: Declare what was built
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$COMMIT" in *[!0-9a-f]*|'') exit 1 ;; esac
          test "${#COMMIT}" -eq 40
          test -f website/build/index.html
          mkdir -p website/build/.well-known
          jq -n --arg commit "$COMMIT" \
            '{schema: "b10x-project-site/v1", repository: "swell", commit: $commit, baseUrl: "/swell/"}' \
            > website/build/.well-known/b10x-site.json
          cat website/build/.well-known/b10x-site.json
      - name: Upload the exact built site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b10x-project-site
          path: website/build
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
