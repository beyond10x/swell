[package]
name = "swell-cli"
edition.workspace = true
license.workspace = true
version.workspace = true
autotests = false

[[bin]]
name = "swell"
path = "src/main.rs"

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
swell = { path = "../swell" }
swell-syntax = { path = "../syntax" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
