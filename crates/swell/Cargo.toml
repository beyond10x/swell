[package]
name = "swell"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
swell-compiler = { path = "../compiler" }
swell-num = { path = "../num" }
swell-syntax = { path = "../syntax" }
swell-unicode = { path = "../unicode" }

[features]
collect-every-safe-point = []
fault-injection = []

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
