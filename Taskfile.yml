version: '3'

set: [pipefail]

vars:
  COLLECT_MAIN: --locked -p swell --features collect-every-safe-point --config .cargo/collect-profile.toml --cargo-profile collect --profile default --test main
  COLLECT_RUSTFLAGS: -D warnings
  SLOW_COLLECT_WAIT: '400'
  NO_STACK_TESTS: SWELL_NO_STACK_TESTS
  TEST_OPT1_ARGS: --locked -p swell --test main --config .cargo/collect-profile.toml --cargo-profile collect --profile default
  TEST_OPT1_PROFILE_TEST: realm_padding::the_profile_keeps_debug_assertions_and_overflow_checks_on

includes:
  test-binaries:
    taskfile: taskfiles/test-binaries.yml
    flatten: true
    optional: true
  test262-fetch:
    taskfile: taskfiles/test262-fetch.yml
    flatten: true
    optional: true
  test262:
    taskfile: taskfiles/test262.yml
    flatten: true
    optional: true
  unicode-data:
    taskfile: taskfiles/unicode-data.yml
    flatten: true
    optional: true
  unicode-tables:
    taskfile: taskfiles/unicode-tables.yml
    flatten: true
    optional: true
  libm:
    taskfile: taskfiles/libm.yml
    flatten: true
    optional: true
  math-data:
    taskfile: taskfiles/math-data.yml
    flatten: true
    optional: true
  nostd:
    taskfile: taskfiles/nostd.yml
    flatten: true
    optional: true
  fault-injection:
    taskfile: taskfiles/fault-injection.yml
    flatten: true
    optional: true
  conform-engine:
    taskfile: taskfiles/conform-engine.yml
    flatten: true
    optional: true
  collect-mode:
    taskfile: taskfiles/collect-mode.yml
    flatten: true
    optional: true
  spec:
    taskfile: taskfiles/spec.yml
    flatten: true
    optional: true
  host-requirements:
    taskfile: taskfiles/host-requirements.yml
    flatten: true
    optional: true
  nextest:
    taskfile: taskfiles/nextest.yml
    flatten: true
    optional: true
  perf:
    taskfile: taskfiles/perf.yml
    flatten: true
    optional: true
  forge:
    taskfile: taskfiles/forge.yml
    flatten: true
    optional: true
  site:
    taskfile: taskfiles/site.yml
    flatten: true
    optional: true
  host-surface:
    taskfile: taskfiles/host-surface.yml
    flatten: true
    optional: true
  stack-profiles:
    taskfile: taskfiles/stack-profiles.yml
    flatten: true
    optional: true
  gate-time:
    taskfile: taskfiles/gate-time.yml
    flatten: true
    optional: true
  realm-places:
    taskfile: taskfiles/realm-places.yml
    flatten: true
    optional: true
  shell:
    taskfile: taskfiles/shell.yml
    flatten: true
    optional: true

tasks:
  check:
    desc: The one gate. Every check, in order; the first that fails stops it.
    summary: |
      The one gate. Every check, in order; the first that fails stops it.

      The test steps are the steps after clippy. After each of them the gate prints
      "gate-time <step> <seconds>", the wall time since the end of the step before, and after
      the last "gate-time test-steps <sum> of 120", the organization's budget for them ("Tests
      stay fast"); the gate fails when the sum is over it (GATE_TIME_BUDGET, default 120; task
      gate-time-sum), naming the sum and the three slowest steps. A step's seconds are the time
      it ran inside the gate's pool job: a wait for a slot comes before the job starts and is
      not in them, and inside the job cargo and task run directly. The full test262 run is not a step of the
      gate: it is the lane slow (task slow), and test262-check compares the digest of its
      sources in its place.

      The build phase comes before the clock: build, then build-tests, which builds every
      binary the test steps run with each step's own flags, features, profile and manifest
      (the organization's rule "Tests stay fast": an expensive product is made once, in a
      setup step before the tests). A test step whose cargo log has a Compiling line fails,
      naming the build task that builds what it compiled (task compile-check). The doc tests
      are the exception: rustdoc compiles them when it runs them, so test-doc's seconds hold
      that compilation.

      Right after gate-time-start, before the first test step, the gate prints the machine it
      runs on, one line "gate-runner: <n> cores, <cpu>, <memory>, sh is <sh>" (task slow-runner
      with LABEL gate-runner), so that two runs on the same code whose seconds differ can be
      read against their machines: the forge ran the test steps on the same code in 77.2 s and
      in 147.6 s, and its log did not name the runner's CPU.
    cmds:
      - task: gate-vars
      - task: python-check
      - task: kill-check
      - task: forbid-unsafe-check
      - task: libm-check
      - task: nostd-build
      - task: nostd-symbols
      - task: lock-check
      - task: forge-check
      - task: nextest-check
      - task: test262-fetch
      - task: unicode-data-check
      - task: math-data-check
      - task: unicode-tables-check
      - task: validate
      - task: conform
      - task: host-requirements-check
      - task: host-surface-check
      - task: site-data-check
      - task: build
      - task: test-binaries-check
      - task: build-tests
      - task: clippy
      - task: gate-time-start
      - task: slow-runner
        vars: {LABEL: gate-runner}
      - task: test
      - task: gate-time
        vars: {STEP: test}
      - task: test-doc
      - task: gate-time
        vars: {STEP: test-doc}
      - task: test-collect
      - task: gate-time
        vars: {STEP: test-collect}
      - task: test-faults
      - task: gate-time
        vars: {STEP: test-faults}
      - task: conform-engine
      - task: gate-time
        vars: {STEP: conform-engine}
      - task: test262-check
      - task: gate-time
        vars: {STEP: test262-check}
      - task: test262-moves-check
      - task: gate-time
        vars: {STEP: test262-moves-check}
      - task: gate-selftest
      - task: gate-time
        vars: {STEP: gate-selftest}
      - task: gate-time-sum

  slow:
    desc: The lane slow. The full runs the gate does not make; the forge runs it when a source of the expected file changed.
    summary: |
      The lane slow: the full runs the gate does not make, each compared with the committed file
      the gate reads in their place, or the full counts of tests the gate runs a part of. Four:
      slow-test262, the full test262 run compared byte for byte with
      conformance/test262/expected.txt, and the digest of its sources checked against
      conformance/test262/expected.digest; slow-tests, the tests with a gate count at their
      full counts; test-realm-sizes, the tests of swell that read the realm's room with each
      realm padded by k host functions for several k, in the default mode (opt-level 0) and
      with a collection at every safe point (the profile collect, opt-level 1) at each k, on
      two builds slow-tests made; and
      test-stack-profiles, which builds first (build-stack-profiles), the stack tests in the
      release profile and in stack-debug, the dev profile with full debug information (the
      gate runs them in the dev profile without it), built with the modules of swell's tests
      that hold them only (taskfiles/stack-profiles.yml, STACK_MODULES). The workflow
      .github/workflows/slow.yml runs it on a push to main and on a pull request, each only
      when it changes a path of the workflow's list (a source of the digest, the expected file
      or the digest file among them), and on a run started by hand on a branch.
      Prints "slow-time <part> <seconds>" after each part. Last, slow-time-sum
      (taskfiles/gate-time.yml) prints "slow-time lane <sum> of 900, longest part <part>
      <seconds> of 600" and fails the lane when a part ran over 600 s, or the sum of the parts
      or the lane's clock (.out/gate-time/start, written by the lane's first step) over 900 s,
      the operator's bounds of 2026-11-26 (story realm-size-lane-within-its-share), naming the
      part and its seconds, the lane's sum or the clock's seconds, so a step without its own
      time line is bounded too. A part that fails stops the lane there, as before, and
      slow-time-sum does not run.

      Right after gate-time-start the lane prints the machine it runs on, one line
      "slow-runner: ..." (slow-runner), so that two runs of the lane on the same code whose
      seconds differ can be read against their machines. Then it starts the build of the profile collect that
      slow-tests and test-realm-sizes run on (slow-collect-start): it runs in the background
      beside slow-test262, whose run keeps 4 workers busy while that build, which a 32-core node
      does not make shorter than a 4-core runner (3 min 59 s against 3 min 33 s), runs mostly on
      one core. slow-tests is called with SLOW_COLLECT=lane and waits for it; a part run alone
      builds what it needs itself. The parts' slow-time lines stay each part's own wall time;
      the build's own seconds are on the line "slow-build collect ..." that slow-tests prints.
      Whatever way the lane ends (a part that fails, the end, an interrupt), the build does not
      outlive it: the deferred slow-collect-stop ends it, and the build's own watcher ends it
      when the lane's task process is gone.
    silent: true
    cmds:
      - task: gate-vars
      - task: gate-time-start
      - task: slow-runner
      - defer: {task: slow-collect-stop}
      - task: slow-collect-start
      - task: slow-test262
      - task: gate-time
        vars: {STEP: slow-test262, LABEL: slow-time}
      - task: slow-tests
        vars: {SLOW_COLLECT: lane}
      - task: gate-time
        vars: {STEP: slow-tests, LABEL: slow-time}
      - task: test-realm-sizes
      - task: gate-time
        vars: {STEP: test-realm-sizes, LABEL: slow-time}
      - task: test-stack-profiles
      - task: gate-time
        vars: {STEP: stack-profiles, LABEL: slow-time}
      - task: slow-time-sum

  slow-runner:
    desc: Internal, called by slow and by check after gate-time-start. Print one line that names the machine the lane or the gate runs on; it never fails.
    summary: |
      Internal, called right after gate-time-start by the lane slow and by the gate check (with
      LABEL gate-runner, before its first test step). Prints one line, "<LABEL>: <n> cores,
      <cpu>, <memory>, sh is <sh>", LABEL default slow-runner: the number of processors online
      (getconf _NPROCESSORS_ONLN, else the processor lines of /proc/cpuinfo; "cores not read"
      when neither gives a number), the first "model name" of /proc/cpuinfo ("cpu not read"
      when the file is missing or has none, as on most ARM machines), MemTotal of
      /proc/meminfo ("<kB> kB", else "memory not read") and what /bin/sh points to ("dash" on
      the forge's runner, "bash" here; "/bin/sh, not a link" or "not read" otherwise). The
      forge ran the lane twice on the same code in 882.6 s and 1,142.0 s, its single tests 1.4
      to 1.56 times slower in the second run and its builds 1.11 to 1.14 times, and its log
      did not name the runner's CPU; it ran the gate's test steps twice on the same code in
      77.2 s and 147.6 s, 1.94 times the CPU seconds. The line is written in one place, here,
      for both. POSIX sh and awk only; whatever it cannot read, it exits 0.
      tests/gate/slow-collect-builds-beside-the-lane-and-ends-with-it.sh reads the line in the
      output of task slow, and
      tests/gate/check-prints-the-runner-line-before-its-first-test-step.sh holds the line of
      check.
    silent: true
    vars:
      LABEL: '{{.LABEL | default "slow-runner"}}'
    cmds:
      - |
        label={{shellQuote .LABEL}}
        cores=$(getconf _NPROCESSORS_ONLN 2>/dev/null) || cores=
        case "$cores" in ''|*[!0-9]*) cores=$(awk '/^processor[ \t]*:/ { n++ } END { if (n) print n }' /proc/cpuinfo 2>/dev/null) || cores= ;; esac
        case "$cores" in ''|*[!0-9]*) cores="cores not read" ;; *) cores="$cores cores" ;; esac
        cpu=$(awk -F ':[ \t]*' '/^model name[ \t]*:/ { print $2; exit }' /proc/cpuinfo 2>/dev/null) || cpu=
        [ -n "$cpu" ] || cpu="cpu not read"
        mem=$(awk '$1 == "MemTotal:" && $2 ~ /^[0-9]+$/ { print $2 " kB"; exit }' /proc/meminfo 2>/dev/null) || mem=
        [ -n "$mem" ] || mem="memory not read"
        sh=$(ls -l /bin/sh 2>/dev/null | awk '{ i = index($0, " -> "); print (i ? substr($0, i + 4) : "/bin/sh, not a link"); exit }') || sh=
        [ -n "$sh" ] || sh="not read"
        echo "$label: $cores, $cpu, $mem, sh is $sh"

  slow-collect-start:
    desc: Internal, called by slow after gate-time-start. Start the build of the profile collect that slow-tests and test-realm-sizes run on in the background, and return.
    summary: |
      Internal, called by the lane slow right after gate-time-start. Starts "cargo nextest run
      --no-run" with COLLECT_MAIN and RUSTFLAGS=COLLECT_RUSTFLAGS (the variables at the top of
      this file, which the run of slow-tests at opt-level 1, build-realm-sizes and
      test-realm-sizes read too, so the build and the runs are one build for cargo), in the
      background, and returns. Its files are under .out/slow-collect (emptied first, so a status
      an earlier lane left is never read): log, the build's output; launch, what the start of
      the process group printed; pid, the process that runs and watches it, the leader of a
      process group of its own (setsid) that holds the build, whose command line names this
      tree's .out/slow-collect by its absolute path; start and end, the clock at both ends;
      status, the build's exit status, written last. The watcher ends the build's process group
      when the process of the task that called slow-collect-start (the lane's go-task) is gone,
      so an interrupted lane leaves no build; slow-collect-stop ends it when the lane ends
      another way. Prints "slow-collect-start: the build of the profile collect runs in the
      background, process <pid>, log .out/slow-collect/log"; fails with "slow-collect-start:
      setsid is not on PATH ..." when there is no setsid, and with "... did not start ..." and
      the launch's output when the process did not start. A part run alone does not need it:
      slow-tests without SLOW_COLLECT=lane builds what it runs.
      tests/gate/slow-collect-builds-beside-the-lane-and-ends-with-it.sh and
      tests/gate/slow-collect-a-lane-reads-only-its-own-build.sh hold it.
    silent: true
    env:
      RUSTFLAGS: '{{.COLLECT_RUSTFLAGS}}'
    cmds:
      - |
        dir=.out/slow-collect
        sh -c 'command -v setsid' > /dev/null || { echo "slow-collect-start: setsid is not on PATH (util-linux); the lane runs the build of the profile collect in a process group of its own, which setsid makes"; exit 1; }
        rm -rf "$dir" && mkdir -p "$dir" || { echo "slow-collect-start: cannot make $dir"; exit 1; }
        sh -c '
          dir=$1; shift
          lane=$PPID
          setsid sh -c '\''
            dir=$1 lane=$2; shift 2
            echo $$ > "$dir/pid.tmp" && mv "$dir/pid.tmp" "$dir/pid"
            date +%s.%N > "$dir/start"
            "$@" > "$dir/log" 2>&1 < /dev/null &
            build=$!
            while kill -0 "$build" 2>/dev/null; do
              if ! kill -0 "$lane" 2>/dev/null; then
                echo "slow-collect: the lane (process $lane) is gone; the build ends with it" >> "$dir/log"
                kill -TERM "-$$" 2>/dev/null
                exit 1
              fi
              sleep 1
            done
            wait "$build"
            st=$?
            date +%s.%N > "$dir/end"
            echo "$st" > "$dir/status.tmp" && mv "$dir/status.tmp" "$dir/status"
          '\'' slow-collect "$dir" "$lane" "$@" > "$dir/launch" 2>&1 < /dev/null &
        ' slow-collect-start "$(pwd)/$dir" cargo nextest run --no-run {{.COLLECT_MAIN}}
        n=0
        while [ ! -s "$dir/pid" ] && [ "$n" -lt 50 ]; do sleep 0.1; n=$((n + 1)); done
        [ -s "$dir/pid" ] || { cat "$dir/launch" 2>/dev/null; echo "slow-collect-start: the build of the profile collect did not start (no $dir/pid after 5 s; $dir/launch above)"; exit 1; }
        echo "slow-collect-start: the build of the profile collect runs in the background, process $(cat "$dir/pid"), log $dir/log"

  slow-collect-stop:
    desc: Internal, deferred by slow. End the background build of slow-collect-start when it still runs, by its process group.
    summary: |
      Internal, deferred by the lane slow, so it runs when the lane ends, whether a part failed
      or not. When .out/slow-collect/pid names a process and .out/slow-collect/status does not
      exist (the build still runs), it sends TERM to that process's group (the build and its
      watcher; never by name), waits up to 10 s for the group to be gone, then sends KILL, and
      prints "slow-collect-stop: ended the build of the profile collect (process group <pid>),
      which still ran when the lane ended". It ends only a group this tree's lane started: the
      process must be a watcher of slow-collect-start whose command line
      (/proc/<pid>/cmdline) names this tree's .out/slow-collect by its absolute path; a number
      the system gave to another process since, or a lane of another tree, is left alone with
      "slow-collect-stop: process <pid> ... is not the build this tree's lane started; nothing
      ended". Otherwise it prints nothing.
    silent: true
    cmds:
      - |
        sh -c '
          dir=.out/slow-collect
          [ -s "$dir/pid" ] || exit 0
          [ -f "$dir/status" ] && exit 0
          pid=$(cat "$dir/pid")
          case "$pid" in ""|*[!0-9]*) echo "slow-collect-stop: $dir/pid holds no process number"; exit 1 ;; esac
          kill -0 "-$pid" 2>/dev/null || exit 0
          if ! tr "\0" "\n" < "/proc/$pid/cmdline" 2>/dev/null | grep -qxF "$(pwd)/$dir"; then
            echo "slow-collect-stop: process $pid of $dir/pid is not the build this tree'\''s lane started (its command line does not name $(pwd)/$dir); nothing ended"
            exit 0
          fi
          kill -TERM "-$pid" 2>/dev/null
          n=0
          while kill -0 "-$pid" 2>/dev/null && [ "$n" -lt 100 ]; do sleep 0.1; n=$((n + 1)); done
          kill -KILL "-$pid" 2>/dev/null
          echo "slow-collect-stop: ended the build of the profile collect (process group $pid), which still ran when the lane ended"
        '

  slow-tests:
    desc: The lane slow's part of the tests. Run, at their full counts (SWELL_FULL_COUNTS=1), the test binaries whose gate count is a part, in both modes of swell.
    summary: |
      The lane slow's part of the tests. A test whose iteration count is large for a reason other
      than its subject runs a part of it in the gate and the whole when SWELL_FULL_COUNTS is 1
      (story gate-test-steps-within-budget, point 3; each such test says how its gate count
      reaches what the full count does). This task finds those tests itself: every
      crates/<crate>/tests/<name>.rs that reads SWELL_FULL_COUNTS, which is the module <name> of
      the crate's one test binary main (tests/main.rs) and is named "(binary_id(<package>::main)
      & test(/^<name>::/))", anchored so that a module whose name ends in <name> is not taken,
      and the library's test binary of swell when a file under crates/swell/src reads it; it
      runs them through cargo-nextest with SWELL_FULL_COUNTS=1, then those of swell again with
      the feature collect-every-safe-point, so that a test that takes the variable up runs here
      with nothing to edit. The collect mode adds every module of swell's tests that calls
      stack_with_room (crates/swell/tests/support/host.rs): a test that runs on a bounded stack
      proves the promised stack with a frame size that depends on the optimization level, and
      the gate's step test-collect builds the collect mode at opt-level 1 (the profile collect,
      .cargo/collect-profile.toml), so the lane is where the collect mode's stack tests keep
      their unoptimized frames (story gate-test-steps-fit-four-cores). The collect mode runs in
      two parts (story realm-size-lane-within-its-share): taskfiles/realm-room-tests.awk -v
      rule=stack prints each test of swell::main "stack" when its text, a function nested in it,
      or a function of its file or of tests/support it calls names stack_with_room( or
      .stack_size(, and "other" otherwise, into .out/slow-tests-stack.txt. The library's unit
      tests and the tests of those modules not printed "other" (the stack tests, and a test a
      macro writes, which the rule does not see and which may run on a bounded stack) run in
      the test profile at opt-level 0; the tests of those modules printed "other" run in the
      profile collect at opt-level 1 (--test main), the build test-realm-sizes runs its collect
      mode on after this task, where a test of this mode runs about ten times faster. The
      names reach nextest as test-realm-sizes hands its list over: in a copy of
      .config/nextest.toml with one default-filter line,
      .out/slow-tests-collect-not-other-nextest.toml (not the tests printed "other") for the
      first part and .out/slow-tests-collect-only-other-nextest.toml (the tests printed "other"
      alone) for the second. It
      prints "slow-tests collect-every-safe-point: <s> of the <n> tests of swell::main in the
      collect filter's modules that the collect build holds run on a bounded stack (...) and run
      at opt-level 0, the <o> others at opt-level 1; <g> test(s) of those modules are not in the
      collect build; <x> test(s) of swell::main in other modules run in neither", each number
      counted from the rule's lines (a line that ends in " not-in-collect" is a test whose
      attributes hold #[cfg(not(feature = "collect-every-safe-point"))]) and the filter's
      modules (a test a macro writes is not among them), and fails when s is 0 or a file cannot
      be written. Prints "slow-tests: <b> test binaries: <p> passed, <f> failed, <i> ignored"
      and the same after "slow-tests collect-every-safe-point: " and "slow-tests
      collect-every-safe-point opt-level 1: ", each with its ten slowest.

      The guard of the split: the run at opt-level 1 sets NO_STACK_TESTS
      (SWELL_NO_STACK_TESTS=1, the variable at the top of this file) for its test processes,
      and the two ways of swell's tests to a bounded stack, stack_with_room and stack_thread
      (crates/swell/tests/support/host.rs), panic when it is set, with a line that says the
      rule did not find the test and it must run at opt-level 0. So a stack test in a form the
      rule does not read (the list at the head of taskfiles/realm-room-tests.awk) fails the
      lane instead of passing on frames of another size. The runs at opt-level 0 do not set it.
      The gate's test-collect and the collect runs of test-realm-sizes run stack tests at
      opt-level 1 on purpose and do not set it either.

      The run at opt-level 1 is "cargo nextest run" with COLLECT_MAIN and RUSTFLAGS from
      COLLECT_RUSTFLAGS, the definitions the lane's background build (slow-collect-start)
      reads too. Run alone, this task builds it
      there. In the lane (SLOW_COLLECT=lane) the build was started beside slow-test262; the task
      first waits for .out/slow-collect/status, at most SLOW_COLLECT_WAIT seconds (400, under
      the part's 600), then prints "slow-build collect <seconds> s, exit <status>, waited <s> s:
      ..." (the build's own wall time, a line of its own, not a slow-time line: its seconds lie
      inside those of slow-test262 and slow-tests). It fails with "slow-tests: the build of the
      profile collect that the lane started failed, exit <n> (.out/slow-collect/log)" after the
      log, with "... wrote no status within <bound> s of waiting ..." when the bound passes, and
      with "... no build of the profile collect was started ..." when there is no
      .out/slow-collect/pid.
    silent: true
    vars:
      SLOW_COLLECT: '{{.SLOW_COLLECT | default ""}}'
    env:
      RUSTFLAGS: '{{.COLLECT_RUSTFLAGS}}'
    cmds:
      - mkdir -p .out
      - |
        all=""
        swell=""
        for f in $(grep -l SWELL_FULL_COUNTS crates/*/tests/*.rs | LC_ALL=C sort); do
          dir=${f%/tests/*}
          stem=${f##*/}
          stem=${stem%.rs}
          [ "$stem" = main ] && continue
          pkg=$(awk -F '"' '/^name *=/ { print $2; exit }' "$dir/Cargo.toml")
          term="(binary_id($pkg::main) & test(/^$stem::/))"
          all="$all${all:+ | }$term"
          if [ "$pkg" = swell ]; then swell="$swell${swell:+ | }$term"; fi
        done
        lib=""
        if grep -rqs SWELL_FULL_COUNTS crates/swell/src; then all="$all${all:+ | }binary_id(swell)"; lib="binary_id(swell)"; fi
        for f in $(grep -l stack_with_room crates/swell/tests/*.rs | LC_ALL=C sort); do
          stem=${f##*/}
          stem=${stem%.rs}
          term="(binary_id(swell::main) & test(/^$stem::/))"
          case " | $swell | " in *" | $term | "*) ;; *) swell="$swell${swell:+ | }$term" ;; esac
        done
        if [ -z "$all" ]; then echo "slow-tests: no test reads SWELL_FULL_COUNTS"; exit 1; fi
        echo "$all" > .out/slow-tests.filter
        echo "$swell" > .out/slow-tests-collect.filter
        echo "$lib" > .out/slow-tests-collect.lib
        rm -f .out/slow-tests-collect.status .out/slow-tests-collect-opt1.status
        status=0
        SWELL_FULL_COUNTS=1 cargo nextest run --workspace --locked --profile default -E "$all" > .out/slow-tests.log 2>&1 || status=$?
        echo "$status" > .out/slow-tests.status
      - task: nextest-report
        vars: {STEP: slow-tests, PREFIX: 'slow-tests: ', LOG: .out/slow-tests.log, STATUS: .out/slow-tests.status, JUNIT: target/nextest/default/junit.xml, MIN_PASSED: '1'}
      - |
        swell=$(cat .out/slow-tests-collect.filter)
        lib=$(cat .out/slow-tests-collect.lib)
        if [ -z "$swell$lib" ]; then echo "slow-tests collect-every-safe-point: no test binary of swell reads SWELL_FULL_COUNTS"; exit 0; fi
        set --
        for f in crates/swell/tests/support/*.rs; do [ -f "$f" ] && set -- "$@" "$f"; done
        for f in crates/swell/tests/*.rs; do [ "$f" = crates/swell/tests/main.rs ] || set -- "$@" "$f"; done
        list=.out/slow-tests-stack.txt
        awk -v rule=stack -f taskfiles/realm-room-tests.awk "$@" > "$list" || { echo "slow-tests: taskfiles/realm-room-tests.awk -v rule=stack failed, or $list cannot be written"; exit 1; }
        mods=$(awk '{ while (match($0, /test\(\/\^[A-Za-z0-9_]*::\//)) { printf " %s", substr($0, RSTART + 7, RLENGTH - 10); $0 = substr($0, RSTART + RLENGTH) } } END { print " " }' .out/slow-tests-collect.filter)
        set -- $(awk -v mods="$mods" '{ m = $2; sub(/::.*$/, "", m); if (!index(mods, " " m " ")) out++; else if ($3 == "not-in-collect") gone++; else if ($1 == "stack") low++; else high++ } END { print low + 0, high + 0, gone + 0, out + 0 }' "$list")
        low=$1 high=$2 gone=$3 out=$4
        echo "slow-tests collect-every-safe-point: $low of the $((low + high)) tests of swell::main in the collect filter's modules that the collect build holds run on a bounded stack (taskfiles/realm-room-tests.awk -v rule=stack) and run at opt-level 0${lib:+ with the unit tests of the library}, the $high others at opt-level 1; $gone test(s) of those modules are not in the collect build; $out test(s) of swell::main in other modules run in neither"
        [ "$low" -gt 0 ] || { echo "slow-tests: taskfiles/realm-room-tests.awk -v rule=stack finds no test of swell::main that runs on a bounded stack ($list)"; exit 1; }
        want=$(grep -c "^other " "$list" || true)
        for form in not only; do
          cfg=.out/slow-tests-collect-$form-other-nextest.toml
          if [ -f .config/nextest.toml ]; then set -- "$list" .config/nextest.toml; else set -- "$list"; fi
          awk -v form="$form" '
            function put(i) {
              printf "default-filter = '\''"
              if (!n) printf (form == "not" ? "all()" : "none()")
              else {
                printf (form == "not" ? "not (binary_id(swell::main) & (" : "binary_id(swell::main) & (")
                for (i = 1; i <= n; i++) printf "%s%s", (i > 1 ? " | " : ""), "test(=" name[i] ")"
                printf (form == "not" ? "))" : ")")
              }
              printf "'\''\n"
            }
            FILENAME == ARGV[1] { if ($1 == "other") name[++n] = $2; next }
            { print }
            /^[ \t]*\[profile\.default\][ \t]*$/ { put() }
            END { if (ARGC == 2) { print "[profile.default]"; put() } }
          ' "$@" > "$cfg" || { echo "slow-tests: cannot write $cfg, the nextest configuration that names the tests printed other"; exit 1; }
          lines=$(awk '/^[ \t]*default-filter[ \t]*=/ { n++ } END { print n + 0 }' "$cfg")
          named=$(awk '/^default-filter = / { c += gsub(/test\(=/, "&") } END { print c + 0 }' "$cfg")
          if [ ! -s "$cfg" ] || [ "$lines" != 1 ] || [ "$named" != "$want" ]; then
            echo "slow-tests: $cfg holds $lines default-filter line(s) naming $named of the $want tests printed other, not one line naming all of them (.config/nextest.toml has no line [profile.default], or a default-filter of its own)"
            exit 1
          fi
        done
        filter="$lib${lib:+${swell:+ | }}$swell"
        status=0
        SWELL_FULL_COUNTS=1 cargo nextest run --locked -p swell --features collect-every-safe-point --config-file "$(pwd)/.out/slow-tests-collect-not-other-nextest.toml" --profile default -E "$filter" > .out/slow-tests-collect.log 2>&1 || status=$?
        echo "$status" > .out/slow-tests-collect.status
      - task: nextest-report
        if: '[ -f .out/slow-tests-collect.status ]'
        vars: {STEP: slow-tests-collect, PREFIX: 'slow-tests collect-every-safe-point: ', LOG: .out/slow-tests-collect.log, STATUS: .out/slow-tests-collect.status, JUNIT: target/nextest/default/junit.xml, MIN_PASSED: '1'}
      - |
        swell=$(cat .out/slow-tests-collect.filter)
        [ -n "$swell" ] || exit 0
        if [ '{{.SLOW_COLLECT}}' = lane ]; then
          dir=.out/slow-collect
          bound='{{.SLOW_COLLECT_WAIT}}'
          [ -s "$dir/pid" ] || { echo "slow-tests: SLOW_COLLECT=lane, but no build of the profile collect was started (no $dir/pid; slow-collect-start starts it)"; exit 1; }
          began=$(date +%s)
          while [ ! -f "$dir/status" ] && [ $(( $(date +%s) - began )) -lt "$bound" ]; do sleep 1; done
          [ -f "$dir/status" ] || { echo "slow-tests: the build of the profile collect that the lane started wrote no status within $bound s of waiting ($dir/log)"; exit 1; }
          st=$(cat "$dir/status")
          secs=$(awk -v a="$(cat "$dir/start" 2>/dev/null)" -v b="$(cat "$dir/end" 2>/dev/null)" 'BEGIN { printf "%.1f", b - a }')
          echo "slow-build collect $secs s, exit $st, waited $(( $(date +%s) - began )) s: cargo nextest run --no-run {{.COLLECT_MAIN}}, in the background from the lane's start (slow-collect-start), inside the slow-time lines of slow-test262 and slow-tests"
          if [ "$st" != 0 ]; then
            cat "$dir/log"
            echo "slow-tests: the build of the profile collect that the lane started failed, exit $st ($dir/log)"
            exit 1
          fi
        fi
        status=0
        {{.NO_STACK_TESTS}}=1 SWELL_FULL_COUNTS=1 cargo nextest run {{.COLLECT_MAIN}} --config-file "$(pwd)/.out/slow-tests-collect-only-other-nextest.toml" -E "$swell" > .out/slow-tests-collect-opt1.log 2>&1 || status=$?
        echo "$status" > .out/slow-tests-collect-opt1.status
      - task: nextest-report
        if: '[ -f .out/slow-tests-collect-opt1.status ]'
        vars: {STEP: slow-tests-collect-opt1, PREFIX: 'slow-tests collect-every-safe-point opt-level 1: ', LOG: .out/slow-tests-collect-opt1.log, STATUS: .out/slow-tests-collect-opt1.status, JUNIT: target/nextest/default/junit.xml, MIN_PASSED: '1'}

  build-realm-sizes:
    desc: Build, without running it, the integration-test binary of swell in the two builds of test-realm-sizes, the test profile and the profile collect with the feature collect-every-safe-point; the lane builds both for slow-tests already.
    summary: |
      The build step of test-realm-sizes: "cargo nextest run --no-run --locked -p swell
      --profile default --test main" and "cargo nextest run --no-run --locked -p swell
      --features collect-every-safe-point --config .cargo/collect-profile.toml --cargo-profile
      collect --profile default --test main" (COLLECT_MAIN, the definition the lane's
      background build and slow-tests read too), with RUSTFLAGS="-D warnings", into
      .out/realm-sizes-build.log; with "--lib" beside "--test main" when a file under
      crates/swell/src reads SWELL_TEST_REALM_FUNCTIONS (none does: the padding lies in
      crates/swell/tests/support/host.rs). The first is the test profile at opt-level 0 that
      slow-tests builds for its run of every package; the second is the profile collect of the
      gate's step test-collect (opt-level 1), which slow-tests builds for the tests of its
      collect mode that run on no bounded stack; so in the lane they compile nothing new (story
      realm-size-lane-within-its-share). The build of the profile collect took 3 min 33 s on the
      forge on 2026-11-26 and 3 min 53 s on the build node (cold, 2026-11-27); the collect runs
      it serves took about 312 s of the forge's 431 s of test-realm-sizes at opt-level 0, and
      run about ten times faster on it (on 4 test threads on the build node, 31.3 s against
      2.8 s at k = 4, 45.3 s against 4.7 s at k = 200). The library's unit-test binary is not
      built: its build reads SWELL_FULL_COUNTS, which slow-tests sets, so building it here
      would compile it again. Prints "build-realm-sizes: <cargo's Finished line>" for each;
      when cargo fails it prints the log and fails.
    env:
      RUSTFLAGS: '{{.COLLECT_RUSTFLAGS}}'
    silent: true
    cmds:
      - mkdir -p .out
      - |
        targets="--test main"
        if grep -rqs SWELL_TEST_REALM_FUNCTIONS crates/swell/src; then targets="--lib --test main"; fi
        status=0
        {
          # shellcheck disable=SC2086
          cargo nextest run --no-run --locked -p swell --profile default $targets &&
          # shellcheck disable=SC2086
          cargo nextest run --no-run {{.COLLECT_MAIN}} ${targets%--test main}
        } > .out/realm-sizes-build.log 2>&1 || status=$?
        if [ "$status" -ne 0 ]; then cat .out/realm-sizes-build.log; echo "build-realm-sizes: cargo nextest run --no-run failed, exit $status"; exit 1; fi
        esc=$(printf '\033')
        LC_ALL=C sed "s/$esc\[[0-9;]*[A-Za-z]//g" .out/realm-sizes-build.log | awk '/^ *Finished / { sub(/^ */, ""); print "build-realm-sizes: " $0 }'

  test-realm-sizes:
    desc: Run the tests of swell that read the realm's room with each realm padded by k host functions, for each k of REALM_SIZES in the default mode and with a collection at every safe point at each k; a part of the lane slow, and the command a unit that adds to the realm runs before it reports.
    summary: |
      Run the tests of swell that read the realm's room in the mode of the step test, and with
      the feature collect-every-safe-point at each k too, with
      SWELL_TEST_REALM_FUNCTIONS=<k>, for each k of REALM_SIZES (default "4 11 17 38 64 128
      200"; a value given replaces the list): every
      realm a test makes through support::host::create_realm or support::host::realm is padded
      by k host functions (crates/swell/tests/support/host.rs, pad_realm), so that a test that
      compares with a room or a heap_bytes() reading fitted to one size of the realm goes red
      here (story tests-hold-at-any-size-of-the-realm). A part of the lane slow after
      slow-tests, not a step of check. A unit that adds anything to the realm (a builtin, an
      intrinsic, a property of one) runs "slot task test-realm-sizes" before it reports and
      names every red test with its k and mode.

      The tests (story realm-size-lane-within-its-share, point 3): those of the integration-test
      binary swell::main that taskfiles/realm-room-tests.awk does not print as "other", read
      from crates/swell/tests at each run, so the list never goes stale. That rule prints a
      test "room" when its own text, or a function of its file or of tests/support that it
      calls, names heap_bytes( or live_bytes( (or, in its file, memory_bytes or MemoryBudget);
      a test whose fn line a macro writes is not printed and runs. The tests printed "other"
      take no reading of the heap and set no budget, so the size of the realm can move none of
      their assertions about a room; and the library's unit tests make no padded realm (none
      reads the variable; when a file under crates/swell/src reads it, the library's unit
      tests run too, whole). Each test found red for the size of the realm before (the eight of
      story tests-hold-at-any-size-of-the-realm, the two of 5078361a) is a "room" test.

      The modes: the default mode and the collect mode at every k (REALM_COLLECT, default
      "all"; "ends" runs the collect mode at the smallest and the largest k only, for a quicker
      look by hand). The collect mode keeps every size because the defects this step exists for
      show at single sizes, and most of them in that mode alone: seven of the eight of story
      tests-hold-at-any-size-of-the-realm were red in the collect mode only, each at one growth
      of the realm; of the two of 5078361a, termination was red at 200 in the collect mode only;
      the proxy test of 2026-11-26 is red at 128 alone. The default mode runs in the test
      profile (opt-level 0), the collect mode in the profile collect of the step test-collect
      (opt-level 1, .cargo/collect-profile.toml), the two builds slow-tests makes; the collect
      mode's tests that run on a bounded stack keep their unoptimized frames in slow-tests
      (story realm-size-lane-within-its-share). A test stays under 2 CPU seconds in the
      collect mode: builtins_json_parse::parse_gives_back_its_charges_on_every_way_out, 21.5 s
      of the 22.7 s collect run at k = 4 before, nests 200 levels in that mode and 2,000 under
      SWELL_FULL_COUNTS=1 (its way_out_depth). build-realm-sizes builds both.
      First it prints "realm-sizes: <r> of <n> tests of swell::main read the realm's room
      (taskfiles/realm-room-tests.awk); <o> others do not run here" and fails when r is 0,
      then "realm-sizes: the default mode at k = <list>, the collect mode at k = <list>".
      Then each run writes .out/realm-sizes-<k>-<mode>.log (mode default or collect) and its
      JUnit file .out/realm-sizes-<k>-<mode>.junit.xml, and prints "realm-sizes <k> <mode>: <p>
      passed, <f> failed, <s> skipped in <seconds> s, slowest <test> <seconds> s" (skipped: the
      tests not selected, and the ignored ones), then each failed test as "realm-sizes <k>
      <mode>: failed <binary> <test>". A red run does not stop the loop. A run red without a
      Summary line says so; a run whose log holds a cargo Compiling line counts red, naming
      build-realm-sizes. Last it prints "realm-sizes: <n> run(s) red" and fails when n is not
      0. A k that is not a whole number, and a REALM_COLLECT other than ends or all, fail
      before any run.

      How the tests printed "other" reach nextest: in a file, never on a command line or in a
      variable of the environment, so the task runs at any count of tests (Linux takes at most
      131,072 bytes in one argument, and their filter was 75,099 bytes for 996 tests on
      2026-11-26). Before the runs the task writes .out/realm-sizes-nextest.toml, a copy of
      .config/nextest.toml with one line added under [profile.default]: "default-filter =
      'not (binary_id(swell::main) & (test(=<module>::<test>) | ...))'", one term per test
      printed "other" ('all()' when there is none). Each run passes it with --config-file and
      keeps --profile default and -E binary_id(swell::main) (with " | binary_id(swell)" when the
      library's unit tests run too); nextest intersects the two, so the same tests run, and
      every other rule of the profile default (the 60 s bound with terminate-after, the JUnit
      file target/nextest/default/junit.xml) holds as in .config/nextest.toml. The task fails
      before any run when it cannot write .out/realm-sizes-tests.txt or the file is empty, and
      when it cannot write .out/realm-sizes-nextest.toml or that file does not hold one
      default-filter line naming every test printed "other", each with a line that names the
      file. tests/gate/test-realm-sizes-hands-nextest-a-long-list-of-tests.sh holds this.
    vars:
      REALM_SIZES: '{{.REALM_SIZES | default "4 11 17 38 64 128 200"}}'
      REALM_COLLECT: '{{.REALM_COLLECT | default "all"}}'
    env:
      RUSTFLAGS: '{{.COLLECT_RUSTFLAGS}}'
    silent: true
    cmds:
      - task: build-realm-sizes
      - |
        sizes={{shellQuote .REALM_SIZES}}
        collect={{shellQuote .REALM_COLLECT}}
        lo=""
        hi=""
        for k in $sizes; do
          case "$k" in ''|*[!0-9]*) echo "realm-sizes: REALM_SIZES holds $k, not a whole number"; exit 1 ;; esac
          if [ -z "$lo" ] || [ "$k" -lt "$lo" ]; then lo=$k; fi
          if [ -z "$hi" ] || [ "$k" -gt "$hi" ]; then hi=$k; fi
        done
        [ -n "$sizes" ] || { echo "realm-sizes: REALM_SIZES names no size"; exit 1; }
        case "$collect" in ends | all) ;; *) echo "realm-sizes: REALM_COLLECT is $collect, not ends or all"; exit 1 ;; esac
        both=""
        for k in $sizes; do
          if [ "$collect" = all ] || [ "$k" -eq "$lo" ] || [ "$k" -eq "$hi" ]; then both="$both${both:+ }$k"; fi
        done
        set --
        for f in crates/swell/tests/support/*.rs; do [ -f "$f" ] && set -- "$@" "$f"; done
        for f in crates/swell/tests/*.rs; do [ "$f" = crates/swell/tests/main.rs ] || set -- "$@" "$f"; done
        list=.out/realm-sizes-tests.txt
        awk -f taskfiles/realm-room-tests.awk "$@" > "$list" || { echo "realm-sizes: taskfiles/realm-room-tests.awk failed, or $list cannot be written"; exit 1; }
        [ -s "$list" ] || { echo "realm-sizes: $list is empty: taskfiles/realm-room-tests.awk finds no test in crates/swell/tests"; exit 1; }
        room=$(grep -c '^room ' "$list" || true)
        other=$(grep -c '^other ' "$list" || true)
        echo "realm-sizes: $room of $((room + other)) tests of swell::main read the realm's room (taskfiles/realm-room-tests.awk); $other others do not run here"
        [ "$room" -gt 0 ] || { echo "realm-sizes: taskfiles/realm-room-tests.awk finds no test that reads the realm's room ($list)"; exit 1; }
        cfg=.out/realm-sizes-nextest.toml
        if [ -f .config/nextest.toml ]; then set -- "$list" .config/nextest.toml; else set -- "$list"; fi
        awk '
          function put(i) {
            printf "default-filter = '\''"
            if (!n) printf "all()"
            else {
              printf "not (binary_id(swell::main) & ("
              for (i = 1; i <= n; i++) printf "%s%s", (i > 1 ? " | " : ""), "test(=" name[i] ")"
              printf "))"
            }
            printf "'\''\n"
          }
          FILENAME == ARGV[1] { if ($1 == "other") name[++n] = $2; next }
          { print }
          /^[ \t]*\[profile\.default\][ \t]*$/ { put() }
          END { if (ARGC == 2) { print "[profile.default]"; put() } }
        ' "$@" > "$cfg" || { echo "realm-sizes: cannot write $cfg, the nextest configuration that holds the $other tests that do not run here"; exit 1; }
        lines=$(awk '/^[ \t]*default-filter[ \t]*=/ { n++ } END { print n + 0 }' "$cfg")
        named=$(awk '/^default-filter = / { c += gsub(/test\(=/, "&") } END { print c + 0 }' "$cfg")
        if [ ! -s "$cfg" ] || [ "$lines" != 1 ] || [ "$named" != "$other" ]; then
          echo "realm-sizes: $cfg holds $lines default-filter line(s) naming $named of the $other tests that do not run here, not one line naming all of them (.config/nextest.toml has no line [profile.default], or a default-filter of its own)"
          exit 1
        fi
        cfg="$(pwd)/$cfg"
        filter="binary_id(swell::main)"
        targets="--test main"
        if grep -rqs SWELL_TEST_REALM_FUNCTIONS crates/swell/src; then
          targets="--lib --test main"
          filter="binary_id(swell::main) | binary_id(swell)"
          echo "realm-sizes: a file under crates/swell/src reads SWELL_TEST_REALM_FUNCTIONS; the library's unit tests run too"
        fi
        echo "realm-sizes: the default mode at k = $(echo $sizes), the collect mode at k = $both (REALM_COLLECT=$collect)"
        esc=$(printf '\033')
        red=0
        for k in $sizes; do
          modes=default
          case " $both " in *" $k "*) modes="default collect" ;; esac
          for mode in $modes; do
            log=.out/realm-sizes-$k-$mode.log
            status=0
            if [ "$mode" = default ]; then
              # shellcheck disable=SC2086
              SWELL_TEST_REALM_FUNCTIONS=$k cargo nextest run --locked -p swell --config-file "$cfg" --profile default $targets -E "$filter" > "$log" 2>&1 || status=$?
            else
              # shellcheck disable=SC2086
              SWELL_TEST_REALM_FUNCTIONS=$k cargo nextest run {{.COLLECT_MAIN}} ${targets%--test main} --config-file "$cfg" -E "$filter" > "$log" 2>&1 || status=$?
            fi
            cp target/nextest/default/junit.xml ".out/realm-sizes-$k-$mode.junit.xml" 2>/dev/null || :
            LC_ALL=C sed "s/$esc\[[0-9;]*[A-Za-z]//g" "$log" > "$log.plain"
            LC_ALL=C awk -v k="$k" -v mode="$mode" -v status="$status" '
              /^ *Summary \[/ {
                summary = 1
                wall = $0; sub(/^ *Summary \[ */, "", wall); sub(/s\].*$/, "", wall)
                for (i = 1; i <= NF; i++) {
                  w = $(i + 1); gsub(/[^a-z]/, "", w)
                  if ($i ~ /^run:?$/ && i > 2 && $(i - 2) ~ /^[0-9]+$/) run = $(i - 2)
                  if (w == "passed" && $i ~ /^[0-9]+$/) passed = $i
                  if (w == "skipped" && $i ~ /^[0-9]+$/) skipped = $i
                }
              }
              /^ *PASS \[ *[0-9.]+s\]/ {
                t = $0; sub(/^ *PASS \[ */, "", t); sub(/s\].*$/, "", t)
                if (t + 0 > slowest + 0) { slowest = t; slow_test = $NF }
              }
              /^ *(FAIL|TIMEOUT|SIGSEGV|SIGABRT|SIGKILL|ABORT) \[/ && !seen[$(NF - 1) " " $NF]++ { failed_tests[++n] = $(NF - 1) " " $NF }
              /^ *Compiling [^ ]+ v[0-9]/ { compiled++ }
              END {
                failed = run - passed
                printf "realm-sizes %s %s: %d passed, %d failed, %d skipped in %.1f s, slowest %s %.1f s\n", k, mode, passed, failed, skipped, wall, (slow_test == "" ? "none" : slow_test), slowest
                for (i = 1; i <= n; i++) printf "realm-sizes %s %s: failed %s\n", k, mode, failed_tests[i]
                if (!summary) printf "realm-sizes %s %s: no Summary line, exit %s\n", k, mode, status
                if (compiled) printf "realm-sizes %s %s: compiled %d crate(s), which the task build-realm-sizes builds before the runs\n", k, mode, compiled
                exit (status != 0 || !summary || failed > 0 || compiled > 0)
              }
            ' "$log.plain" || red=$((red + 1))
          done
        done
        echo "realm-sizes: $red run(s) red"
        [ "$red" -eq 0 ]

  gate-vars:
    desc: Print, on one line, every gate variable that has a value before the checks run; a redirected run shows in its own output.
    summary: |
      Print, on one line, every gate variable that has a value before the checks run.

      Task takes a variable from the environment when none is passed on the command line, so an
      exported GATE_ROOT, TEST262_CACHE, SPEC_REFUSALS_MAX and the like changes what a check
      reads. The gate's variables carry a prefix so that this does not happen by accident; this
      task prints each of them that has a value from the command line, the environment or a
      task file's own defaults, as "gate: variables in effect: NAME=value ...". The SPEC_ ones,
      the SITE_DATA_ ones (taskfiles/site.yml, included flat) and TEST_RUSTFLAGS and
      TEST_NEXTEST_ARGS (taskfiles/realm-places.yml, included flat; the steps that read them
      refuse a value that is not the file's, task test-vars-check) and the lane's COLLECT_MAIN,
      COLLECT_RUSTFLAGS, SLOW_COLLECT_WAIT and NO_STACK_TESTS and the step test's
      TEST_OPT1_ARGS and TEST_OPT1_PROFILE_TEST (the top of this file; the steps test and
      build-tests refuse a value of those two and of NO_STACK_TESTS that is not the file's, task
      test-opt1-vars-check) always show, with their defaults; any other name on the line was
      set by the caller. A new gate
      variable is added to GATE_VARIABLES in the change that adds it.

      It fails in one case, after that line: a flag variable of cargo in the environment
      (RUSTFLAGS, CARGO_ENCODED_RUSTFLAGS, CARGO_BUILD_RUSTFLAGS or a
      CARGO_TARGET_<triple>_RUSTFLAGS) whose value names test_modules, the cfg that makes swell's
      one test binary compile only some of its modules (taskfiles/test-main.sh). go-task lets an
      exported variable win over a task's own env, so such a value would reach every build of
      the gate and of the lane slow, which run gate-vars first, and leave swell::main with a
      part of its tests in silence. It prints "gate: <variable> names test_modules (<value>);
      the gate and the lane slow build every module of swell's tests, and only
      build-stack-profiles selects some, by cargo rustc arguments" for each. build-stack-profiles
      passes the cfg after "cargo rustc ... --", not in the environment, and is not refused.
      The planted script tests/gate/gate-vars-refuses-rustflags-naming-test-modules.sh holds
      it.
    vars:
      GATE_VARIABLES: >-
        GATE_ROOT GATE_CRATES GATE_LOCK
        TEST262_URL TEST262_COMMIT TEST262_TREE TEST262_LS_TREE_SHA256 TEST262_CACHE
        UNICODE_DATA_DIR UNICODE_DATA_REQUIRED
        LIBM_ROOT MATH_DATA_DIR
        NOSTD_ROOT NOSTD_TARGET NOSTD_PACKAGES NOSTD_OUT NOSTD_LIBS NOSTD_NM_OUTPUT
        SPEC_REFUSALS_MAX SPEC_OUT SPEC_SYNTHESIZE_LOG SPEC_CONFORM_LOG
        ESS_SUITE ESS_UNSUPPORTED_MAX
        HOST_REQ_DOC HOST_REQ_LIST HOST_REQ_SPEC HOST_REQ_DELIVERED HOST_REQ_TEST_LIST
        HOST_SURFACE_ROOT HOST_SURFACE_OUT HOST_SURFACE_SNAPSHOT HOST_SURFACE_CHANGELOG HOST_SURFACE_VERSION
        TEST262_DESIGN TEST262_FEATURES TEST262_SECTIONS TEST262_EXPECTED TEST262_DIGEST TEST262_OUT TEST262_WORKERS TEST262_RUN TEST262_PART TEST262_FROM_PARTS
        TEST262_MOVES TEST262_LATER_PARTS
        GATE_NEXTEST_STEPS GATE_TIME_BUDGET GATE_CPU_BOUNDS GATE_SELFTEST_DIR GATE_SELFTEST_JOBS GATE_SELFTEST_TREE
        GATE_RUNNER_ENV GATE_TEST_BUILD_JSON
        TEST_RUSTFLAGS TEST_NEXTEST_ARGS
        PERF_BIN PERF_BASE_BIN
        COLLECT_MAIN COLLECT_RUSTFLAGS SLOW_COLLECT_WAIT NO_STACK_TESTS
        TEST_OPT1_ARGS
        TEST_OPT1_PROFILE_TEST
        REALM_SIZES REALM_COLLECT SLOW_LANE_BUDGET SLOW_PART_BUDGET STACK_MODULES STACK_TESTS STACK_TESTS_DIR
        SITE_DATA_FILE SITE_DATA_OUT SITE_DATA_EXPECTED SITE_DATA_DELIVERED SITE_DATA_REQUIREMENTS SITE_DATA_MOVES SITE_DATA_DESIGN SITE_DATA_MANIFEST SITE_DATA_LOCK SITE_DATA_CRATES SITE_DATA_ENGINES SITE_DATA_CATALOG SITE_DATA_PUBLISHED SITE_DATA_RESULTS SITE_DATA_PIN SITE_DATA_LIMITS SITE_DATA_INTERRUPT
    silent: true
    cmds:
      - |
        set="{{range $n := splitList " " .GATE_VARIABLES}}{{with index $ $n}} {{$n}}={{.}}{{end}}{{end}}"
        if [ -n "$set" ]; then echo "gate: variables in effect:$set"; else echo "gate: variables in effect: none"; fi
        env | LC_ALL=C awk '
          {
            eq = index($0, "=")
            if (eq == 0) next
            n = substr($0, 1, eq - 1)
            v = substr($0, eq + 1)
            if (n != "RUSTFLAGS" && n != "CARGO_ENCODED_RUSTFLAGS" && n != "CARGO_BUILD_RUSTFLAGS" && n !~ /^CARGO_TARGET_[A-Z0-9_]+_RUSTFLAGS$/) next
            if (index(v, "test_modules") == 0) next
            gsub(/\037/, " ", v)
            printf "gate: %s names test_modules (%s); the gate and the lane slow build every module of swell'"'"'s tests, and only build-stack-profiles selects some, by cargo rustc arguments\n", n, v
            bad = 1
          }
          END { exit bad }
        '

  python-check:
    desc: Fail, naming each, when a file of the tree is a Python file.
    summary: |
      Fail, naming each, when a file of the tree is a Python file (AGENTS.md, Rules).

      Reads the files git lists for GATE_ROOT (default .), tracked or untracked but not ignored,
      so .cache/, .out/ and target/ are not read. A file whose name ends in .py, .pyw or .pyi, or
      whose first line starts with #! and contains python, is named as "<path>: a Python file".
      No file at all fails too. The log is .out/python-check.log.
    vars:
      GATE_ROOT: '{{.GATE_ROOT | default "."}}'
    env:
      GATE_ROOT: '{{.GATE_ROOT}}'
    silent: true
    cmds:
      - mkdir -p .out
      - |
        files=$(git -C "$GATE_ROOT" ls-files --cached --others --exclude-standard) || { echo "python-check: git cannot list the files of $GATE_ROOT"; exit 1; }
        printf '%s\n' "$files" | awk -v root="$GATE_ROOT" '
          $0 == "" { next }
          {
            files++
            path = (root == "." ? $0 : root "/" $0)
            python = ($0 ~ /\.(py|pyw|pyi)$/)
            if (!python) {
              line = ""
              if ((getline line < path) > 0 && line ~ /^#!/ && line ~ /python/) python = 1
              close(path)
            }
            if (python) { print path ": a Python file"; found++ }
          }
          END {
            if (found) { print "python-check: " found " Python file(s) among " files " file(s); no Python anywhere (AGENTS.md, Rules)"; exit 1 }
            if (!files) { print "python-check: git lists no file under " root; exit 1 }
            print "python-check: no Python file among " files+0 " file(s)"
          }
        ' | tee .out/python-check.log

  forbid-unsafe-check:
    desc: 'Fail, naming each, when a crate root lacks the line #![forbid(unsafe_code)].'
    summary: |
      Fail, naming each, when a crate root lacks the line #![forbid(unsafe_code)] (AGENTS.md, Rules).

      The crate roots are src/lib.rs, src/main.rs and src/bin/*.rs of every directory under
      GATE_CRATES (default crates). Each must hold #![forbid(unsafe_code)] as a line of its own; one
      without it is named as "<path>: no #![forbid(unsafe_code)]". No crate root at all fails
      too. The log is .out/forbid-unsafe-check.log.
    vars:
      GATE_CRATES: '{{.GATE_CRATES | default "crates"}}'
    env:
      GATE_CRATES: '{{.GATE_CRATES}}'
    silent: true
    cmds:
      - mkdir -p .out
      - |
        {
          roots=0
          missing=0
          for root in "$GATE_CRATES"/*/src/lib.rs "$GATE_CRATES"/*/src/main.rs "$GATE_CRATES"/*/src/bin/*.rs; do
            [ -f "$root" ] || continue
            roots=$((roots + 1))
            if ! grep -qxF '#![forbid(unsafe_code)]' "$root"; then
              echo "$root: no #![forbid(unsafe_code)]"
              missing=$((missing + 1))
            fi
          done
          if [ "$roots" -eq 0 ]; then
            echo "forbid-unsafe-check: no crate root under $GATE_CRATES"
            exit 1
          fi
          if [ "$missing" -gt 0 ]; then
            echo "forbid-unsafe-check: $missing of $roots crate root(s) without #![forbid(unsafe_code)]"
            exit 1
          fi
          echo "forbid-unsafe-check: $roots crate root(s), each with #![forbid(unsafe_code)]"
        } | tee .out/forbid-unsafe-check.log

  lock-check:
    desc: Fail, naming each package, when the root Cargo.lock holds one from outside this repository.
    summary: |
      Fail, naming each package, when the root Cargo.lock holds one from outside this repository.

      Nothing that ships uses a third-party crate (AGENTS.md, Rules), and the root Cargo.lock
      proves it. cargo writes a source line for every package it takes from a registry or a git
      repository, and none for a crate it reaches by path. Each package with a source line is
      named as "Cargo.lock: <name> <version> from <source>". A missing lock fails too. GATE_LOCK
      (default Cargo.lock) is the file read. The log is .out/lock-check.log.

      A path dependency on a directory outside this repository has no source line either, and is
      not caught here.
    vars:
      GATE_LOCK: '{{.GATE_LOCK | default "Cargo.lock"}}'
    env:
      GATE_LOCK: '{{.GATE_LOCK}}'
    silent: true
    cmds:
      - mkdir -p .out
      - |
        {
          test -f "$GATE_LOCK" || { echo "Cargo.lock: $GATE_LOCK is missing; the root workspace's lock is committed"; exit 1; }
          awk '
            /^\[\[package\]\]$/ { packages++; name = ""; version = "" }
            /^name = / { name = $3; gsub(/"/, "", name) }
            /^version = / { version = $3; gsub(/"/, "", version) }
            /^source = / { source = $3; gsub(/"/, "", source); print "Cargo.lock: " name " " version " from " source; outside++ }
            END {
              if (outside) { print outside " package(s) from outside this repository; nothing that ships may use a third-party crate"; exit 1 }
              print "Cargo.lock: " packages+0 " package(s), none from outside this repository"
            }
          ' "$GATE_LOCK"
        } | tee .out/lock-check.log

  test-vars-check:
    desc: Internal. Fail a step when TEST_RUSTFLAGS or TEST_NEXTEST_ARGS is empty or is not the value taskfiles/realm-places.yml defines.
    summary: |
      Internal, the first command of build, build-tests, test, test-doc and
      realm-places-expected, which take their RUSTFLAGS (and build-tests, test and the writer
      their nextest arguments) from TEST_RUSTFLAGS and TEST_NEXTEST_ARGS of
      taskfiles/realm-places.yml (story realm-walk-in-parts-under-the-cpu-bound), so that the
      writer of the file of places and the gate's build and test steps share one build. go-task
      lets a value given on the command line win over the file's, and takes an exported value
      when that include is missing; neither may change what the gate builds or runs, and
      gate-vars prints both names with their value. STEP names the step in the line. It fails
      with "<step>: TEST_RUSTFLAGS or TEST_NEXTEST_ARGS is empty; taskfiles/realm-places.yml
      defines them" when either is empty, and with "<step>: TEST_RUSTFLAGS=<value> or
      TEST_NEXTEST_ARGS=<value> is not the value taskfiles/realm-places.yml defines; the steps
      take both from that file only, not from the command line or the environment" when either
      differs from its line "  <name>: <value>" in that file, a plain value. An exported
      RUSTFLAGS still wins over a step's env in go-task; gate-vars refuses only one that names
      test_modules.
    silent: true
    cmds:
      - |
        flags={{shellQuote .TEST_RUSTFLAGS}}
        args={{shellQuote .TEST_NEXTEST_ARGS}}
        file=taskfiles/realm-places.yml
        if [ -z "$flags" ] || [ -z "$args" ]; then echo "{{.STEP}}: TEST_RUSTFLAGS or TEST_NEXTEST_ARGS is empty; $file defines them"; exit 1; fi
        defined_flags=$(sed -n 's/^  TEST_RUSTFLAGS: //p' "$file" 2>/dev/null || true)
        defined_args=$(sed -n 's/^  TEST_NEXTEST_ARGS: //p' "$file" 2>/dev/null || true)
        if [ "$flags" != "$defined_flags" ] || [ "$args" != "$defined_args" ]; then
          echo "{{.STEP}}: TEST_RUSTFLAGS=$flags or TEST_NEXTEST_ARGS=$args is not the value $file defines; the steps take both from that file only, not from the command line or the environment"
          exit 1
        fi

  test-opt1-vars-check:
    desc: Internal. Fail a step when TEST_OPT1_ARGS, NO_STACK_TESTS or TEST_OPT1_PROFILE_TEST is empty or is not the value its line at the top of Taskfile.yml defines.
    summary: |
      Internal, a command of the steps test and build-tests, after test-vars-check (story
      gate-test-steps-hold-the-budget-on-the-slower-runner, item 3). The step test's run at
      opt-level 1 takes its arguments from TEST_OPT1_ARGS (the profile collect), the guard of its
      test processes from NO_STACK_TESTS, and the test that must be in it from
      TEST_OPT1_PROFILE_TEST (task test-split); build-tests builds that run's binary from
      TEST_OPT1_ARGS. go-task lets a value given on the command line win over the file's; such a
      value would run that run at opt-level 0, without its guard, or without the test that holds
      its profile, under the same lines. For each of the three it fails, before any cargo runs,
      with "<step>: <name>=<value> is not the value Taskfile.yml defines (<the file's value>);
      the step takes it from that line only, not from the command line or the environment" when
      the value is empty or differs from its line "  <name>: <value>" in Taskfile.yml, a plain
      value. The lane's tasks (slow-tests, slow-collect-start) do not call it. The planted script
      tests/gate/test-refuses-a-caller-value-of-its-run-at-opt-level-1.sh holds it.
    silent: true
    cmds:
      - |
        file=Taskfile.yml
        bad=0
        held() {
          defined=$(sed -n "s/^  $1: //p" "$file" 2>/dev/null || true)
          if [ -z "$2" ] || [ "$2" != "$defined" ]; then
            echo "{{.STEP}}: $1=$2 is not the value $file defines ($defined); the step takes it from that line only, not from the command line or the environment"
            bad=1
          fi
        }
        held TEST_OPT1_ARGS {{shellQuote .TEST_OPT1_ARGS}}
        held NO_STACK_TESTS {{shellQuote .NO_STACK_TESTS}}
        held TEST_OPT1_PROFILE_TEST {{shellQuote .TEST_OPT1_PROFILE_TEST}}
        exit "$bad"

  test-opt1-profile-check:
    desc: Internal. Fail build-tests, naming file and line, when Cargo.toml or .cargo/config.toml sets a profile for one package or for build scripts in the profile dev or test, defines the profile collect, or includes another configuration file.
    summary: |
      Internal, a command of build-tests before any cargo runs (story
      gate-test-steps-hold-the-budget-on-the-slower-runner, item 3). The test
      TEST_OPT1_PROFILE_TEST holds that debug assertions and overflow checks are on in the
      profile of the step test's run at opt-level 1, but it reads the profile of its own crate
      only: a setting of another crate the binary links, or of build scripts and proc macros,
      goes unseen. That run uses the profile collect, which inherits test, which inherits dev.
      The profile collect is defined in .cargo/collect-profile.toml only, which
      build-collect holds to its three lines. So this task reads Cargo.toml, .cargo/config.toml
      and .cargo/config (those that exist), with comments, blanks and quotes of keys removed,
      and fails with one line "build-tests: <file>:<line>: <text>: <reason>" for each table
      [profile.<name>.package.<...>] or [profile.<name>.build-override] with <name> dev or
      test, each table [profile.collect...], and each dotted key or inline table that reaches
      the same places (profile.<name>.package..., package.<...> = ... under [profile.<name>],
      collect = {...} under [profile]); for a key include at the top of .cargo/config.toml or
      .cargo/config (include = [...] or [[include]]), since this task does not read a file
      the configuration includes; and with "build-tests: <variable> is set in the
      environment: <reason>" for a variable CARGO_PROFILE_DEV_ or CARGO_PROFILE_TEST_
      followed by PACKAGE_... or BUILD_OVERRIDE_..., or CARGO_PROFILE_COLLECT_.... A profile
      of one package or of build scripts in another profile (release, bench) passes. A
      cargo configuration file outside the tree (a parent directory's .cargo/config.toml,
      CARGO_HOME's) is not read, nor a key written with an escape or an inline table over
      several lines. The planted script
      tests/gate/build-tests-refuses-a-profile-its-profile-test-does-not-see.sh holds it.
    silent: true
    cmds:
      - |
        set --
        for f in Cargo.toml .cargo/config.toml .cargo/config; do
          if [ -f "$f" ]; then set -- "$@" "$f"; fi
        done
        bad=0
        if [ "$#" -gt 0 ]; then
          LC_ALL=C awk -v test={{shellQuote .TEST_OPT1_PROFILE_TEST}} '
            FNR == 1 { table = "" }
            function why(path,    p, n) {
              n = split(path, p, ".")
              if (FILENAME != "Cargo.toml" && (path == "include" || path ~ /^include\./)) return "cargo reads the files it names, and a file it includes is not read by this check, so a profile there would go unseen by the test " test
              if (p[1] != "profile" || n < 2) return ""
              if (p[2] == "collect") return "the profile collect is defined in .cargo/collect-profile.toml only, which build-collect holds to its three lines"
              if (n >= 3 && (p[2] == "dev" || p[2] == "test") && (p[3] == "package" || p[3] == "build-override")) return "a profile of one package or of build scripts in the profile " p[2] ", which the profile collect of the run at opt-level 1 inherits, and which the test " test " does not see: it reads the profile of its own crate"
              return ""
            }
            function refuse(r) { printf "build-tests: %s:%d: %s: %s\n", FILENAME, FNR, text, r; bad = 1 }
            {
              text = $0; sub(/^[ \t]+/, "", text); sub(/[ \t]+$/, "", text)
              line = $0; sub(/#.*/, "", line); gsub(/[ \t"\047]/, "", line)
              if (line == "") next
              if (line ~ /^\[\[/) {
                table = line; sub(/^\[\[/, "", table); sub(/\]\].*$/, "", table)
                r = why(table); if (r != "") refuse(r)
                table = ""; next
              }
              if (line ~ /^\[/) {
                table = line; sub(/^\[/, "", table); sub(/\].*$/, "", table)
                r = why(table); if (r != "") refuse(r)
                next
              }
              eq = index(line, "="); if (eq == 0) next
              key = substr(line, 1, eq - 1); value = substr(line, eq + 1)
              path = (table == "" ? key : table "." key)
              r = why(path)
              if (r == "" && value ~ /^\{/ && (path == "profile" || path ~ /^profile\.[^.]+$/)) {
                if (path == "profile" && value ~ /[{,]collect[.=]/) r = why("profile.collect")
                else if (value ~ /[{,](package|build-override)[.=]/ || value ~ /[{,][^{},=]*\.(package|build-override)[.=]/) r = why((path != "profile" ? path : value ~ /[{,](dev|test)[.=]/ ? "profile.test" : "profile.other") ".package")
              }
              if (r != "") refuse(r)
            }
            END { exit bad }
          ' "$@" || bad=1
        fi
        env | LC_ALL=C awk '
          {
            eq = index($0, "="); if (eq == 0) next
            n = substr($0, 1, eq - 1)
            if (n !~ /^CARGO_PROFILE_/) next
            if (n ~ /^CARGO_PROFILE_COLLECT_/) r = "the profile collect is defined in .cargo/collect-profile.toml only"
            else if (n ~ /^CARGO_PROFILE_(DEV|TEST)_(PACKAGE|BUILD_OVERRIDE)_/) r = "a profile of one package or of build scripts in the profile dev or test, which the profile collect of the run at opt-level 1 inherits, and which its profile test does not see"
            else next
            printf "build-tests: %s is set in the environment: %s\n", n, r
            bad = 1
          }
          END { exit bad }
        ' || bad=1
        exit "$bad"

  build:
    desc: Build every crate and target of the workspace with warnings denied.
    env:
      RUSTFLAGS: '{{.TEST_RUSTFLAGS}}'
    silent: true
    cmds:
      - task: test-vars-check
        vars: {STEP: build}
      - mkdir -p .out
      - cargo build --workspace --all-targets --locked > .out/build.log 2>&1 || { cat .out/build.log; exit 1; }
      - tail -n 1 .out/build.log

  build-tests:
    desc: The gate's build phase after build. Build, without running them, every binary the timed test steps run, with each step's flags, features, profile and manifest.
    summary: |
      The gate's build phase after build, before gate-time-start: build, without running them,
      every binary the timed test steps run, each with the flags, features, profile and
      manifest of its step (RUSTFLAGS="-D warnings" for all of them), so that each step finds
      its binaries fresh and compiles nothing inside the clock (the organization's rule "Tests
      stay fast"). First it refuses a caller's value of TEST_RUSTFLAGS or TEST_NEXTEST_ARGS
      (task test-vars-check) and of TEST_OPT1_ARGS, NO_STACK_TESTS or TEST_OPT1_PROFILE_TEST
      (task test-opt1-vars-check), and a profile of one package or of build scripts in the
      profile dev or test, a definition of the profile collect, or an include of another
      configuration file, in Cargo.toml or .cargo/config.toml, which the test
      TEST_OPT1_PROFILE_TEST of the run at opt-level 1 does not see (task
      test-opt1-profile-check).
        - the step test: "cargo nextest run --no-run --workspace --locked --profile default"
          into .out/build-tests.log; it prints "build-tests: <cargo's Finished line>". The
          workspace's libraries it builds are the ones test-doc's doc tests link. Then the
          binary of the step's run at opt-level 1, "cargo nextest run --no-run
          <TEST_OPT1_ARGS>" (swell::main in the profile collect, without the feature
          collect-every-safe-point) into .out/build-tests-opt1.log; it prints "build-tests
          opt-level 1: <cargo's Finished line>". It comes before build-collect, whose check of
          <target>/collect/deps for .debug_ sections then covers it;
        - the step test-collect, and test-doc's doc tests of that mode: task build-collect
          (taskfiles/collect-mode.yml);
        - the step test-faults: task build-faults (taskfiles/fault-injection.yml);
        - the step conform-engine, its test run and its cargo run: task build-conform-engine
          (taskfiles/conform-engine.yml);
        - the step gate-selftest, the release runner of test262 its planted scripts run: task
          build-test262-runner (without RUSTFLAGS, as the task test262 runs it).
      The doc tests themselves are not built here: rustdoc compiles each when it runs it, and
      cargo refuses --no-run with --doc. test262-check and test262-moves-check build nothing.
      gate-time-sum fails a run whose test steps wrote into a cargo target directory.
      A cargo that fails prints its log and fails the task. The steps hold to it: nextest-report,
      test-doc and the cargo run of conform-engine fail when their log has a Compiling line,
      naming the build task (task compile-check).
    env:
      RUSTFLAGS: '{{.TEST_RUSTFLAGS}}'
    silent: true
    cmds:
      - task: test-vars-check
        vars: {STEP: build-tests}
      - task: test-opt1-vars-check
        vars: {STEP: build-tests}
      - task: test-opt1-profile-check
      - mkdir -p .out
      - |
        status=0
        cargo nextest run --no-run {{.TEST_NEXTEST_ARGS}} > .out/build-tests.log 2>&1 || status=$?
        if [ "$status" -ne 0 ]; then cat .out/build-tests.log; echo "build-tests: cargo nextest run --no-run failed, exit $status"; exit 1; fi
        esc=$(printf '\033')
        LC_ALL=C sed "s/$esc\[[0-9;]*[A-Za-z]//g" .out/build-tests.log | awk '/^ *Finished / { sub(/^ */, ""); line = $0 } END { print "build-tests: " line }'
      - |
        status=0
        cargo nextest run --no-run {{.TEST_OPT1_ARGS}} > .out/build-tests-opt1.log 2>&1 || status=$?
        if [ "$status" -ne 0 ]; then cat .out/build-tests-opt1.log; echo "build-tests: cargo nextest run --no-run {{.TEST_OPT1_ARGS}} failed, exit $status"; exit 1; fi
        esc=$(printf '\033')
        LC_ALL=C sed "s/$esc\[[0-9;]*[A-Za-z]//g" .out/build-tests-opt1.log | awk '/^ *Finished / { sub(/^ */, ""); line = $0 } END { print "build-tests opt-level 1: " line }'
      - task: build-collect
      - task: build-faults
      - task: build-conform-engine
      - task: build-test262-runner

  build-test262-runner:
    desc: Build the release runner of test262 as the task test262 runs it, before the clock; the planted scripts of gate-selftest run it.
    summary: |
      Build the release runner of test262, "cargo build --locked --release -p swell-test262",
      into .out/build-test262-runner.log, and print "build-test262-runner: <cargo's Finished
      line>"; when cargo fails it prints the log and fails. A step of build-tests, before
      gate-time-start (story gate-test-steps-fit-four-cores): the planted scripts of
      gate-selftest that count a small checkout of their own run "cargo run --locked --release
      -q -p swell-test262" through the task test262 (taskfiles/test262.yml), and without this
      task the first of them built the runner inside the timed step gate-selftest. On the
      forge's runner that build has no compile cache and no target directory built before;
      here both hide it. It sets no RUSTFLAGS, as the task test262 sets none, so that the
      cargo run of those scripts finds the same build fresh; gate-time-sum fails a run whose
      test steps wrote into a target directory.
    silent: true
    cmds:
      - mkdir -p .out
      - |
        status=0
        cargo build --locked --release -p swell-test262 > .out/build-test262-runner.log 2>&1 || status=$?
        if [ "$status" -ne 0 ]; then cat .out/build-test262-runner.log; echo "build-test262-runner: cargo build failed, exit $status"; exit 1; fi
        esc=$(printf '\033')
        LC_ALL=C sed "s/$esc\[[0-9;]*[A-Za-z]//g" .out/build-test262-runner.log | awk '/^ *Finished / { sub(/^ */, ""); line = $0 } END { print "build-test262-runner: " line }'

  clippy:
    desc: Run clippy over every crate and target of the workspace; a warning or a denied lint fails it.
    silent: true
    cmds:
      - mkdir -p .out
      - cargo clippy --workspace --all-targets --locked -- -D warnings > .out/clippy.log 2>&1 || { cat .out/clippy.log; exit 1; }
      - tail -n 1 .out/clippy.log

  test:
    desc: Run every test of the workspace but the doc tests through cargo-nextest with warnings denied, the tests of swell::main the stack rule prints "other" at opt-level 1 and every other test at opt-level 0, and print the summed counts and the ten slowest tests.
    summary: |
      Run every test of the workspace but the doc tests (the step test-doc runs them) through
      cargo-nextest with warnings denied, each test once, in two runs, and print the summed
      counts and the ten slowest tests.

      The split (story gate-test-steps-hold-the-budget-on-the-slower-runner, item 3): the tests
      of swell's integration-test binary (swell::main) that taskfiles/realm-room-tests.awk -v
      rule=stack prints "other" run at opt-level 1, every other test of the workspace at
      opt-level 0. The rule reads crates/swell/tests/support/*.rs and every
      crates/swell/tests/*.rs but main.rs, as slow-tests hands it them, and prints a line
      "stack <module>::<test>" or "other <module>::<test>" for each #[test] function whose fn
      line names it (a third field is not read). A test it does not print (one a macro writes)
      and a name it prints that the binary does not hold (a test behind a cfg) are not in the
      run at opt-level 1. The task test-split writes the two nextest configurations, copies of
      .config/nextest.toml with one default-filter line: .out/test-opt1-nextest.toml
      (binary_id(swell::main) and the tests printed "other") and .out/test-opt0-nextest.toml
      (not those), and from "cargo nextest list" of each run and of the workspace without a
      filter it fails, naming the test, when a test is in not exactly one run; it prints "test:
      swell::main <a> at opt-level 1, <b> at opt-level 0".
        - The run at opt-level 1: "cargo nextest run <TEST_OPT1_ARGS>" with that
          configuration, TEST_OPT1_ARGS being "--locked -p swell --test main --config
          .cargo/collect-profile.toml --cargo-profile collect --profile default" (held, with
          NO_STACK_TESTS and TEST_OPT1_PROFILE_TEST, by test-opt1-vars-check): the default
          mode, without the feature collect-every-safe-point, in the profile collect (the test
          profile at opt-level 1; it inherits test, so debug assertions and overflow checks
          stay on, and the test TEST_OPT1_PROFILE_TEST at the top of this file holds both;
          test-split fails, naming it, when the run's list does not hold it). Its test processes get NO_STACK_TESTS (SWELL_NO_STACK_TESTS=1): a stack
          test in a form the rule does not read panics there with the guard's line
          (NO_STACK_TESTS_LINE of crates/swell/tests/support/host.rs) instead of passing on
          frames of another size. The log is .out/test-opt1.log; its JUnit file is copied to
          .out/test-opt1-junit.xml before the second run writes its own.
        - The run at opt-level 0: "cargo nextest run <TEST_NEXTEST_ARGS>" ("--workspace
          --locked --profile default", held by test-vars-check) with the other configuration.
          The log is .out/test.log.
      Each test runs in a process of its own, terminated at 60 s and counted failed
      (.config/nextest.toml; nextest-check holds it). The task test-sum prints one line for
      both runs, "<b> test binaries: <p> passed, <f> failed, <i> ignored": b is the count of
      the run at opt-level 0, whose Starting line counts every binary of the workspace,
      swell::main among them, so swell::main once; p and f are the sums of the runs (the task
      nextest-report reads each); i is the count of tests neither run ran (the skipped of the
      run at opt-level 0 less the tests the run at opt-level 1 ran), not the sum of what each
      filter skipped. Then ten lines "gate-slowest test <seconds> <binary> <test>" over both
      runs. It fails when a test fails or nextest does, and when no test ran; and when a log
      has a cargo Compiling line, naming build-tests, which builds both runs' binaries before
      the clock (task compile-check, on both logs).
    env:
      RUSTFLAGS: '{{.TEST_RUSTFLAGS}}'
    silent: true
    cmds:
      - task: test-vars-check
        vars: {STEP: test}
      - task: test-opt1-vars-check
        vars: {STEP: test}
      - mkdir -p .out
      - task: test-split
      - |
        rm -f .out/test-opt1-junit.xml target/nextest/default/junit.xml
        status=0
        {{.NO_STACK_TESTS}}=1 cargo nextest run {{.TEST_OPT1_ARGS}} --config-file "$(pwd)/.out/test-opt1-nextest.toml" > .out/test-opt1.log 2>&1 || status=$?
        echo "$status" > .out/test-opt1.status
        if [ -f target/nextest/default/junit.xml ]; then cp target/nextest/default/junit.xml .out/test-opt1-junit.xml; fi
        status=0
        cargo nextest run {{.TEST_NEXTEST_ARGS}} --config-file "$(pwd)/.out/test-opt0-nextest.toml" > .out/test.log 2>&1 || status=$?
        echo "$status" > .out/test.status
      - task: test-sum

  test-split:
    desc: Internal. Write the two nextest configurations of the step test's runs from the stack rule, and fail, naming the test, when cargo nextest list puts a test in not exactly one run.
    summary: |
      Internal, a command of the step test (story
      gate-test-steps-hold-the-budget-on-the-slower-runner, item 3). Runs
      taskfiles/realm-room-tests.awk -v rule=stack over crates/swell/tests/support/*.rs and every
      crates/swell/tests/*.rs but main.rs into .out/test-stack.txt, and writes two copies of
      .config/nextest.toml with one default-filter line after [profile.default]:
      .out/test-opt1-nextest.toml, "binary_id(swell::main) & (test(=<name>) | ...)" over the
      names the rule prints "other" (fields 1 and 2 of its lines), and
      .out/test-opt0-nextest.toml, "not (...)" of the same. It fails, with a line of its own,
      when crates/swell/tests/support/ holds no .rs file, when the rule prints no test
      "other" or when a file cannot be written. Then "cargo nextest list --message-format
      oneline" three times, into .out/test-list-all.txt (TEST_NEXTEST_ARGS without a filter),
      .out/test-list-opt1.txt (TEST_OPT1_ARGS with the first configuration) and
      .out/test-list-opt0.txt (TEST_NEXTEST_ARGS with the second), each line "<binary> <test>";
      a list that fails is printed with its log. It prints "test: <binary> <test> is in neither
      run" or "... is in both runs" for each test of the workspace's list that is not in
      exactly one of the two, "test: <binary> <test> is in a run but not in the workspace's
      list" for a name of a run that list lacks, and "test: swell::main <TEST_OPT1_PROFILE_TEST>
      is not in the run at opt-level 1 ..." when the list of that run does not hold the test
      that holds its profile (debug assertions and overflow checks on): a test the rule prints
      "stack", one in a nested mod or one a macro writes runs at opt-level 0, where it proves
      nothing of the profile collect. It fails after them, before any test runs; otherwise it
      prints "test: swell::main <a> at opt-level 1, <b> at opt-level 0". The
      lists run with RUSTFLAGS from TEST_RUSTFLAGS, as the build and the runs do (a task's env
      does not reach the tasks it calls, so this task sets its own), and a list whose log has a
      cargo Compiling line fails naming build-tests (task compile-check): a list that built
      would build inside the clock. The planted scripts
      tests/gate/test-runs-each-test-once-at-one-opt-level.sh,
      tests/gate/test-keeps-the-profile-test-in-its-run-at-opt-level-1.sh and
      tests/gate/test-says-why-it-fails-when-the-stack-rule-has-no-support-file.sh hold the
      checks.
    env:
      RUSTFLAGS: '{{.TEST_RUSTFLAGS}}'
    silent: true
    cmds:
      - |
        set --
        for f in crates/swell/tests/support/*.rs; do if [ -f "$f" ]; then set -- "$@" "$f"; fi; done
        [ "$#" -gt 0 ] || { echo "test: crates/swell/tests/support/ holds no .rs file, which taskfiles/realm-room-tests.awk -v rule=stack reads to follow a test's calls into the helpers that start a bounded stack (stack_with_room, stack_thread); no test ran"; exit 1; }
        for f in crates/swell/tests/*.rs; do [ "$f" = crates/swell/tests/main.rs ] || set -- "$@" "$f"; done
        list=.out/test-stack.txt
        awk -v rule=stack -f taskfiles/realm-room-tests.awk "$@" > "$list" || { echo "test: taskfiles/realm-room-tests.awk -v rule=stack failed, or $list cannot be written"; exit 1; }
        want=$(awk '$1 == "other" { n++ } END { print n + 0 }' "$list")
        [ "$want" -gt 0 ] || { echo "test: taskfiles/realm-room-tests.awk -v rule=stack prints no test of swell::main \"other\" ($list)"; exit 1; }
        for form in opt1 opt0; do
          cfg=.out/test-$form-nextest.toml
          if [ -f .config/nextest.toml ]; then set -- "$list" .config/nextest.toml; else set -- "$list"; fi
          awk -v form="$form" '
            function put(i) {
              printf "default-filter = '\''%s", (form == "opt0" ? "not (binary_id(swell::main) & (" : "binary_id(swell::main) & (")
              for (i = 1; i <= n; i++) printf "%s%s", (i > 1 ? " | " : ""), "test(=" name[i] ")"
              printf "%s'\''\n", (form == "opt0" ? "))" : ")")
            }
            FILENAME == ARGV[1] { if ($1 == "other") name[++n] = $2; next }
            { print }
            /^[ \t]*\[profile\.default\][ \t]*$/ { put() }
            END { if (ARGC == 2) { print "[profile.default]"; put() } }
          ' "$@" > "$cfg" || { echo "test: cannot write $cfg, the nextest configuration of the run $form"; exit 1; }
          lines=$(awk '/^[ \t]*default-filter[ \t]*=/ { n++ } END { print n + 0 }' "$cfg")
          named=$(awk '/^default-filter = / { c += gsub(/test\(=/, "&") } END { print c + 0 }' "$cfg")
          if [ ! -s "$cfg" ] || [ "$lines" != 1 ] || [ "$named" != "$want" ]; then
            echo "test: $cfg holds $lines default-filter line(s) naming $named of the $want tests printed other, not one line naming all of them (.config/nextest.toml has no line [profile.default], or a default-filter of its own)"
            exit 1
          fi
        done
      - |
        esc=$(printf '\033')
        listed() {
          out=$1
          shift
          status=0
          cargo nextest list --message-format oneline "$@" > "$out.raw" 2> "$out.log" || status=$?
          if [ "$status" -ne 0 ]; then cat "$out.log" "$out.raw"; echo "test: cargo nextest list $* failed, exit $status"; exit 1; fi
          LC_ALL=C sed "s/$esc\[[0-9;]*[A-Za-z]//g" "$out.raw" | LC_ALL=C awk 'NF == 2' > "$out"
        }
        listed .out/test-list-all.txt {{.TEST_NEXTEST_ARGS}}
        listed .out/test-list-opt1.txt {{.TEST_OPT1_ARGS}} --config-file "$(pwd)/.out/test-opt1-nextest.toml"
        listed .out/test-list-opt0.txt {{.TEST_NEXTEST_ARGS}} --config-file "$(pwd)/.out/test-opt0-nextest.toml"
      - task: compile-check
        vars: {STEP: test, LOG: .out/test-list-all.txt.log, BUILT_BY: build-tests}
      - task: compile-check
        vars: {STEP: test, LOG: .out/test-list-opt1.txt.log, BUILT_BY: build-tests}
      - task: compile-check
        vars: {STEP: test, LOG: .out/test-list-opt0.txt.log, BUILT_BY: build-tests}
      - |
        LC_ALL=C awk -v keep={{shellQuote .TEST_OPT1_PROFILE_TEST}} '
          FILENAME == ARGV[1] { all[$0] = 1; order[++n] = $0; next }
          FILENAME == ARGV[2] { one[$0]++; if (!($0 in all)) stray[$0] = 1; if ($1 == "swell::main") a++; if ($0 == "swell::main " keep) kept = 1; next }
          { zero[$0]++; if (!($0 in all)) stray[$0] = 1; if ($1 == "swell::main") b++ }
          END {
            for (i = 1; i <= n; i++) {
              t = order[i]; c = one[t] + zero[t]
              if (c == 0) { print "test: " t " is in neither run"; bad++ }
              else if (c > 1) { print "test: " t " is in both runs"; bad++ }
            }
            for (t in stray) { print "test: " t " is in a run but not in the workspace'\''s list"; bad++ }
            if (!n) { print "test: cargo nextest list names no test of the workspace (.out/test-list-all.txt)"; exit 1 }
            if (!kept) printf "test: swell::main %s is not in the run at opt-level 1 (.out/test-list-opt1.txt); it holds that debug assertions and overflow checks are on in that run'\''s profile and proves it only there: the stack rule prints it \"other\" from a #[test] fn of a module file of crates/swell/tests/ whose text calls no stack_with_room( or stack_thread(\n", keep
            if (bad) printf "test: %d test(s) not in exactly one run of the %d the workspace lists; every test runs once, at opt-level 1 (.out/test-list-opt1.txt) or at opt-level 0 (.out/test-list-opt0.txt)\n", bad, n
            if (bad || !kept) exit 1
            printf "test: swell::main %d at opt-level 1, %d at opt-level 0\n", a, b
          }
        ' .out/test-list-all.txt .out/test-list-opt1.txt .out/test-list-opt0.txt

  test-sum:
    desc: Internal. Print one line of counts and the ten slowest tests over the two runs of the step test, and fail when either failed.
    summary: |
      Internal, the last command of the step test. Runs the task nextest-report on each run,
      its output into a file of its own (.out/test-opt1.report with .out/test-opt1.log,
      .out/test-opt1.status and .out/test-opt1-junit.xml; .out/test.report with .out/test.log,
      .out/test.status and target/nextest/default/junit.xml), each with BUILT_BY build-tests,
      so that compile-check reads both logs. It prints one line "<b> test binaries: <p> passed,
      <f> failed, <i> ignored": b is that of the run at opt-level 0, the workspace, whose
      Starting line counts every binary, swell::main among them, so swell::main once; p and f
      the sums of the two reports, i the ignored of the run at opt-level 0 (all it skipped)
      less the tests the run at opt-level 1 ran (its passed and failed), so the tests neither
      run ran. Then the ten
      slowest of both reports' gate-slowest lines, slowest first. When a report failed it is
      printed whole first (the log of its run, its counts, its slowest, a Compiling line), and
      the task fails after the lines. It starts nextest-report with the task executable it runs
      in, TASK_EXE, from the directory of Taskfile.yml: a path that names a directory and is
      not absolute is the caller's (./bin/task -d <tree> check) and is taken from
      USER_WORKING_DIR; a bare name is looked up in PATH. The planted script
      tests/gate/test-sums-its-runs-when-task-is-called-by-a-relative-path.sh holds it.
    silent: true
    cmds:
      - |
        ok=1
        exe={{shellQuote .TASK_EXE}}
        case $exe in /*) ;; */*) exe={{shellQuote .USER_WORKING_DIR}}/$exe ;; esac
        "$exe" nextest-report STEP=test PREFIX= LOG=.out/test-opt1.log STATUS=.out/test-opt1.status JUNIT=.out/test-opt1-junit.xml MIN_PASSED=1 BUILT_BY=build-tests > .out/test-opt1.report 2>&1 || { cat .out/test-opt1.report; ok=0; }
        "$exe" nextest-report STEP=test PREFIX= LOG=.out/test.log STATUS=.out/test.status JUNIT=target/nextest/default/junit.xml MIN_PASSED=1 BUILT_BY=build-tests > .out/test.report 2>&1 || { cat .out/test.report; ok=0; }
        LC_ALL=C awk '
          /^[0-9]+ test binaries: [0-9]+ passed, [0-9]+ failed, [0-9]+ ignored$/ {
            r = (FILENAME == ARGV[1]) ? 1 : 2
            got[r] = 1; binaries[r] = $1; passed[r] = $4; failed[r] = $6; ignored[r] = $8
          }
          END {
            if (!got[1] || !got[2]) { printf "test: no line of counts in %s\n", (!got[1] ? ARGV[1] : ARGV[2]); exit 1 }
            printf "%d test binaries: %d passed, %d failed, %d ignored\n", binaries[2], passed[1] + passed[2], failed[1] + failed[2], ignored[2] - passed[1] - failed[1]
          }
        ' .out/test-opt1.report .out/test.report || ok=0
        grep -h '^gate-slowest test ' .out/test-opt1.report .out/test.report | LC_ALL=C sort -k3,3gr -k4,4 -k5,5 | head -n 10
        [ "$ok" -eq 1 ]

  test-doc:
    desc: Run the doc tests of the workspace, and those of swell with the collector run at every safe point, with warnings denied, and print the summed counts.
    summary: |
      Run the doc tests of the workspace, which cargo-nextest does not run, and those of swell
      with the feature collect-every-safe-point (the doc tests of the step test-collect), with
      warnings denied, and print the summed counts.

      Runs "cargo test --workspace --locked --doc" into .out/test-doc.log and "cargo test
      --locked -p swell --features collect-every-safe-point --config .cargo/collect-profile.toml
      --profile collect --doc" into .out/test-doc-collect.log, in the profile collect of the
      step test-collect (taskfiles/collect-mode.yml, whose variable COLLECT_CONFIG gives the
      --config flag), whose library build-collect makes; a log is printed when its cargo
      fails. The lines printed sum the
      "test result:" lines of each as "test-doc: <n> test suites: <p> passed, <f> failed, <i>
      ignored" and "test-doc collect-every-safe-point: <n> test suites: ...". It fails when
      cargo fails, a test fails, or a run prints no "test result:" line. The libraries the doc
      tests link are built before the clock, by build-tests and build-collect; each log fails
      the step when it has a cargo Compiling line, naming that task (task compile-check). The
      doc tests themselves rustdoc compiles as it runs them, inside the step: they print no
      Compiling line, and no build task can make them ahead (cargo refuses --no-run with
      --doc).
    env:
      RUSTFLAGS: '{{.TEST_RUSTFLAGS}}'
    silent: true
    cmds:
      - task: test-vars-check
        vars: {STEP: test-doc}
      - mkdir -p .out
      - |
        bad=0
        for mode in default collect; do
          if [ "$mode" = default ]; then
            log=.out/test-doc.log; label=test-doc
            status=0; cargo test --workspace --locked --doc > "$log" 2>&1 || status=$?
          else
            log=.out/test-doc-collect.log; label="test-doc collect-every-safe-point"
            status=0; cargo test --locked -p swell --features collect-every-safe-point {{.COLLECT_CONFIG}} --profile collect --doc > "$log" 2>&1 || status=$?
          fi
          if [ "$status" -ne 0 ]; then cat "$log"; fi
          awk -v status="$status" -v label="$label" '
            /^test result: / {
              suites++
              for (i = 1; i < NF; i++) {
                count = $i
                gsub(/[^0-9]/, "", count)
                if ($(i + 1) ~ /^passed/) passed += count
                if ($(i + 1) ~ /^failed/) failed += count
                if ($(i + 1) ~ /^ignored/) ignored += count
              }
            }
            END {
              print label ": " suites+0 " test suites: " passed+0 " passed, " failed+0 " failed, " ignored+0 " ignored"
              if (status != 0 || failed > 0 || suites == 0) exit 1
            }
          ' "$log" || bad=1
        done
        exit "$bad"
      - task: compile-check
        vars: {STEP: test-doc, LOG: .out/test-doc.log, BUILT_BY: build-tests}
      - task: compile-check
        vars: {STEP: test-doc collect-every-safe-point, LOG: .out/test-doc-collect.log, BUILT_BY: build-collect}

  gate-selftest:
    desc: Run every planted-defect script of tests/gate/ in the environment of the forge's runner and fail when one does not refuse its defect or writes colour.
    summary: |
      Run every planted-defect script of tests/gate/ in the environment of the forge's runner
      and fail when one does not refuse its defect or writes colour.

      Each GATE_SELFTEST_DIR/<name>.sh (default tests/gate) runs with sh from the root and
      works under .out/gate-tests/<name>/. They run GATE_SELFTEST_JOBS at a time (default 4: most
      of them wait on files and on cargo's one lock of target/ rather than on a CPU, and four keep
      a runner of four CPUs busy without crowding it), taken in byte order of the names through
      xargs -P, which starts the next script as soon as one ends (not four, then the next four
      once the slowest of them has ended); each writes its own log, and the results are printed
      afterwards in that order, each whole.
      GATE_SELFTEST_DIR is not
      put in the scripts' environment: go-task lets a variable of the environment win over a
      task's env, so a script that runs gate-selftest on a directory of its own would get
      tests/gate again and run itself without end. It passes when it exits 0,
      its last line is "<name>: ok", and neither its output nor a *.log or *.out file of its
      directory (target/ and .git/ left out) holds an escape byte or a "::error" line. Its
      output goes to .out/gate-tests/<name>.log. A passing script prints its last line. A
      failing one prints "<name>: failed, exit <n>; the last 20 lines of <log>:" and those
      lines, each after "  | ", with every control byte written as \ooo and a backslash as \\,
      so that a CI log shows the reason and nothing in it is interpreted; one that passes with
      colour or an annotation in its logs prints "<name>: passes, but its logs hold an escape
      byte or a ::error line: <files>" and counts as failed.
      The scripts run in the environment of a CI runner on GitHub Actions, whatever the caller
      has set (CI=true, GITHUB_ACTIONS=true, CARGO_TERM_COLOR=always, FORCE_COLOR=1,
      CLICOLOR_FORCE=1, NO_COLOR unset; CARGO_INCREMENTAL as the caller has it, so that a script
      builds against target/ as the rest of the gate does): there go-task colours its messages and
      adds a "::error" line to a failing task's output, and cargo colours its own. So each
      script must turn both off itself, and does it in its first lines; each script runs once,
      and this is the check that it is colour-proof (gate-selftest-is-colour-proof shows that
      the environment does colour task's output and that a script that does not turn it off is
      refused). No script at all fails too.
      A script writes no tracked file. Before the scripts run, the task records each tracked
      file of the git work tree GATE_SELFTEST_TREE (default .) that differs from its commit at
      HEAD, with the git digest of its content; afterwards it records them again and fails when
      the two records differ, printing "gate-selftest: the scripts changed tracked files of
      <tree> (compared with before they ran): <files>" (story
      gate-selftests-write-no-tracked-file: one script overwrote website/data/engines.json with
      planted counts on every run). A change that was there before the step and stays as it was
      does not count; one the scripts change further, or undo, does. Untracked and ignored files
      (.out/, target/) are not read. GATE_SELFTEST_TREE is not put in the scripts' environment,
      for the reason given for GATE_SELFTEST_DIR (gate-selftest-refuses-a-script-that-writes-a-tracked-file
      runs the task on a git repository of its own). The last line is "gate-selftest: <p>
      passed, <f> failed", also written to .out/gate-selftest.log.
      Most scripts start go-task several times, each a short process that reads the task
      files and ends; they run with GOGC=off and GOMEMLIMIT=1GiB, so that the Go runtime
      of each collects only if its heap nears 1 GiB rather than while it starts: the 65
      scripts took 36.9 CPU seconds so, against 43.0 with the runtime's default, run one
      after another (measured on 2026-11-23). Nothing a script checks reads these variables.
    silent: true
    vars:
      GATE_SELFTEST_DIR: '{{.GATE_SELFTEST_DIR | default "tests/gate"}}'
      GATE_SELFTEST_JOBS: '{{.GATE_SELFTEST_JOBS | default "4"}}'
      GATE_SELFTEST_TREE: '{{.GATE_SELFTEST_TREE | default "."}}'
    cmds:
      - mkdir -p .out/gate-tests
      - |
        GATE_SELFTEST_DIR={{shellQuote .GATE_SELFTEST_DIR}}
        unset NO_COLOR
        export CI=true GITHUB_ACTIONS=true CARGO_TERM_COLOR=always FORCE_COLOR=1 CLICOLOR_FORCE=1
        export GOGC=off GOMEMLIMIT=1GiB
        esc=$(printf '\033')
        passed=0
        failed=0
        scripts=$(find "$GATE_SELFTEST_DIR" -maxdepth 1 -type f -name '*.sh' | LC_ALL=C sort)
        jobs={{shellQuote .GATE_SELFTEST_JOBS}}
        case "$jobs" in ''|*[!0-9]*|0) echo "gate-selftest: GATE_SELFTEST_JOBS $jobs is not a positive number"; exit 1 ;; esac
        tree={{shellQuote .GATE_SELFTEST_TREE}}
        top=$(git -C "$tree" rev-parse --show-toplevel 2>/dev/null) && base=$(git -C "$top" rev-parse --verify -q HEAD) ||
          { echo "gate-selftest: git cannot read the tracked files of $tree (GATE_SELFTEST_TREE)"; exit 1; }
        tracked() {
          git -C "$top" --no-optional-locks -c core.quotePath=false diff --no-ext-diff --no-renames --name-only "$base" -- |
            while IFS= read -r path; do
              if [ -e "$top/$path" ]; then
                printf '%s\t%s\n' "$path" "$(git -C "$top" hash-object -- "$path")"
              else
                printf '%s\tgone\n' "$path"
              fi
            done
        }
        before=$(tracked) || { echo "gate-selftest: git cannot list the changed tracked files of $tree"; exit 1; }
        for script in $scripts; do
          name=${script##*/}
          rm -f ".out/gate-tests/${name%.sh}.log.status"
        done
        printf '%s\n' $scripts | xargs -r -P "$jobs" -n 1 sh -c '
          name=${1##*/}
          name=${name%.sh}
          log=.out/gate-tests/$name.log
          status=0
          sh "$1" > "$log" 2>&1 || status=$?
          echo "$status" > "$log.status"
        ' gate-selftest-job || :
        for script in $scripts; do
          name=${script##*/}
          name=${name%.sh}
          log=.out/gate-tests/$name.log
          status=$(cat "$log.status" 2>/dev/null) || status=
          [ -n "$status" ] || status=1
          if [ "$status" -eq 0 ] && [ "$(tail -n 1 "$log")" = "$name: ok" ]; then
            marked=$(
              {
                echo "$log"
                if [ -d ".out/gate-tests/$name" ]; then
                  find ".out/gate-tests/$name" \( -name target -o -name .git \) -prune -o -type f \
                    \( -name '*.log' -o -name '*.out' \) -print | LC_ALL=C sort
                fi
              } | while read -r file; do
                if grep -q "$esc" "$file" || grep -q '^::error ' "$file"; then echo "$file"; fi
              done
            )
            if [ -n "$marked" ]; then
              failed=$((failed + 1))
              echo "$name: passes, but its logs hold an escape byte or a ::error line:" $marked
            else
              passed=$((passed + 1))
              tail -n 1 "$log"
            fi
          else
            failed=$((failed + 1))
            echo "$name: failed, exit $status; the last 20 lines of $log:"
            tail -n 20 "$log" | LC_ALL=C awk '
              BEGIN {
                for (i = 1; i < 32; i++) code[sprintf("%c", i)] = sprintf("\\%03o", i)
                code[sprintf("%c", 127)] = "\\177"
                code["\\"] = "\\\\"
              }
              {
                out = ""
                n = length($0)
                for (i = 1; i <= n; i++) {
                  c = substr($0, i, 1)
                  out = out ((c in code) ? code[c] : c)
                }
                print "  | " out
              }
            '
          fi
        done
        if [ $((passed + failed)) -eq 0 ]; then echo "gate-selftest: no script under $GATE_SELFTEST_DIR"; fi
        after=$(tracked) || { echo "gate-selftest: git cannot list the changed tracked files of $tree"; exit 1; }
        written=$(
          { printf '%s\n' "$before" | sed 's/^/before\t/'; printf '%s\n' "$after" | sed 's/^/after\t/'; } |
            awk -F '\t' '
              $2 == "" { next }
              { seen[$2] = 1; state[$1, $2] = $3 }
              END { for (p in seen) if (state["before", p] != state["after", p]) print p }
            ' | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//'
        )
        if [ -n "$written" ]; then
          echo "gate-selftest: the scripts changed tracked files of $tree (compared with before they ran): $written"
        fi
        echo "gate-selftest: $passed passed, $failed failed" | tee .out/gate-selftest.log
        test "$((passed + failed))" -gt 0 && test "$failed" -eq 0 && test -z "$written"
